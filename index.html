ned up with the 12/9 quiz ---------- */\n \"d6\":CV({text:\"Hailey’s family drove 12 <mark class=uf>miles<\/mark> to the beach. How many <mark class=ut>kilometers<\/mark> did they drive? <b>Do not round.<\/b>\",\n   a:[1,\"mi\"],b:[1.61,\"km\"],g:[12,\"mi\"],eq:\"1 mile ≈ 1.61 kilometers\",cc:true,exact:true}),\n \"d7\":{pure:true,text:\"Solve for x. <b>Do not round.<\/b>\",cells:[1.6,10,7,null],exact:true},\n \"d8\":{pure:true,text:\"Solve for x. <b>Do not round.<\/b>\",cells:[null,3.6,7,20],exact:true},\n \"d15\":{text:\"Mila’s hot chocolate recipe uses 6 scoops of cocoa for every 2.5 cups of milk. She uses 9 scoops of cocoa. How many cups of milk should she use? <b>Type your answer as a decimal (no mixed numbers).<\/b>\",\n  cells:[6,2.5,9,null],units:[\"scoops\",\"cups\"],decOnly:true,\n  setup:SU([[6,\"scoops\"],[2.5,\"cups\"],[9,\"scoops\"],[X,\"cups\"]],\n    [[[6,\"scoops\"],[2.5,\"cups\"],[X,\"scoops\"],[9,\"cups\"]],\"9 is scoops, so it goes with the scoops.\"],\n    [[[2.5,\"scoops\"],[6,\"cups\"],[9,\"scoops\"],[X,\"cups\"]],\"It's 6 scoops for 2.5 cups.\"])},\n \"d23\":{text:\"John paid $11.25 for 2.5 pounds of ground turkey. What is the unit price <mark class=one>per pound<\/mark>?\",\n  cells:[11.25,2.5,null,1],units:[\"$\",\"lb\"],xu:\"lb\",one:true,note:\"Unit price means the price of 1 pound\",\n  setup:SU([[11.25,\"$\"],[2.5,\"lb\"],[X,\"$\"],[1,\"lb\"]],\n    [[[2.5,\"$\"],[11.25,\"lb\"],[X,\"$\"],[1,\"lb\"]],\"It's $11.25 for 2.5 pounds.\"],\n    [[[11.25,\"$\"],[2.5,\"lb\"],[X,\"$\"],[1,\"$\"]],\"We want the price of 1 pound, not 1 dollar.\"])},\n \"d24\":CV({text:\"A fish tank holds 30.32 <mark class=uf>liters<\/mark> of water. How many <mark class=ut>gallons<\/mark> does it hold?\",\n   a:[1,\"gal\"],b:[3.79,\"L\"],g:[30.32,\"L\"],eq:\"1 gallon ≈ 3.79 liters\",cc:true,exact:true}),\n \"c2bpc\":{text:\"The varsity boys’ basketball team has a ratio of seniors to juniors of 7:4. <b>Part B:<\/b> The varsity girls’ basketball team has a ratio of seniors to juniors that is 3 to 2. If each team has 12 juniors, which team has more seniors?<br><b>Step 1: Set up a proportion for the boys’ team.<\/b>\",\n  cells:[7,4,null,12],units:[\"seniors\",\"juniors\"],thenLabel:\"Do the girls’ team\",thenPrompt:\"The boys’ team has 21 seniors. Now set up a proportion for the girls’ team.\",\n  setup:SU([[7,\"seniors\"],[4,\"juniors\"],[X,\"seniors\"],[12,\"juniors\"]],\n    [[[4,\"seniors\"],[7,\"juniors\"],[X,\"seniors\"],[12,\"juniors\"]],\"7:4 means 7 seniors to 4 juniors.\"],\n    [[[3,\"seniors\"],[2,\"juniors\"],[X,\"seniors\"],[12,\"juniors\"]],\"3 to 2 is the girls’ team. Start with the boys’ team.\"]),\n  then:{text:\"The varsity boys’ basketball team has a ratio of seniors to juniors of 7:4. <b>Part B:<\/b> The varsity girls’ basketball team has a ratio of seniors to juniors that is 3 to 2. If each team has 12 juniors, which team has more seniors?<br>The boys’ team has 21 seniors. <b>Step 2: Set up a proportion for the girls’ team.<\/b>\",\n    cells:[3,2,null,12],units:[\"seniors\",\"juniors\"],\n    setup:SU([[3,\"seniors\"],[2,\"juniors\"],[X,\"seniors\"],[12,\"juniors\"]],\n      [[[2,\"seniors\"],[3,\"juniors\"],[X,\"seniors\"],[12,\"juniors\"]],\"3 to 2 means 3 seniors to 2 juniors.\"],\n      [[[7,\"seniors\"],[4,\"juniors\"],[X,\"seniors\"],[12,\"juniors\"]],\"7:4 is the boys’ team. This one is the girls’ team.\"]),\n    choose:{q:\"The boys’ team has 21 seniors. The girls’ team has 18 seniors. Which team has more seniors?\",\n      choices:[\"A. the boys’ team\",\"B. the girls’ team\"],correct:0,fbs:[\"\",\"Compare 21 and 18.\"],say:\"the boys’ team has more seniors\"}}},\n /* ---------- Ratios Study Guide 3 Fun Fact Edition ---------- */\n \"e1\":{text:\"The ratio of chocolate chips to raisins in Skylar’s trail mix is 5:3. If there are 35 chocolate chips, how many raisins are there?\",\n  cells:[5,3,35,null],units:[\"chips\",\"raisins\"],\n  setup:SU([[5,\"chips\"],[3,\"raisins\"],[35,\"chips\"],[X,\"raisins\"]],\n    [[[3,\"chips\"],[5,\"raisins\"],[35,\"chips\"],[X,\"raisins\"]],\"5:3 means 5 chocolate chips, 3 raisins.\"],\n    [[[5,\"chips\"],[3,\"raisins\"],[X,\"chips\"],[35,\"raisins\"]],\"The 35 are chocolate chips.\"])},\n \"e7\":CV({text:\"Chloe’s family drove 35 <mark class=uf>miles<\/mark> to the zoo. How many <mark class=ut>kilometers<\/mark> did they drive? <b>Do not round.<\/b>\",\n   a:[1,\"mi\"],b:[1.61,\"km\"],g:[35,\"mi\"],eq:\"1 mile ≈ 1.61 kilometers\",cc:true,exact:true}),\n \"e8\":{pure:true,text:\"Solve for x. <b>Do not round.<\/b>\",cells:[2.5,12,7,null],exact:true},\n \"e9\":{pure:true,text:\"Solve for x. <b>Do not round.<\/b>\",cells:[null,2.5,9,15],exact:true},\n \"e10\":CV({text:\"Veer’s bowling ball weighs 12 <mark class=uf>pounds<\/mark>. How many <mark class=ut>kilograms<\/mark> does it weigh? <b>Do not round.<\/b>\",\n   a:[1,\"lb\"],b:[0.454,\"kg\"],g:[12,\"lb\"],eq:\"1 pound ≈ 0.454 kilogram\",cc:true,exact:true}),\n \"e11\":{text:\"Gila’s printer can print 72 pages in 8 minutes. If the printer keeps the same rate, how many pages can it print in 11 minutes?\",\n  cells:[72,8,null,11],units:[\"pages\",\"min\"],xu:\"min\",\n  setup:SU([[72,\"pages\"],[8,\"min\"],[X,\"pages\"],[11,\"min\"]],\n    [[[8,\"pages\"],[72,\"min\"],[X,\"pages\"],[11,\"min\"]],\"72 is pages, 8 is minutes.\"],\n    [[[72,\"pages\"],[8,\"min\"],[11,\"pages\"],[X,\"min\"]],\"11 is minutes, not pages.\"])},\n \"e12\":{text:\"Mick bought a pack of 5 pairs of socks for $13.75. What is the unit price <mark class=one>per pair<\/mark>?\",\n  cells:[13.75,5,null,1],units:[\"$\",\"pairs\"],xu:\"pairs\",one:true,note:\"Unit price means the price of 1 pair\",\n  setup:SU([[13.75,\"$\"],[5,\"pairs\"],[X,\"$\"],[1,\"pairs\"]],\n    [[[5,\"$\"],[13.75,\"pairs\"],[X,\"$\"],[1,\"pairs\"]],\"It’s $13.75 for 5 pairs.\"],\n    [[[13.75,\"$\"],[5,\"pairs\"],[X,\"$\"],[1,\"$\"]],\"We want the price of 1 pair, not 1 dollar.\"])},\n \"e13\":{text:\"A garden snail crawled 33 inches in 15 minutes. How many inches did it crawl <mark class=one>per minute<\/mark>? <b>Your answer should be in decimal form.<\/b>\",\n  cells:[33,15,null,1],units:[\"in\",\"min\"],xu:\"min\",one:true,decOnly:true,note:\"Per minute means in 1 minute\",\n  setup:SU([[33,\"in\"],[15,\"min\"],[X,\"in\"],[1,\"min\"]],\n    [[[15,\"in\"],[33,\"min\"],[X,\"in\"],[1,\"min\"]],\"It’s 33 inches in 15 minutes.\"],\n    [[[33,\"in\"],[15,\"min\"],[X,\"in\"],[1,\"in\"]],\"We want inches for 1 minute, not 1 inch.\"])},\n \"e14\":{text:\"Gabriela can frost 8 cupcakes in 15 minutes. If Gabriela keeps the same rate, how many cupcakes can she frost in 3 hours?\",\n  cells:[8,15,null,180],units:[\"cupcakes\",\"min\"],xu:\"min\",note:\"3 hours = 180 min\",\n  setup:SU([[8,\"cupcakes\"],[15,\"min\"],[X,\"cupcakes\"],[180,\"min\"]],\n    [[[8,\"cupcakes\"],[15,\"min\"],[X,\"cupcakes\"],[3,\"hr\"]],\"Not the same unit. 3 hours = ? minutes.\"],\n    [[[8,\"cupcakes\"],[15,\"min\"],[X,\"cupcakes\"],[3,\"min\"]],\"Same unit, wrong amount of time. 3 hours is much more than 3 minutes.\"])},\n \"e15a\":{text:\"The ratio of boys to girls in Alyssa's art club is 2 to 3. The ratio of boys to girls in Taleen's chess club is 5 to 6. Each club has a total of 18 girls. <b>How many boys are in Alyssa's art club?<\/b>\",\n  cells:[2,3,null,18],units:[\"boys\",\"girls\"],\n  setup:SU([[2,\"boys\"],[3,\"girls\"],[X,\"boys\"],[18,\"girls\"]],\n    [[[3,\"boys\"],[2,\"girls\"],[X,\"boys\"],[18,\"girls\"]],\"In Alyssa's art club it's 2 boys to 3 girls.\"],\n    [[[5,\"boys\"],[6,\"girls\"],[X,\"boys\"],[18,\"girls\"]],\"5 to 6 is Taleen's chess club. This one is Alyssa's art club.\"])},\n \"e15b\":{text:\"The ratio of boys to girls in Alyssa's art club is 2 to 3. The ratio of boys to girls in Taleen's chess club is 5 to 6. Each club has a total of 18 girls. <b>How many boys are in Taleen's chess club?<\/b>\",\n  cells:[5,6,null,18],units:[\"boys\",\"girls\"],\n  setup:SU([[5,\"boys\"],[6,\"girls\"],[X,\"boys\"],[1 400,\"parts\"],[1000,\"defective\"],[X,\"parts\"]],\"1000 is the whole shipment of parts.\"])},\n \"c21\":{text:\"Joseph drives 125 miles in 2½ hours. At the same rate, how far will he be able to travel in 6¾ hours? <b>Write your answer as a mixed number.<\/b>\",\n  cells:[125,2.5,null,6.75],units:[\"miles\",\"hr\"],xu:\"hr\",mixed:true,note:\"2½ = 2.5 and 6¾ = 6.75\",\n  setup:SU([[125,\"miles\"],[2.5,\"hr\"],[X,\"miles\"],[6.75,\"hr\"]],\n    [[[2.5,\"miles\"],[125,\"hr\"],[X,\"miles\"],[6.75,\"hr\"]],\"125 is miles, 2½ is hours.\"],\n    [[[125,\"miles\"],[2.5,\"hr\"],[6.75,\"miles\"],[X,\"hr\"]],\"6¾ is hours, not miles.\"])},\n \"c22\":{text:\"To determine the number of deer in a forest, a forest ranger tags 280 and releases them back into the forest. Later, 405 deer are caught, out of which 45 of them are tagged. Estimate how many deer are in the forest.\",\n  cells:[45,405,280,null],units:[\"tagged\",\"deer\"],note:\"Tagged on top, all the deer on the bottom\",\n  setup:SU([[45,\"tagged\"],[405,\"deer\"],[280,\"tagged\"],[X,\"deer\"]],\n    [[[405,\"tagged\"],[45,\"deer\"],[280,\"tagged\"],[X,\"deer\"]],\"45 of the 405 deer caught were tagged.\"],\n    [[[45,\"tagged\"],[405,\"deer\"],[X,\"tagged\"],[280,\"deer\"]],\"The 280 deer are the tagged ones.\"])},\n \"c23\":{text:\"An employee working at an electronics store earned $3582 for working 3 months during the summer. What did the employee earn for the first two months?\",\n  cells:[3582,3,null,2],units:[\"$\",\"months\"],xu:\"months\",\n  setup:SU([[3582,\"$\"],[3,\"months\"],[X,\"$\"],[2,\"months\"]],\n    [[[3,\"$\"],[3582,\"months\"],[X,\"$\"],[2,\"months\"]],\"It's $3582 for 3 months.\"],\n    [[[3582,\"$\"],[3,\"months\"],[2,\"$\"],[X,\"months\"]],\"2 is months, not dollars.\"])},\n \"c24\":{text:\"A yard of fabric costs $12.99. How much will 2 <b><u>feet<\/u><\/b> cost?\",\n  cells:[12.99,3,null,2],units:[\"$\",\"ft\"],xu:\"ft\",note:\"1 yard = 3 feet\",\n  setup:SU([[12.99,\"$\"],[3,\"ft\"],[X,\"$\"] ],\"Naomi's has 9 oat for every 5 blueberry.\"])},\n \"c27\":{mc:true,q:{text:\"Select all of the equivalent ratios that belong in this table.<br><table class=sgt><tr><th>x<\/th><td><\/td><td>6<\/td><td><\/td><td>12<\/td><td><\/td><\/tr><tr><th>y<\/th><td><\/td><td>4<\/td><td><\/td><td>8<\/td><td><\/td><\/tr><\/table>\",\n   simp:[{name:\"Table\",r:[6,4],say:\"First simplify the table's ratio: x to y is 6 to 4.\"},{name:\"3/3\",r:[3,3],say:\"Simplify 3/3.\"},{name:\"8/6\",r:[8,6],say:\"Simplify 8/6.\"},{name:\"9/6\",r:[9,6],say:\"Simplify 9/6.\"},{name:\"15/10\",r:[15,10],say:\"Simplify 15/10.\"},{name:\"20/15\",r:[20,15],say:\"Simplify 20/15.\"},{name:\"24/20\",r:[24,20],say:\"Simplify 24/20.\"}],\n   simpOrder:\"Keep the same order: x first, then y.\",\n   prompt:\"Now compare. Select <b>all<\/b> the ratios that simplify to the table's 3/2, then Check.\",multi:true,\n   choices:[fr(3,3),fr(8,6),fr(9,6),fr(15,10),fr(20,15),fr(24,20)],correct:[2,3],\n   fbs:[\"3/3 = 1/1, not 3/2.\",\"8/6 = 4/3, not 3/2.\",\"\",\"\",\"20/15 = 4/3, not 3/2.\",\"24/20 = 6/5, not 3/2.\"],\n   hint:\"Simplify each one. Which ones become 3/2?\",\n   why:\"6/4 = 3/2. 9/6 = 3/2 and 15/10 = 3/2. The others simplify to 1/1, 4/3, 4/3 and 6/5\",a:\"9/6 and 15/10\"}},\n \"11\":CV({text:\"30 <mark class=uf>miles<\/mark> = _______ <mark class=ut>kilometers<\/mark>\",\n   a:[1,\"mi\"],b:[1.61,\"km\"],g:[30,\"mi\"],eq:\"1 mile ≈ 1.61 kilometers\",cc:true}),\n \"15\":CV({text:\"300 <mark class=uf>centimeters<\/mark> = ________ <mark class=ut>inches<\/mark>. <b>Round to the nearest tenth.<\/b> (1 inch = 2.54 centimeters)\",\n   a:[1,\"in\"],b:[2.54,\"cm\"],g:[300,\"cm\"],eq:\"1 inch = 2.54 centimeters\",cc:true,round:1}),\n \"12\":{pure:true,best:\"simp\",text:\"Solve for x. Round your answer to the nearest tenth.\",cells:[40,75,null,35],round:1},\n \"13\":{pure:true,text:\"Solve for x. Do <b>not<\/b> round your answer.\",cells:[3.2,20,9,null]},\n \"14\":{pure:true,text:\"Solve for x. Do <b>not<\/b> round your answer.\",cells:[null,4.8,9,20]},\n \"17\":{text:\"Alexa bought a 5-kilogram can of almonds for $6.30. What is the price per kilogram?\",\n  cells:[5,6.3,1,null],units:[\"kg\",\"$\"],note:\"Price per kilogram means the price of 1 kilogram\",\n  setup:SU([[5,\"kg\"],[6.3,\"$\"],[1,\"kg\"],[X,\"$\"]],\n    [[[5,\"kg\"],[6.3,\"$\"],[X,\"$\"],[1,\"kg\"]],\"Kilograms on top both sides.\"],\n    [[[6.3,\"kg\"],[5,\"$\"],[1,\"kg\"],[X,\"$\"]],\"It's 5 kilograms for $6.30.\"])},\n \"18\":{text:\"Jackie bought a 30-ounce smoothie that contains 690 total calories. How many calories does the smoothie contain per ounce?\",\n  cells:[30,690,1,null],units:[\"oz\",\"calories\"],note:\"Per ounce means in 1 ounce\",\n  setup:SU([[30,\"oz\"],[690,\"calories\"],[1,\"oz\"],[X,\"calories\"]],\n    [[[30,\"oz\"],[690,\"calories\"],[X,\"calories\"],[1,\"oz\"]],\"Ounces on top both sides.\"],\n    [[[690,\"oz\"],[30,\"calories\"],[1,\"oz\"],[X,\"calories\"]],\"It's 30 ounces with 690 calories.\"])},\n \"19\":{text:\"The ratio of flamingos to snakes at the local zoo is 3:8. There are 56 snakes at the zoo. How many flamingos are there?\",\n  cells:[3,8,null,56],units:[\"flamingos\",\"snakes\"],\n  setup:SU([[3,\"flamingos\"],[8,\"snakes\"],[X,\"flamingos\"],[56,\"snakes\"]],\n    [[[8,\"flamingos\"],[3,\"snakes\"],[X,\"flamingos\"],[56,\"snakes\"]],\"3:8 means 3 flamingos, 8 snakes.\"],\n    [[[3,\"flamingos\"],[8,\"snakes\"],[56,\"flamingos\"],[X,\"snakes\"]],\"The 56 animals are snakes.\"])},\n \"20\":{text:\"One afternoon, Sienna's ice cream shop sells 12 sundaes in 45 minutes. If the shop continues to sell sundaes at the same rate, about how many sundaes will the shop sell in 7 hours?\",\n  cells:[12,45,null,420],units:[\"sundaes\",\"min\"],xu:\"min\",note:\"7 hours = 420 min\",\n  setup:SU([[12,\"sundaes\"],[45,\"min\"],[X,\"sundaes\"],[420,\"min\"]],\n    [[[12,\"sundaes\"],[45,\"min\"],[X,\"sundaes\"],[7,\"hr\"]],\"Not the same unit. 7 hours = ? minutes.\"],\n    [[[12,\"sun \"It's 4 scoops for 3.5 cups of water.\"],\n    [[[4,\"scoops\"],[3.5,\"cups\"],[X,\"cups\"],[12,\"scoops\"]],\"Scoops on top both sides.\"])},\n \"25\":{text:\"Caden can jog 2,500 feet in 4 minutes. If he jogs at the same rate, how many feet can he jog in 10 minutes?\",\n  cells:[2500,4,null,10],units:[\"ft\",\"min\"],xu:\"min\",\n  setup:SU([[2500,\"ft\"],[4,\"min\"],[X,\"ft\"],[10,\"min\"]],\n    [[[4,\"ft\"],[2500,\"min\"],[X,\"ft\"],[10,\"min\"]],\"2,500 is feet, 4 is minutes.\"],\n    [[[2500,\"ft\"],[4,\"min\"],[10,\"ft\"],[X,\"min\"]],\"10 is minutes, not feet.\"])},\n \"26\":{mc:true,q:{text:\"Sophia is making a recipe that requires 2 cups of water and 3 cups of oatmeal. Which of the following combinations shows the same ratio of water to oatmeal?\",\n   simp:[{name:\"Sophia\",r:[2,3],given:true},{name:\"Choice 1\",r:[3,5],say:\"Simplify 3 cups of water to 5 cups of oatmeal.\"},{name:\"Choice 2\",r:[5,2],say:\"Simplify 5 cups of water to 2 cups of oatmeal.\"},{name:\"Choice 3\",r:[6,9],say:\"Simplify 6 cups of water to 9 cups of oatmeal.\"},{name:\"Choice 4\",r:[1,4],say:\"Simplify 1 cup of water to 4 cups of oatmeal.\"}],\n   simpOrder:\"Keep the same order: water first, then oatmeal.\",\n   prompt:\"Now compare. Which combination simplifies to Sophia's 2 : 3?\",\n   choices:[\"3 cups of water to 5 cups of oatmeal\",\"5 cups of water to 2 cups of oatmeal\",\"6 cups of water to 9 cups of oatmeal\",\"1 cup of water to 4 cups of oatmeal\"],correct:[2],\n   fbs:[\"3 : 5 doesn't simplify to 2 : 3.\",\"Flipped. Sophia uses less water than oatmeal.\",\"\",\"1 : 4 doesn't simplify to 2 : 3.\"],\n   hint:\"Simplify each combination. Which one becomes 2 : 3?\",\n   why:\"6 : 9 = 2 : 3 (÷ 3), the same as Sophia's 2 cups of water to 3 cups of oatmeal\",a:\"6 cups of water to 9 cups of oatmeal\"}},\n \"27\":{text:\"If Tatianna reads 60 pages of her book in ⅔ hour, how many pages of her book will she read in 3 hours?\",\n  cells:[60,40,null,180],units:[\"pages\",\"min\"],xu:\"min\",note:\"⅔ hour = 40 min, 3 hours = 180 min\",\n  setup:SU([[60,\"pages\"],[40,\"min\"],[X,\"pages\"],[180,\"min\"]],\n    [[[60,\"pages\"],[\"⅔\",\"min\"],[X,\"pages\"],[180,\"min\"]],\"⅔ of an hour isn't ⅔ of a minute. ⅔ hour = 40 minutes.\"],\n    [[[60,\"pages\"],[40,\"min\"],[X,\"pages\"],[3,\"hr\"]],\"Not the same unit. 3 hours = ? minutes.\"])},\n \"29\":{text:\"On Monday, Bailey earned $18 for 2 hours of babysitting. Getting paid the same rate, she earned $54 for babysitting on Saturday. How many hours did Bailey babysit on Saturday?\",\n  cells:[2,18,null,54],units:[\"hr\",\"$\"],\n  setup:SU([[2,\"hr\"],[18,\"$\"],[X,\"hr\"],[54,\"$\"]],\n    [[[2,\"hr\"],[18,\"$\"],[54,\"hr\"],[X,\"$\"]],\"$54 is money, not hours.\"],\n    [[[18,\"hr\"],[2,\"$\"],[X,\"hr\"],[54,\"$\"]],\"It's $18 for 2 hours.\"])},\n \"32\":{text:\"Lions sleep 5 out of every 6 hours. Write and solve a proportion to find how many hours per day lions sleep.\",\n  cells:[5,6,null,24],units:[\"hours asleep\",\"hours in all\"],note:\"1 day = 24 hours\",\n  setup:SU([[5,\"hours asleep\"],[6,\"hours in all\"],[X,\"hours asleep\"],[24,\"hours in all\"]],\n    [[[5,\"hours asleep\"],[6,\"hours in all\"],[24,\"hours asleep\"],[X,\"hours in all\"]],\"24 is all the hours in a day.\"],\n    [[[6,\"hours asleep\"],[5,\"hours in all\"],[X,\"hours asleep\"],[24,\"hours in all\"]],\"Lions sleep 5 of every 6 hours.\"])},\n \"34\":{mc:true,q:{text:\"Which of the following ratios is equivalent to 2:5?\",\n   simp:[{name:\"2 : 5\",r:[2,5],given:true},{name:\"11/20\",r:[11,20],say:\"Simplify 11/20.\"},{name:\"1/2\",r:[1,2],say:\"Simplify 1/2.\"},{name:\"5/7\",r:[5,7],say:\"Simplify 5/7.\"},{name:\"6/15\",r:[6,15],say:\"Simplify 6/15.\"}],\n   simpOrder:\"Keep the same order: top number first, then bottom number.\",\n   prompt:\"Now compare. Which ratio is equivalent to 2 : 5?\",\n   choices:[fr(11,20),fr(1,2),fr(5,7),fr(6,15)],correct:[3],\n   fbs:[\"11/20 is already in simplest form, and it isn't 2/5.\",\"1/2 isn't 2/5.\",\"5/7 isn't 2/5.\",\"\"],\n   hint:\"Simplify each one. Which becomes 2/5?\",\n   why:\"6/15 = 2/5 (÷ 3), so 6/15 is equivalent to 2:5\",a:\"6/15\"}},\n \"35\":{text:\"Michelle bought a package of three tank tops for $15.96. What is the unit price per tank top?\",\n  cells:[3,15.96,1,null],units:[\"tank tops\",\"$\"],note:\"Unit price means the price of 1 tank top\",\n  setup:SU([[3,\"tank tops\"],[15.96,\"$\"],[1,\"tank tops\"],[X,\"$\"]],\n    [[[3,\"tank tops\"],[15.96,\"$\"],[X,\"$\"],[1,\"tank tops\"]],\"Tank tops on top both sides.\"],\n    [[[15.96,\"tank tops\"],[3,\"$\"],[1,\"tank tops\"],[X,\"$\"]],\"It's 3 tank tops for $15.96.\"])},\n \"36\":{text:\"Rithvik's fruit juice recipe uses 3 scoops of powder for every 8.5 cups of water. Rithvik uses 10 scoops of powder to make a batch of fruit juice. How much water should he use? <b>Write your answer as a mixed number.<\/b>\",\n  cells:[3,8.5,10,null],units:[\"scoops\",\"cups\"],mixed:true,\n  setup:SU([[3,\"scoops\"],[8.5,\"cups\"],[10,\"scoops\"],[X,\"cups\"]],\n    [[[8.5,\"scoops\"],[3,\"cups\"],[10,\"scoops\"],[X,\"cups\"]],\"It's 3 scoops for 8.5 cups of water.\"],\n    [[[3,\"scoops\"],[8.5,\"cups\"],[X,\"cups\"],[10,\"scoops\"]],\"Scoops on top both sides.\"])}\n};\nfunction makeQ(T){\n  if(T.mc){const q=Object.assign({},T.q);q.mc=true;return q;}\n  if(T.pure){const q={text:T.text,cells:T.cells,v:\"x\",best:T.best||classify(T.cells)};if(T.round!=null)q.round=T.round;if(T.mixed)q.mixed=true;if(T.exact)q.exact=true;q.why=whyOf(q);return q;}\n  const V=x=>typeof x===\"function\"?x({}):x, cells=V(T.cells);\n  const q={text:V(T.text),cells,units:T.units,xu:T.xu||T.units[0],v:\"x\",best:T.best||classify(cells),setup:V(T.setup)};\n  [\"ur\",\"round\",\"mixed\",\"note\",\"tail\",\"follow\",\"choose\",\"conv\",\"one\",\"exact\",\"decOnly\",\"media\",\"mediaAlt\",\"then\",\"thenLabel\",\"thenPrompt\"].forEach(k=>{if(T[k]!=null)q[k]=T[k];});\n  if(T.cc){q.cc=true;q.fromU=T.fromU;q.toU=T.toU;q.rel=T.rel;}\n  q.why=whyOf(q); return q;\n}\nfunction newSet(){const qn=String((window.SPEC||{}).qn),T=BANK[qn]||BANK[\"8\"],q=makeQ(T);q.qn=qn;return [q];}\nfunction instantiate(T){\n  for(let tries=0;tries<3000;tries++){\n    if(T.mc){const q=T.gen(); if(!q) continue; q.mc=true; if(T.meme) q.meme=T.meme; return q;}\n    if(T.pure){\n      const g=T.gen(); if(!g) continue;\n      const c=g.cells; if(c.some(v=>v!==null&&(v<=0)))continue;\n      const want=T.best===\"dec\"?\"m2\":T.best, cls=classify(c);\n      if(cls!==want) continue;\n      const ans=answerOf(c); if(!okAns(ans,\"dec\")||ans>999) continue;\n      const q={text:`Solve for ${g.v}.`,cells:c,v:g.v,best:cls};\n      q.why=autoWhy(q); return q;\n    }\n    const v={}; for(const k in T.pick) v[k]=rnd(T.pick[k]);\n    if(T.ok&&!T.ok(v)) continue;\n    const c=T.cells(v), cls=classify(c);\n    if(T.best&&cls!==T.best) continue;\n    const ans=answerOf(c); if(T.ans&&!okAns(ans,T.ans)) continue;\n    const q={text:T.text(v),cells:c,units:T.units,xu:T.xu||T.units[0],v:\"x\",best:cls,setup:T.setup(v)};\n    if(T.table){q.table=T.table(v); if(T.vertical) q.vertical=true;}\n    if(T.ur) q.ur=T.ur; if(T.pre) q.pre=true; if(T.feelQ) q.feelQ=T.feelQ; if(T.conv) q.conv=true; if(T.cc){q.cc=true;q.fromU=T.fromU;q.toU=T.toU;q.rel=T.rel;}\n    if(T.round!=null) q.round=T.round; if(T.mixed) q.mixed=true; if(T.choose) q.choose=T.choose;\n    if(T.follow) q.follow=T.follow(v);\n    if(T.meme) q.meme=T.meme; if(T.note) q.note=T.note(v); if(T.whyTail) q.tail=T.whyTail(v);\n    q.why=whyOf(q); return q;\n  }\n  throw new Error(\"could not generate: \"+(T.text?T.text.toString().slice(0,60):\"mc/pure\"));\n}\nfunction whyOf(q){let w=autoWhy(q); if(q.note) w=q.note+\". \"+w[0].toUpperCase()+w.slice(1); if(q.tail) w+=q.tail; return w;}\nfunction shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}\nconst QN=i=>String((window.SPEC&&window.SPEC.num)||P[i].qn||i+1);\n g\":\"\"}\" src=\"${p.meme.src}\" alt=\"${p.meme.alt.replace(/\"/g,\"&quot;\")}\">`:\"\";}\n// ---------- multiple-choice problems ----------\n// ---------- simplify each ratio before choosing ----------\nconst simplest=([a,b])=>{const g=gcd(a,b);return [a/g,b/g];};\nconst simpWork=p=>p.simp.filter(x=>!x.given);\n// number boxes that move on by themselves when right\nfunction numBoxes(ins,ans,ok,bad){\n  const g=id=>document.getElementById(id);\n  const vals=()=>ins.map(e=>parseNum(e.value));\n  const right=v=>ans.every((a,k)=>near(v[k],a));\n  requestAnimationFrame(()=>ins[0]&&ins[0].focus({preventScroll:true}));\n  ins.forEach((el,i)=>{\n    el.addEventListener(\"input\",()=>{\n      el.classList.remove(\"bad\"); const v=vals();\n      if(right(v)) return ok();\n      if(near(v[i],ans[i])&&ins[i+1]&&!ins[i+1].value) ins[i+1].focus();\n    });\n    el.addEventListener(\"keydown\",e=>{if(e.key===\"Enter\"){e.preventDefault();e.stopPropagation();if(g(\"check\"))g(\"check\").click();}});\n  });\n  if(g(\"check\")) g(\"check\").onclick=()=>{\n    const v=vals();\n    if(v.some(isNaN)) return fb(ins.length>2?\"Fill in every box.\":ins.length>1?\"Fill in both boxes.\":\"Type a number.\",\"hint\");\n    if(right(v)) return ok();\n    const st=S[cur]; if(st.firstTry===null) st.firstTry=false; st.mistakes++;\n    ins.forEach((e,k)=>{e.classList.remove(\"bad\");if(!near(v[k],ans[k])){void e.offsetWidth;e.classList.add(\"bad\");}});\n    fb(bad(v));\n  };\n}\nfunction simpHTML(p,st){\n  const work=simpWork(p), k=st.done?work.length:(st.sk||0), ref=simplest(p.simp[0].r);\n  return `<div class=\"simplist\">${p.simp.map(x=>{\n    const [sa,sb]=simplest(x.r), wi=work.indexOf(x);\n    const state=x.given||wi<k?\"done\":wi===k?\"act\":\"later\";\n    const same=sa===ref[0]&&sb===ref[1]&&k>=work.length;\n    const right=state===\"done\"?`<span class=\"sans\"><b class=\"sres${same?\" same\":\"\"}\">${sa} : ${sb}<\/b>${x.given?'<span class=\"snote\">already simplest<\/span>':\"\"}<\/s on><button class=\"gb\" data-g=\"0\">No<\/button><\/span>`:\"\";\n    return `<div class=\"grow ${state}\"><span class=\"gname\">${x.h}<\/span>${right}<\/div>`;\n  }).join(\"\")}<\/div>`;\n}\nfunction wireGuide(p,st,after){\n  const x=p.guide[st.gk||0];\n  $main.querySelectorAll(\".gb\").forEach(b=>b.onclick=()=>{\n    if((b.dataset.g===\"1\")===x.yes){st.gk=(st.gk||0)+1;after();return;}\n    if(st.firstTry===null) st.firstTry=false; st.mistakes++;\n    b.classList.add(\"wrong\"); fb(x.fb);\n  });\n}\nfunction mcPhase(p,st){\n  if(st.done) return \"done\";\n  if(p.simp&&(st.sk||0)<simpWork(p).length) return \"simp\";\n  if(p.tfill&&(st.tk||0)<tfSteps(p).length) return \"tfill\";\n  if(p.rel&&(st.rk||0)<relSteps(p).length) return \"rel\";\n  if(p.guide&&(st.gk||0)<p.guide.length) return \"guide\";\n  if(p.fill) return \"fill\";\n  return \"choice\";\n}\nfunction mcPrompt(p,st,ph){\n  if(ph===\"simp\"){const x=simpWork(p)[st.sk||0];return x.say||`Simplify ${x.name}'s ratio.`;}\n  if(ph===\"tfill\") return tfSteps(p)[st.tk||0].q;\n  if(ph===\"rel\") return relSteps(p)[st.rk||0].q;\n  if(ph===\"guide\") return \"Is this ratio equal to π?\";\n  if(ph===\"done\"&&p.tfill&&!p.choices.length) return tfTables(p).length>1&&!p.tfill.combined?\"Tables complete!\":\"Table complete!\";\n  if(ph===\"done\"&&p.guide) return \"All five checked!\";\n  return p.prompt||(p.fill?\"Type your answer, then Check.\":p.multi?\"Select all that apply, then Check.\":\"Pick one.\");\n}\nfunction renderMC(p,st){\n  const ph=mcPhase(p,st);\n  const box=i=>p.multi?`<span class=\"box\">${(st.sel.includes(i)||(st.done&&p.correct.includes(i)))?\"✓\":\"\"}<\/span>`:\"\";\n  const ch=p.choices.map((c,i)=>{\n    const cls=[\"mbtn\",\"mc\"];\n    if(st.wrongPicks.includes(i)) cls.push(\"wrong\");\n    if(p.multi&&st.sel.includes(i)&&!st.done) cls.push(\"on\");\n    if(st.done&&p.correct.includes(i)) cls.push(\"right\");\n    return `<button class=\"${cls.join(\" \")}\" data-c=\"${i}\" ${st.done?\"disabled idth:30px;min-width:30px;height:38px;padding:0;text-align:center;vertical-align:middle}\ntable.ldt td.lddot{width:12px;min-width:12px}\ntable.ldt td.lddiv{width:auto;text-align:right;padding-right:8px;white-space:nowrap}\ntable.ldt td.ldtop{border-top:2.5px solid var(--ink)}\ntable.ldt td.ldleft{border-left:2.5px solid var(--ink)}\ntable.ldt td.ldul{border-bottom:2.5px solid var(--ink)}\ntable.ldt td.added,.ldch.added{color:var(--green)}\ntable.ldt .ldhl{background:#fff1a8;border-radius:4px}\n.ldin{font-family:Verdana,Geneva,sans-serif;font-size:20px;height:32px;text-align:center;padding:0;border:2.5px solid var(--blue);border-radius:6px;background:#fff;color:var(--ink)}\n.ldin.wide{width:7em;margin-right:4px;height:40px}\n.ldin:focus{outline:none;box-shadow:0 0 0 4px #e8effb}\n.ldin.bad{border-color:var(--red);animation:ldshake .3s}\n@keyframes ldshake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}\n.ldctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}\n.ldfb{margin:10px 0 0;padding:8px 12px;border-radius:8px;font-size:16px}\n.ldfb.bad{background:#fbe9ec}.ldfb.hint{background:#e8effb}\n.ldfb:empty{display:none}\n.ldcg{display:inline-flex;position:relative;padding-bottom:36px}\n.ldch{display:inline-flex;justify-content:center;align-items:center;width:30px;height:38px}\n.ldarcs{position:absolute;bottom:2px;left:0;height:34px;overflow:visible;pointer-events:none}\n.ldarc{fill:none;stroke:var(--red);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:160;stroke-dashoffset:160;animation:ldDraw .34s ease forwards}\n.ldarr{fill:var(--red);opacity:0;animation:ldFade .12s ease forwards}\n@keyframes ldDraw{to{stroke-dashoffset:0}}\n@keyframes ldFade{to{opacity:1}}\n<\/style>\n<\/head>\n<body>\n<div class=\"app\">\n  <div class=\"bar\" hidden>\n    <div class=\"brand\">Ratios<\/div>\n    <label class=\"toggle\" hidden><input type=\"checkbox\" id=\"guideT\" checked> Steps<\/label>\n    <label class=\"toggle\" id=\"ansToggle\" hidden><input type=\"checkbox\" id=\"showAns\" checked> Answers<\/label>\n    <div class=\"count\" id=\"count\"><\/div>\n    <button class=\"btn go\" id=\"turnBtn\" type=\"button\">Turn in<\/button>\n  <\/div>\n  <div class=\"stage\">\n    <div class=\"visual\" id=\"visual\"><\/div>\n    <div class=\"work\">\n      <div class=\"prompt\" id=\"prompt\"><\/div>\n      <div class=\"eqn\" id=\"eqn\"><\/div>\n      <div class=\"guide\" id=\"guide\"><\/div>\n      <div class=\"feedback\" id=\"feedback\" aria-live=\"polite\"><\/div>\n      <div class=\"actions\" id=\"actions\"><\/div>\n    <\/div>\n  <\/div>\n<\/div>\n\n<dialog id=\"teacher\">\n  <h2>Teacher stats<\/h2>\n  <div id=\"statsTable\"><\/div>\n  <div class=\"actions\">\n    <button class=\"btn\" id=\"resetStats\">Reset saved stats<\/button>\n    <button class=\"btn primary\" id=\"closeStats\">Close<\/button>\n  <\/div>\n<\/dialog>\n\n<div id=\"ldov\" role=\"dialog\" aria-labelledby=\"ld-title\" hidden>\n  <div class=\"ld-inner\">\n    <div class=\"ld-head\"><h2 id=\"ld-title\">Long division<\/h2><button class=\"ldbtn ghost\" type=\"button\" id=\"ldX\">Close<\/button><\/div>\n    <div id=\"ldBody\"><\/div>\n  <\/div>\n<\/div>\n<script>window.SPEC=__SPEC__;<\/script>\n<style>\n/* fun fact: inside the question box, at the bottom, just for fun */\n.sgfact{margin-top:auto;display:block;text-align:left;padding:8px 14px;border-radius:10px;background:#F4F0FF;border:1.5px dashed #B9A7EE;font:15px/1.4 'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif;color:#1D2939;font-weight:400;letter-spacing:0}\n.sgfact .sgf-l{font-weight:800;color:#5B3FC4;margin-right:6px;white-space:nowrap}\n.sgfact .sgf-n{display:block;font-size:12px;color:#667085;font-style:italic;margin-top:2px}\n.container.hasfact{display:flex;flex-direction:column}\n.container.hasfact>.sgfact{margin:auto auto 0;width:100%;max-width:720px}\n.visual>.sgfact{flex:none}\n<\/style>\n<script>\nwindow.SG_FACT=(window.SPEC&&window.SPEC.fact)||'';\nwindow.sgFactHTML=function(){return window.SG_FACT?'<div class=\"sgfact\" role=\"note\" aria-label=\"Fun fact\"><span class=\"sgf-l\">💡 Fun fact<\/span>'+window.SG_FACT+'<\/div>':'';};\n(function(){var sl=document.getElementById('sgFactSlot');if(!sl)return;\n  if(!window.SG_FACT){sl.remove();return}\n  sl.parentElement.classList.add('hasfact');sl.outerHTML=window.sgFactHTML();})();\n<\/script>\n\n<script>\nconst PREVIEW=false;\n\n/* ---------- shapes ---------- */\nfunction starPts(){\n  const p=[];\n  for(let i=0;i<10;i++){const r=i%2?.21:.5,a=-Math.PI/2+i*Math.PI/5;p.push((.5+r*Math.cos(a)).toFixed(3)+','+(.54+r*Math.sin(a)).toFixed(3))}\n  return p.join(' ');\n}\nconst SH={\n  circle:  {cls:'c-red',    draw:'<circle cx=\".5\" cy=\".5\" r=\".46\"/>'},\n  square:  {cls:'c-blue',   draw:'<rect x=\".06\" y=\".06\" width=\".88\" height=\".88\" rx=\".14\"/>'},\n  triangle:{cls:'c-yellow', draw:'<polygon points=\".5,.04 .97,.93 .03,.93\"/>'},\n  star:    {cls:'c-green',  draw:'<polygon points=\"'+starPts()+'\"/>'},\n  heart:   {cls:'c-pink',   draw:'<path d=\"M.5 .92C.1 .62 0 .42 0 .28 0 .12 .13 0 .28 0 .38 0 .46 .06 .5 .15 .54 .06 .62 0 .72 0 .87 0 1 .12 1 .28 1 .42 .9 .62 .5 .92Z\"/>'}\n};\nconst NAMES={circle:'circles',square:'squares',triangle:'triangles',star:'stars',heart:'hearts'};\nconst KEYS=Object.keys(SH);\nconst shape=(k,x,y,s)=>`<g transform=\"translate(${x},${y}) scale(${s})\" class=\"${SH[k].cls}\">${SH[k].draw}<\/g>`;\nconst ico=k=>`<svg viewBox=\"-.04 -.04 1.08 1.08\" role=\"img\" aria-label=\"${NAMES[k]}\"><g class=\"${SH[k].cls}\">${SH[k].draw}<\/g><\/svg>`;\n\n/* ---------- helpers ---------- */\nconst rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1));\nconst shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};\nconst gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);\nconst simp=(a,b)=>{const g=gcd(a,b);return [a/g,b/g]};\nconst $=id=>document.getElementById(id);\nconst inputs=()=>[...document.querySelectorAll('#eqn input:not(.kin):not(.kmul):not(.afin)')];\n\nconst st={real:true,bookI:-1,fbi:0,guide:true,g:null,kDone:false,mode:'mix',simplest:false,showAns:true,p:null,attempted:false,done:false,solved:0,streak:0,hist:[],idx:-1};\n\n/* ---------- generators ---------- */\nfunction genP2P(){\n  const n=Math.random()<.5?2:3, keys=shuffle(KEYS).slice(0,n), counts=keys.map(()=>rand(1,8));\n  const [ia,ib]=shuffle([...Array(n).keys()]).slice(0,2);\n  if(counts[ia]===counts[ib]) counts[ib]=counts[ib]%8+1;\n  return {type:'p2p',rows:keys.map((k,i)=>({k,c:counts[i]})),focus:[keys[ia],keys[ib]],\n    tags:[keys[ia],keys[ib]],ans:[counts[ia],counts[ib]],total:counts.reduce((s,c)=>s+c,0)};\n}\nfunction genP2W(){\n  const n=Math.random()<.5?2:3, keys=shuffle(KEYS).slice(0,n), counts=keys.map(()=>rand(1,7));\n  const i=rand(0,n-1), A=keys[i], a=counts[i], total=counts.reduce((s,c)=>s+c,0), rev=Math.random()<.45;\n  return {type:'p2w',rows:keys.map((k,j)=>({k,c:counts[j]})),focus:[A],part:a,total,rev,\n    tags:rev?['all',A]:[A,'all'],ans:rev?[total,a]:[a,total]};\n}\nfunction genEq(){\n  const [A,B]=shuffle(KEYS).slice(0,2);\n  let a=rand(1,5),b=rand(1,5); while(b===a) b=rand(1,5);\n  [a,b]=simp(a,b);\n  const k=rand(2,5), down=Math.random()<.35, small=[a,b], big=[a*k,b*k];\n  const first=down?big:small, second=down?small:big, mi=rand(0,1);\n  return {type:'eq',A,B,a,b,k,down,first,second,mi,ans:second[mi]};\n}\n\n/* ---------- quiz problems: Understanding Ratios (11/19) ---------- */\nconst F=(a,b)=>`<span class=\"fr\"><span>${a}<\/span><span>${b}<\/span><\/span>`;\n/* The Understanding Ratios questions are rebuilt every session: the same kinds of problems\n   (same stories), new numbers, shuffled order. */\nconst com=n=>n.toLocaleString('en-US');\nconst TEACH=['Ms. Rand','Mr. Chen','Mrs. Okafor','Ms. Rivera','Mr. Patel'];\nfunction chainProb(n,story){   /* A : B and B : C share B; given A, find B and C */\n  let a,b,c; do{a=rand(2,7);b=rand(2,7);c=rand(2,7)}while(new Set([a,b,c]).size<3||gcd(a,b)>1||gcd(b,c)>1);\n  const k=rand(3,12), [L,q,newLab]=story(a,b,c,a*k);\n  return {n,type:'rt',q,rows:[{l:L[0],a,b:a*k},{l:L[1],a:b,b:b*k,m:1},{l:L[2],a:c,b:c*k,m:1}],k,pairs:[[0,1],[1,2]],\n    origLab:'Ratio',newLab,why:`${a*k} ÷ ${a} = ${k}, so ${b} × ${k} = ${b*k} ${L[1]} and ${c} × ${k} = ${c*k} ${L[2]}`};\n}\nfunction makeQuiz(){\n  const Q=[];\n  Q.push(chainProb('fish',(a,b,c,A)=>[['clown fish','angel fish','goldfish'],\n    `The ratio of clown fish to angel fish at a pet store is ${a}:${b}. The ratio of angel fish to goldfish is ${b}:${c}. There are ${A} clown fish. How many angel fish and goldfish are there?`,'Fish in the store']));\n  Q.push(chainProb('butterflies',(a,b,c,A)=>[['North American','South American','European'],\n    `The ratio of North American butterflies to South American butterflies at a butterfly park is ${a}:${b}. The ratio of South American butterflies to European butterflies is ${b}:${c}. There are ${A} North American butterflies. How many South American and European butterflies are there?`,'Butterflies in the park']));\n  { let r,c; do{r=rand(2,6);c=rand(3,8)}while(r===c); const N=rand(3,8);\n    Q.push({n:'bouquet',type:'rt',q:`In each bouquet of flowers, there are ${r} roses and ${c} white carnations. How many roses and carnations are there in ${N} bouquets?`,\n      rows:[{l:'bouquets',a:1,b:N},{l:'roses',a:r,b:r*N,m:1},{l:'carnations',a:c,b:c*N,m:1}],k:N,pairs:[[0,1],[0,2],[1,2]],\n      origLab:'1 bouquet',newLab:`${N} bouquets`,why:`1 × ${N} = ${N} bouquets, so ${r} × ${N} = ${r*N} roses and ${c} × ${N} = ${c*N} carnations`}); }\n  { let v; do{v=[rand(2,7),rand(2,6),rand(2,7),rand(4,10)]}while(new Set(v).size<4); const [b,a,p,st0]=v, k=rand(2,5), [nm,pr]=one(KID);\n    Q.push({n:'salad',type:'rt',q:`${nm}’s fruit salad recipe uses ${b} bananas, ${a} apples, ${p} pears, and ${st0} strawberries. ${cap(pr)} wants to use ${st0*k} strawberries. How many bananas, apples, and pears should ${pr} use?`,\n      rows:[{l:'strawberries',a: c[i]!==c[j])P.push(Math.random()<.5?[i,j]:[j,i]);   /* each pair of animals at most once */\n      simp2=shuffle(P.filter(([i,j])=>gcd(c[i],c[j])>1)); plain2=shuffle(P.filter(([i,j])=>gcd(c[i],c[j])===1));\n    }while(new Set(c).size<5||simp2.length<4||!plain2.length);\n    const total=c.reduce((x,y)=>x+y,0), BARS=names.map((l,i)=>({label:l,segs:[{v:c[i],c:cols[i]}]}));\n    const ZOO=`A zoo has ${c[0]} elephants, ${c[1]} giraffes, ${c[2]} lions, ${c[3]} seals, and ${c[4]} otters.`;\n    [...simp2.slice(0,4),plain2[0]].forEach(([i,j])=>{const [x,y]=[c[i],c[j]],[sx,sy]=simp(x,y);\n      Q.push({n:'zoo',type:'wr',kind:'p2p',simp:true,frac:true,q:`${ZOO}<br>What is the ratio of <b class=\"rq\">${names[i]} to ${names[j]}<\/b>? Write it as a fraction in simplest form.`,\n        tags:[names[i],names[j]],ans:[x,y],total,bars:BARS,barsR:[{...BARS[i],hl:1},{...BARS[j],hl:1},...BARS.filter((r,z)=>z!==i&&z!==j)],\n        why:gcd(x,y)>1?`${x}:${y} = ${sx}:${sy}, so ${sx}/${sy}`:`${x}:${y} is already in simplest form, so ${x}/${y}`})});\n  }\n  /* big proportions: a/b = ?/(b·k) = (a·m)/(b·m) */\n  for(let t=0;t<2;t++){ const [a,b]=coprime(2,9,3,9), k=rand(2,9); let m; do{m=rand(3,15)}while(m===k);\n    Q.push({n:'fp',type:'we',q:'Find the missing term to make the ratios equivalent.',more:[[a*m,b*m]],nofb:true,\n      tags:['',''],lab:['top','bottom'],fbu:[['top number','top'],['bottom number','bottom']],plain:true,vals:[a,b,a*k,b*k],miss:[2],k,\n      origLab:'Fraction',newLab:'Equivalent fraction',why:`${b} × ${k} = ${b*k}, so ${a} × ${k} = ${a*k}. Check: ${a} × ${m} = ${a*m} and ${b} × ${m} = ${b*m}`}); }\n  /* apples to corn muffins: the missing term in the first ratio, then in the second */\n  { const [a,b]=coprime(2,7,3,11), k=rand(4,12);\n    Q.push({n:'muffins1',type:'we',q:`Find the missing term to make the ratios equivalent.<br>${a} apples to <b>?<\/b> corn muffins<br>${a*k} apples to ${b*k} corn muffins`,\n      tags:['apples','muffins'],fbu:['apples','corn muffins'] onst empty=o.els.find(i=>!i.value); if(empty){say('info',o.els.length>1?'Fill in both boxes.':'Fill in the box.');empty.focus();return}\n  const v=o.els.map(i=>+i.value);\n  if(v.every((x,j)=>x===o.t[j])){rowOk();return}\n  record(false);\n  o.els.forEach((el,j)=>el.classList.add(v[j]===o.t[j]?'ok':'no'));\n  let msg=null;\n  for(const w of st.p.wrong||[]) if(typeof w[0]==='number'&&o.els.includes(ins[w[0]])&&+ins[w[0]].value===w[1]) msg=w[2];\n  const a=rowCell(o.r,'c2'), b=rowCell(o.r,'c4');\n  if(!msg&&st.p.hint&&o.els.length>1) msg=st.p.hint;\n  if(!msg&&a!==''&&isFinite(+a)&&o.els[0].closest('.c4')&&Math.abs(v[0]-(+a+(g.b-g.a)))<1e-9) msg=g.op==='×'?'Multiply. Don’t add.':'Divide. Don’t subtract.';\n  if(!msg) msg=o.els[0].closest('.c2')&&o.els.length===1?`Go backward: ${b} ${g.op==='×'?'÷':'×'} ${g.k} = ?`:`Try again: ${/[+]/.test(a)?'('+a+')':a} ${g.op} ${g.k} = ?`;\n  say('bad',msg); $('showBtn').hidden=false;\n  const bad=o.els.find(e=>e.classList.contains('no'))||o.els[0]; bad.focus(); bad.select();\n}\nfunction acceptK(){\n  const g=st.g; st.kDone=true; st.step=4; $('checkBtn').textContent='Check'; updArc();\n  if(g.inline){swapK();document.querySelectorAll('#eqn .kq').forEach(q=>q.textContent=g.k)}\n  else renderGuide();\n  if(st.rw){rowGo(0,`✓ ${g.a} ${g.op} ${g.k} = ${g.b}.`);return}\n  inputs().forEach(i=>{i.disabled=false;i.classList.remove('lock')});\n  say('good',`✓ ${g.a} ${g.op} ${g.k} = ${g.b}`+(g.okmsg?'. '+g.okmsg:''));\n  $('showBtn').hidden=true; focusFirst();\n}\nfunction checkK(){\n  const g=st.g, el=document.querySelector('.kin'); if(!el) return;\n  const big=Math.max(g.a,g.b), small=Math.min(g.a,g.b);\n  if(!el.value){say('info',`${g.a} ${g.op==='×'?'times':'divided by'} what number = ${g.b}?`);el.focus();return}\n  if(+el.value===g.k){acceptK();return}\n  record(false); el.classList.add('no');\n  say('bad',(+el.value===big-small?(g.op==='×'?'Multiply. Don’t add. ':'Divide. Don’t subtract. '):'')+`Think: ${big} ÷ ${small} = ?`);\n  $('sh t++;s.by[k][1]++}s.best=Math.max(s.best,st.streak)});\n  }\n}\nfunction pick(i){\n  if(PREVIEW||st.done) return;\n  const p=st.p, ok=i===p.ans, bs=[...document.querySelectorAll('#eqn .choice')];\n  bs.forEach(b=>b.classList.remove('ok','no'));\n  bs[i].classList.add(ok?'ok':'no');\n  record(ok);\n  if(ok&&p.after&&!st.afterOn){bs.forEach(b=>b.disabled=true);startAfter();return}\n  if(ok){say('good','✓ '+p.why);st.solved++;stat(s=>s.solved++);updateCount();finish()}\n  else{say('bad',(p.nopes&&p.nopes[i])||p.nope);$('showBtn').hidden=false}\n}\nfunction check(){\n  if(PREVIEW||st.done) return;\n  if(st.afterOn){afterCheck();return}\n  if(isFP(st.p)){fpCheck();return}\n  if(st.sim){simCheck();return}\n  if(st.step<3){advStep();return}\n  if(st.g&&!st.kDone){checkK();return}\n  if(st.rw&&!rowsAllOk()){rowCheck();return}\n  if((st.p.type==='tape'||st.p.pre)&&st.ts<st.p.steps.length){tapeCheck();return}\n  const p=st.p, ins=inputs(), empty=ins.find(i=>!i.value);\n  if(p.type==='pick'){say('info','Tap an answer.');focusFirst();return}\n  if(empty){say('info',ins.length>1?'Fill in both boxes.':'Fill in the box.');empty.focus();return}\n  const n=ins.map(i=>+i.value);\n  if(p.intOnly&&!st.sim&&n.some(x=>!Number.isInteger(x))){record(false);ins.forEach(i=>i.classList.add('no'));say('bad',p.intMsg);$('showBtn').hidden=false;ins[0].focus();ins[0].select();return}\n  if(p.type!=='eq'&&n.some(x=>x===0)){say('info','Use numbers bigger than 0.');ins[0].focus();return}\n  const r=p.type==='tape'?{res:'good',msg:'✓ '+p.why}:p.type==='eq'?judgeEq(p,n[0]):p.type==='we'?judgeWe(p,n):p.type==='rt'?judgeRt(p,n):judgeRatio(p,n[0],n[1]);\n  if(r.res==='info'){say('info',r.msg);ins[0].focus();ins[0].select();return}\n  const ok=r.res==='good';\n  record(ok);\n  if(ok&&p.after&&!st.afterOn){startAfter();return}\n  if(ok&&n.length===2&&!['eq','we','rt','tape'].includes(p.type)&&gcd(n[0],n[1])>1){simStart(n[0],n[1]);return}\n  say(r.res,r.msg);\n  if(ok){\n    ins.forEach(i=>i.classList.add('o idden=true; $('showBtn').hidden=true; $('nextBtn').hidden=false; $('nextBtn').textContent='Next question';\n  if(st.p.media&&!$('fbMedia')){const v=$('visual'),f=v.querySelector('.sgfact'),mh=`<div id=\"fbMedia\" class=\"fbmedia\"><video src=\"${st.p.media}\" autoplay loop muted playsinline aria-label=\"${st.p.mediaAlt||''}\"><\/video><\/div>`;if(f)f.insertAdjacentHTML('beforebegin',mh);else v.insertAdjacentHTML('beforeend',mh);}\n  $('nextBtn').focus();\n  if(!st.reported){st.reported=true;try{parent.postMessage({drill:'sg1',type:'done',qn:String(window.SPEC.qn),answer:st.p.answer||'',clean:!st.miss},'*')}catch(e){}}\n}\nfunction focusFirst(){if(st.rw&&!st.done){const o=st.rw.rows[st.rw.ai];if(o&&!o.kDone&&o.k&&!o.k.disabled){o.k.focus();return}}if(st.step<3&&!st.done&&!PREVIEW&&$('checkBtn')){$('checkBtn').focus();return}const f=document.querySelector('.kin,#eqn input:not(:disabled),#eqn .choice');if(f){f.focus();requestAnimationFrame(()=>f.focus())}}\n\nfunction updateCount(){}\nconst TI={open:false};\nfunction closeTurnIn(){}\n/* ---------- navigation ---------- */\nfunction render(){\n  st.sim=false; st.simFrom=null; st.attempted=false; st.done=false; st.fbi=0; st.fbShown=false; st.afterOn=false; st.miss=false;\n  renderWork(); updateCount();\n  if(PREVIEW){renderVisual(st.showAns); say('info',st.showAns?explain(st.p):'');}\n  else{renderVisual(false); say('',''); if($('fbMedia'))$('fbMedia').remove(); $('checkBtn').textContent='Check'; $('checkBtn').hidden=false; $('showBtn').hidden=true; $('nextBtn').hidden=true; focusFirst(); stepUI();}\n}\nfunction next(){\n  if(!PREVIEW){\n    if(st.p){try{parent.postMessage({drill:'sg1',type:'next',qn:String(window.SPEC.qn)},'*')}catch(e){}return}\n    st.p=sgProblem(); render(); return;\n  }\n  if(PREVIEW){\n    if(st.idx<st.hist.length-1) st.idx++; else {st.hist.push(gen());st.idx=st.hist.length-1}\n    st.p=st.hist[st.idx];\n  }else{\n    if(st.p&&!st.done) stat(s=>s.skipped++);\n    st.p=gen();\n  }\n  render();\n}\nfunction back(){if(st.idx>0){st.idx--;st.p=st.hist[st.idx];render()}}\nfunction newOfMode(){\n  if(PREVIEW){st.hist=st.hist.slice(0,st.idx+1);st.hist.push(gen());st.idx=st.hist.length-1;st.p=st.hist[st.idx];render()}\n  else next();\n}\n\n/* ---------- setup ---------- */\nif(PREVIEW){\n  document.title='Ratios (Preview)';\n  $('ansToggle').hidden=false;\n  $('actions').innerHTML='<button class=\"btn\" id=\"backBtn\">Back<\/button><button class=\"btn primary\" id=\"nextBtn\">Next<\/button>';\n  $('backBtn').addEventListener('click',back);\n  $('showAns').addEventListener('change',e=>{st.showAns=e.target.checked;render()});\n}else{\n  $('actions').innerHTML='<button class=\"btn primary\" id=\"checkBtn\">Check<\/button><button class=\"btn\" id=\"ldGo\" type=\"button\" hidden>Help with long division<\/button><button class=\"btn\" id=\"showBtn\" hidden>Show answer<\/button><button class=\"btn primary\" id=\"nextBtn\" hidden>Next<\/button>';\n  $('checkBtn').addEventListener('click',check);\n  $('showBtn').addEventListener('click',showAnswer);\n  $('ldGo').addEventListener('click',()=>ldOpen(st.ts));\n}\n$('nextBtn').addEventListener('click',next);\n$('guideT').addEventListener('change',e=>{\n  st.guide=e.target.checked;\n  if(PREVIEW||!st.done){const a=st.attempted;render();st.attempted=a}\n});\n\n$('ldX').addEventListener('click',()=>ldClose());\ndocument.addEventListener('keydown',e=>{\n  if(LD){if(e.key==='Escape')ldClose();return}\n  if($('teacher').open) return;\n  if(TI.open){if(e.key==='Escape')closeTurnIn();return}\n  const t=e.target;\n  if(PREVIEW){\n    if(e.key==='Enter'||e.key==='ArrowRight'){e.preventDefault();next()}\n    else if(e.key==='ArrowLeft'){e.preventDefault();back()}\n    else if(e.key==='a'||e.key==='A'){$('showAns').click()}\n    return;\n  }\n  if(e.key!=='Enter') return;\n  if(t.tagName==='BUTTON'&&t.id!=='nextBtn') return;\n  e.preventDefault();\n  if(st.done||t.id==='nextBtn'){next();return}\n  const ins=inputs(), i=ins.indexOf(t);\n  if(i>-1&&t.value&&!st.rw&&st.p.type!=='tape'&&!isFP(st.p)){const nx=ins.slice(i+1).find(x=>!x.value);if(nx){nx.focus();return}}\n  check();\n});\n\n\n/* ---------- help with long division (copied from the proportions drill) ---------- */\nconst ldPlain=v=>String(+(+v).toFixed(6));\nconst ldDec=s=>s.includes(\".\")?s.split(\".\")[1].length:0;\nfunction ldShift(s,k){let [i,f=\"\"]=s.split(\".\");while(f.length<k)f+=\"0\";i=(i+f.slice(0,k)).replace(/^0+(?=\\d)/,\"\");f=f.slice(k);return f?i+\".\"+f:i;}\nfunction ldRoundStr(s,r){\n  let [i,f=\"\"]=s.split(\".\");f=(f+\"0\".repeat(r+1)).slice(0,r+1);\n  const n=Math.floor((parseInt(i+f,10)+5)/10),t=String(n).padStart(r+1,\"0\");\n  return r?(t.slice(0,t.length-r)||\"0\")+\".\"+t.slice(t.length-r):t;\n}\nconst LDCW=30;\nfunction ldCharGrid(numStr,k){\n  const ch=numStr.split(\"\");if(ch.indexOf(\".\")<0)ch.push(\".\");\n  const dot=ch.indexOf(\".\");let after=ch.length-dot-1,added=0;while(after<k){ch.push(\"0\");after++;added++;}\n  const first=ch.length-added;\n  const cells=ch.map((c,i)=>`<div class=\"ldch${added&&i>=first?\" added\":\"\"}\">${c}<\/div>`).join(\"\");\n  const total=LDCW*ch.length;let sx=LDCW*(dot+0.5),paths=\"\";\n  for(let i=0;i<k;i++){const ex=LDCW*(dot+2+i),mid=(sx+ex)/2,d1=(i*0.45).toFixed(2),d2=(i*0.45+0.34).toFixed(2);\n    paths+=`<path class=\"ldarc\" style=\"animation-delay:${d1}s\" d=\"M ${sx},2 Q ${sx},28 ${mid},28 Q ${ex},28 ${ex},2\"/><polygon class=\"ldarr\" style=\"animation-delay:${d2}s\" points=\"${ex-5.5},9 ${ex},0 ${ex+5.5},9\"/>`;sx=ex;}\n  return `<div class=\"ldcg\">${cells}<svg class=\"ldarcs\" viewBox=\"0 0 ${total} 34\" style=\"width:${total}px\">${paths}<\/svg><\/div>`;\n}\n// N ÷ D. mode: \"exact\", \"round\" (to r places) or \"mixed\"\nfunction ldBuild(Nv,Dv,mode,r){\n  const Ns0=ldPlain(Nv),Ds0=ldPlain(Dv),ds=ldDec(Ds0);\n  const D=parseInt(ldShift(Ds0,ds),10),N=ldShift(Ns0,ds),steps=[];\n  const nr=()=>({cells:{}});\n  const clone=rows=>rows.map(rw=>{const c={};for(const k in rw.cells)c[k]=Object.assign({},rw.cells[k]);return {cells:c};});\n  const setup=(dt,nt)=>{const rows=[nr(),nr()];rows[1].cells[0]={t:dt,cls:\"lddiv\"};nt.split(\"\").forEach((c,i)=>rows[1].cells[i+1]={t:c,cls:\"ldtop\"+(i?\"\":\" ldleft\")});return rows;};\n  steps.push({kind:\"info\",prompt:`Set up <b>${Ns0} ÷ ${Ds0}<\/b>. The number you divide by, ${Ds0}, goes outside. ${Ns0} goes inside.`,grid:setup(Ds0,Ns0)});\n  if(ds){\n    const pw=Math.pow(10,ds);\n    steps.push({kind:\"info\",prompt:`${Ds0} isn’t a whole number. Multiply both numbers by ${pw.toLocaleString(\"en-US\")}: the decimal point moves ${ds} place${ds>1?\"s\":\"\"} to the right in both.`,\n      html:`<table class=\"ldt\"><tbody><tr><td class=\"lddiv\">${ldCharGrid(Ds0,ds)}<\/td><td class=\"ldtop ldleft\">${ldCharGrid(Ns0,ds)}<\/td><\/tr><\/tbody><\/table>`});\n    steps.push({kind:\"info\",prompt:`Now divide <b>${N} ÷ ${D}<\/b>. The answer is the same.`,grid:setup(String(D),N)});\n  }\n  const rows=setup(String(D),N),chars=N.split(\"\"),dot={};\n  chars.forEach((c,i)=>{if(c===\".\")dot[i+1]=1;});\n  const intLen=chars.indexOf(\".\")<0?chars.length:chars.indexOf(\".\");\n  const ensure=rw=>{while(rows.length<=rw)rows.push(nr());return rows[rw];};\n  const put=(rw,c,t,cls)=>{ensure(rw).cells[c]={t,cls:cls||\"\"};};\n  const colsFor=(end,n)=>{const o=[];let c=end;while(o.length<n&&c>=1){if(!dot[c])o.push(c);c--;}return o.reverse();};\n  const snap=(inp,hl)=>{const g=clone(rows);(hl||[]).forEach(([a,b])=>{if(g[a]&&g[a].cells[b])g[a].cells[b].cls=(g[a].cells[b].cls||\"\")+\" ldhl\";});\n    if(inp){while(g.length<=inp.r)g.push(nr());g[inp.r].cells[inp.c]=Object.assign({},g[inp.r].cells[inp.c]||{},{input:true,span:inp.span||1});}return g;};\n  const need=mode===\"round\"?r+1:mode===\"exact\"?4:0;\n  let cur=0,curRow=1,hasSub=false,q=\"\",qDec=0,inQ=false,hasDot=N.includes(\".\"),colEnd=chars.length,work=[],qi=0,guard=0;\n  const queue=chars.map((c,i)=>({col:i+1,ch:c}));\n  while(guard++<200){\n    if(qi>=queue.length){\n      if(cur===0||mode===\"mixed\"||qDec>=need) break;\n      if(!hasDot){colEnd++;put(1,colEnd,\".\",\"ldtop\");dot[colEnd]=1;hasDot=true;queue.push({col:colEnd,ch:\".\"});}\n      colEnd++;put(1,colEnd,\"0\",\"ldtop added\");queue.push({col:colEnd,ch:\"0\",added:true});\n    }\n    const it=queue[qi++];\n    if(it.ch===\".\"){\n      if(mode===\"mixed\") break;\n      steps.push({kind:\"info\",prompt:\"Bring the decimal point straight up into the answer.\",grid:snap(null,[[1,it.col]])});\n      put(0,it.col,\".\");q+=\".\";inQ=true;continue;\n    }\n    const d=+it.ch;\n    if(hasSub){\n      steps.push({kind:\"grid\",prompt:it.added?`No digits left, so we write a 0 in the number inside. Bring the 0 down.`:`Bring down the ${d}.`,\n        ans:String(d),hint:`Copy the ${d} down next to the ${cur}.`,grid:snap({r:curRow,c:it.col},[[1,it.col]].concat(work.map(c=>[curRow,c])))});\n      put(curRow,it.col,String(d));\n    }\n    work=work.concat([it.col]);\n    cur=cur*10+d;\n    if(q===\"\"&&cur<D&&it.col<intLen) continue;           // keep taking digits until the divisor fits\n    const qd=Math.floor(cur/D);\n    steps.push({kind:\"grid\",prompt:`How many times does ${D} fit into ${cur}?`,ans:String(qd),\n      hint:`Multiply ${D} by 1, 2, 3, … Find the biggest number that keeps the product ${cur} or less. If ${D} is bigger than ${cur}, it doesn’t fit at all.`,\n      grid:snap({r:0,c:it.col},[[1,0]].concat(work.map(c=>[curRow,c])))});\n    put(0,it.col,String(qd));q+=String(qd);if(inQ)qDec++;\n    if(mode!==\"mixed\"&&qDec>=need&&inQ) break;              // enough digits to round\n    if(qd>0){\n      const prod=qd*D,ps=String(prod),pc=colsFor(it.col,ps.length),prow=curRow+1,drow=curRow+2;\n      steps.push({kind:\"grid\",prompt:`What is ${D} × ${qd}? Write it underneath.`,ans:ps,hint:`Multiply the number outside, ${D}, by the digit you just wrote on top.`,\n        grid:snap({r:prow,c:pc[0],span:it.col-pc[0]+1},work.map(c=>[curRow,c]))});\n      if(pc[0]-1>=0) put(prow,pc[0]-1,\"−\");\n      for(let c=pc[0];c<=it.col;c++) put(prow,c,\"\",\"ldul\");\n      ps.split(\"\").forEach((c,i)=>put(prow,pc[i],c,\"ldul\"));\n      const diff=cur-prod,dst=String(diff),dc=colsFor(it.col,dst.length);\n      steps.push({kind:\"grid\",prompt:`Subtract: ${cur} − ${prod}`,ans:dst,hint:`Subtract the bottom number from the number above it. Line up the digits.`,\n        grid:snap({r:drow,c:dc[0],span:it.col-dc[0]+1},work.map(c=>[curRow,c]).concat(pc.map(c=>[prow,c])))});\n      dst.split(\"\").forEach((c,i)=>put(drow,dc[i],c));\n      cur=diff;curRow=drow;hasSub=true;work=dc;\n    }\n  }\n  let qs=q.replace(/^0+(?=\\d)/,\"\");if(qs.startsWith(\".\"))qs=\"0\"+qs;if(qs.endsWith(\".\"))qs=qs.slice(0,-1);if(!qs)qs=\"0\";\n  const exactVal=Nv/Dv;let ans=qs,approx=false;\n  if(mode===\"mixed\"&&cur>0){\n    const g=gcd(cur,D),fr=`${cur/g}/${D/g}`;ans=`${qs} ${fr}`;\n    steps.push({kind:\"text\",prompt:`${D} goes into ${N} <b>${qs}<\/b> times with <b>${cur}<\/b> left over. Write the answer as a mixed number.`,\n      val:exactVal,hint:`The whole number is the answer on top. What’s left over goes over ${D} as a fraction. Simplify it if you can.`,grid:clone(rows)});\n  } else if(mode===\"round\"&&ldDec(qs)>r){\n    ans=ldRoundStr(qs,r);approx=true;\n    const nd=qs.split(\".\")[1].charAt(r);\n    steps.push({kind:\"text\",prompt:`Round ${qs} to the ${[\"nearest whole number\",\"nearest tenth\",\"nearest hundredth\"][r]}.`,val:+ans,\n      hint:`Look at the digit after the ${[\"ones\",\"tenths\",\"hundredths\"][r]} place (${nd}). ${+nd>=5?\"It’s 5 or more, so round up.\":\"It’s less than 5, so keep it the same.\"}`,grid:clone(rows)});\n  } else if(mode===\"exact\"&&qDec>=4&&cur>0){ans=ldRoundStr(qs,3);approx=true;}\n  let maxCol=0;rows.forEach(rw=>{for(const k in rw.cells)maxCol=Math.max(maxCol,+k);});\n  steps.push({kind:\"done\",prompt:`${Ns0} ÷ ${Ds0} ${approx?\"≈\":\"=\"} <b>${ans}<\/b>`,grid:clone(rows)});\n  return {steps,ans,maxCol,dot,title:`${Ns0} ÷ ${Ds0}`};\n}\nlet LD=null;\nfunction ldGridHTML(g,maxCol,dot){\n  dot=dot||{};const w=c=>dot[c]?12:LDCW;\n  let h='<table class=\"ldt\"><tbody>';\n  g.forEach(rw=>{h+=\"<tr>\";for(let c=0;c<=maxCol;){const x=rw.cells[c];\n    if(x&&x.input){h+=`<td colspan=\"${x.span}\" class=\"${(x.cls||\"\").replace(\"ldhl\",\"\")}\"><input class=\"ldin\" id=\"ldIn\" inputmode=\"decimal\" autocomplete=\"off\" aria-label=\"answer\" style=\"width:${Array.from({length:x.span},(_,j)=>w(c+j)).reduce((a,b)=>a+b,0)-4}px\"><\/td>`;c+=x.span;continue;}\n    h+=`<td class=\"${x&&x.cls||\"\"}${dot[c]?\" lddot\":\"\"}\">${x&&x.t!=null?x.t:\"\"}<\/td>`;c++;}\n    h+=\"<\/tr>\";});\n  return h+\"<\/tbody><\/table>\";\n}\nfunction ldRender(){\n  const s=LD.steps[LD.k],B=$(\"ldBody\");\n  const vis=s.html||ldGridHTML(s.grid,LD.maxCol,LD.dot);\n  const ctl=s.kind===\"info\"?`<button class=\"ldbtn pri\" id=\"ldNext\">Next<\/button>`\n    :s.kind===\"done\"?`<button class=\"ldbtn pri\" id=\"ldUse\">Use ${LD.ans}<\/button><button class=\"ldbtn ghost\" id=\"ldClose2\">Close<\/button>`\n    :`${s.kind===\"text\"?`<input class=\"ldin wide\" id=\"ldIn\" inputmode=\"decimal\" autocomplete=\"off\" aria-label=\"answer\">`:\"\"}<button class=\"ldbtn pri\" id=\"ldCheck\">Check<\/button><button class=\"ldbtn ghost\" id=\"ldHint\">Hint<\/button>`;\n  B.innerHTML=`<p class=\"ldp\">${s.prompt}<\/p><div class=\"ldwrap\">${vis}<\/div><div class=\"ldctl\">${ctl}<\/div><p class=\"ldfb\" id=\"ldFb\" role=\"status\"><\/p>`;\n  const fbk=(m,t)=>{const e=$(\"ldFb\");e.className=\"ldfb \"+(t||\"bad\");e.innerHTML=m;};\n  if($(\"ldNext\")){$(\"ldNext\").onclick=()=>{LD.k++;ldRender();};$(\"ldNext\").focus();}\n  if($(\"ldClose2\")) $(\"ldClose2\").onclick=ldClose;\n  if($(\"ldUse\")){$(\"ldUse\").focus();$(\"ldUse\").onclick=()=>{const a=LD.ans,el=LD.target;ldClose();\n    if(el&&!el.disabled){el.value=a;el.dispatchEvent(new Event('input',{bubbles:true}));if(!el.disabled)el.focus();}};}\n  if($(\"ldHint\")) $(\"ldHint\").onclick=()=>fbk(s.hint,\"hint\");\n  const el=$(\"ldIn\");\n  if(el){\n    const val=()=>parseFloat(el.value.replace(/,/g,\"\"));\n    const ok=()=>s.kind===\"text\"?(s.val!=null&&Math.abs(val()-s.val)<1e-6):el.value.trim()===s.ans;\n    const go=()=>{LD.k++;ldRender();};\n    el.focus();\n    el.addEventListener(\"input\",()=>{el.classList.remove(\"bad\");if(ok())go();});\n    const chk=()=>{if(!el.value.trim())return fbk(\"Type your answer.\",\"hint\");if(ok())return go();el.classList.remove(\"bad\");void el.offsetWidth;el.classList.add(\"bad\");el.select();fbk(\"Not quite. Try again, or tap Hint.\");};\n    el.addEventListener(\"keydown\",e=>{if(e.key===\"Enter\"){e.preventDefault();e.stopPropagation();chk();}});\n    $(\"ldCheck\").onclick=chk;\n  }\n}\n/* step i of a typed-steps problem has ld:{n,d,mode,r} */\nfunction ldOpen(i){\n  const x=st.p.steps[i].ld; if(!x) return;\n  LD=ldBuild(x.n,x.d,x.mode||\"exact\",x.r);LD.k=0;LD.target=inputs()[i];\n  $(\"ld-title\").textContent=\"Long division: \"+LD.title;\n  $(\"ldov\").hidden=false;ldRender();\n}\nfunction ldClose(){$(\"ldov\").hidden=true;const t=LD&&LD.target;LD=null;if(t&&!t.disabled)t.focus();}\n/* the button sits next to Check while the current typed step has a division to help with */\nfunction ldSync(){const b=$('ldGo');if(!b)return;const p=st.p,x=p&&p.steps&&p.steps[st.ts];\n  b.hidden=!(x&&x.ld&&!st.done&&(p.type==='tape'||p.pre)&&!PREVIEW);}\nsetInterval(ldSync,250);\n/* never scroll: the whole page scales down to fit the window */\nfunction fitApp(){\n  const a=document.querySelector('.app'), w=innerWidth, h=innerHeight, tall=w<h*.9;\n  const z=Math.min(1,w/(tall?760:1280),h/(tall?1250:700));\n  a.classList.toggle('narrow',tall);\n  a.style.zoom=z; a.style.width=w/z+'px'; a.style.height=h/z+'px';\n  st.zl=null; fitEqn();\n}\naddEventListener('resize',fitApp); fitApp();\nnext();\n<\/script>\n<\/body>\n<\/html>\n"};
/* labels: a question with p:'a', p:'b'... is one part of a numbered question (14a, 14b) */
const LAB=(()=>{let n=0;return QS.map((q,i)=>{if(!q.p||q.p==='a')n++;return n+(q.p||'')})})();

const $=id=>document.getElementById(id);
let cur=0, DONE={};
/* progress survives a reload of the page (but not closing the tab) */
try{const s=JSON.parse(sessionStorage.getItem("sg2h-progress-v1")||'null');if(s){DONE=s.done||{};cur=Math.min(QS.length-1,s.cur||0)}}catch(e){}
function save(){try{sessionStorage.setItem("sg2h-progress-v1",JSON.stringify({done:DONE,cur}))}catch(e){}}
/* points: in some drills a problem with parts (25a, 25b) counts as one point, earned when every part is done */
const GROUP_PARTS=true;
const PNUM=LAB.map(l=>parseInt(l,10));
const PTS=GROUP_PARTS?[...new Set(PNUM)]:QS.map((q,i)=>i);
const ptDone=p=>GROUP_PARTS?QS.every((q,i)=>PNUM[i]!==p||DONE[q.n]):!!DONE[QS[p].n];
const nDone=()=>PTS.filter(ptDone).length;
const NPTS=PTS.length;

function renderNav(){
  const chip=(q,i)=>`<button class="chip${q.quiz?' qz':''}${q.e==='nh'?' solo':''}${DONE[q.n]?' done':''}${i===cur&&!intro?' cur':''}" data-i="${i}"${q.quiz?` title="Like quiz question ${q.quiz}"`:''} aria-label="Question ${LAB[i]}${q.e==='nh'?', on your own':''}${q.quiz?', like quiz question '+q.quiz:''}${DONE[q.n]?', done':''}"${i===cur?' aria-current="true"':''}>${LAB[i]}</button>`;
  let h='';
  h+=`<button class="chip dirs${intro?' cur':''}" id="dirChip" aria-label="Directions"${intro?' aria-current="true"':''}>Directions</button>`;
  QS.forEach((q,i)=>{ h+=chip(q,i); });
  if(QS.some(q=>q.quiz)&&!QS.some(q=>q.e==='nh')) h+=`<span class="qzkey"><span class="qzdot"></span>= like a quiz question</span>`;
  if(QS.some(q=>q.e==='nh')) h+=`<span class="qzkey"><span class="qzdot" style="border-style:dashed;border-color:#667085;box-shadow:none"></span>= on your own</span>`;
  $('nav').innerHTML=h;
  $('nav').querySelectorAll('.chip[data-i]').forEach(b=>b.onclick=()=>open(+b.dataset.i));
  $('dirChip').onclick=showIntro;
  $('count').innerHTML=`Done<b>${nDone()}</b> / ${NPTS}`;
  const q=QS[cur];
  $('qn').textContent='Question '+LAB[cur];
  $('tag').textContent=q.tag;
  $('quizmark').textContent=q.quiz?'★ Like quiz #'+q.quiz:''; $('quizmark').hidden=!q.quiz;
  $('okmark').textContent=DONE[q.n]?'✓ done':'';
  $('prev').disabled=cur===0;
  $('skip').disabled=cur===QS.length-1;
}
let intro=true;
function showIntro(){
  intro=true; renderNav();
  $('intro').hidden=false; $('qbar').hidden=true; $('framebox').hidden=true;
  $('introMeta').textContent=nDone()?`You've done ${nDone()} of ${NPTS} problems.`:`${NPTS} problems`;
  $('startBtn').textContent=nDone()?'Keep going':'Start';
  $('frame').removeAttribute('srcdoc');
  setTimeout(()=>$('startBtn').focus(),30);
}
$('startBtn').onclick=()=>open(cur);
document.addEventListener('keydown',e=>{if(intro&&!TI.open&&e.key==='Enter'&&e.target.id!=='startBtn'){e.preventDefault();open(cur)}});
function open(i){
  intro=false; $('intro').hidden=true; $('qbar').hidden=false; $('framebox').hidden=false;
  cur=i; save(); renderNav();
  const q=QS[i], f=$('frame');
  f.title='Question '+LAB[i];
  f.srcdoc=ENG[q.e].split('__SPEC__').join(JSON.stringify({qn:q.n,num:LAB[i],fact:q.fact||''}));
}
$('frame').addEventListener('load',()=>{if(!intro)try{$('frame').contentWindow.focus()}catch(e){}});
function nextUndone(){
  for(let k=1;k<=QS.length;k++){const i=(cur+k)%QS.length;if(!DONE[QS[i].n])return i}
  return -1;
}
function goNext(){
  const i=nextUndone();
  if(i<0){openTurnIn();return}
  open(i);
}
$('prev').onclick=()=>{if(cur>0)open(cur-1)};
$('skip').onclick=()=>{if(cur<QS.length-1)open(cur+1)};

/* the drills tell us when a question is done, and when to move on */
window.addEventListener('message',e=>{
  const d=e.data; if(!d||d.drill!=='sg1') return;
  if(d.type==='done'){
    if(!DONE[d.qn]) DONE[d.qn]={answer:d.answer||'',clean:!!d.clean};
    save(); renderNav();
    if(nDone()===NPTS&&!TI.auto){TI.auto=true;setTimeout(openTurnIn,1400)}
  }
  if(d.type==='next') goNext();
});

/* ---------- turning it in (Google Form) ----------
   The same Google Form as the other drills: student code, number done, drill name.
   Students can turn in early, any time, as many times as they want; each time sends what's done so far. */
const GOAL=NPTS;
const FORM_URL='https://docs.google.com/forms/d/e/1FAIpQLScLjdoG75r1XORoNx4v6u-1TEzXcuQoJqQIvbbEmD_QlFFzmA/formResponse';
const DRILL_NAME="Ratios Study Guide 2";
const CODE_KEY="studyguide2-student-code";
const TI={code:'',sent:null,pending:null,sending:false,note:'',open:false,auto:false};
try{TI.code=localStorage.getItem(CODE_KEY)||''}catch(e){}
function saveCode(){try{localStorage.setItem(CODE_KEY,TI.code)}catch(e){}}
const escH=v=>String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
function openTurnIn(){if(TI.open)return;TI.open=true;TI.note='';$('turnBtn').textContent='Back to the questions';renderTurnIn()}
function closeTurnIn(){TI.open=false;const m=$('tiModal');if(m)m.remove();$('turnBtn').textContent='Turn in';try{$('frame').contentWindow.focus()}catch(e){}}
function renderTurnIn(){
  let m=$('tiModal');
  if(!m){m=document.createElement('div');m.id='tiModal';m.className='ti-modal';document.body.appendChild(m)}
  const n=nDone(), text=DRILL_NAME+': '+n, more=TI.sent!==null&&TI.sent!==text, showForm=TI.sent===null||more;
  const chips=QS.map((q,i)=>`<button type="button" class="ti-q${DONE[q.n]?' done':''}" data-i="${i}" title="${DONE[q.n]?escH(DONE[q.n].answer):'not done yet: tap to go there'}">${LAB[i]}</button>`).join('');
  m.innerHTML=`<section class="ti-card" role="dialog" aria-modal="true" aria-labelledby="ti-title">
    <h2 id="ti-title">Turn in</h2>
    <p class="ti-sub">You've done <b>${n}</b> of ${GOAL} questions.${n<GOAL?' Tap a gray number to go do it.':' Nice work!'}</p>
    <div class="ti-grid">${chips}</div>
    <div class="ti-legend"><span><span class="ti-q done">&#10003;</span>done</span><span><span class="ti-q"></span>not yet</span></div>
    <iframe name="ti_frame" id="ti_frame" title="Sending" style="display:none"></iframe>
    <form id="tiForm" action="${FORM_URL}" method="POST" target="ti_frame"${showForm?'':' hidden'}>
      <div class="ti-warn">Type your <b>student code</b> carefully. Double-check it before you submit.</div>
      <label for="tiCode">Student code</label>
      <input type="text" id="tiCode" placeholder="Your code" autocomplete="off" autocapitalize="characters" spellcheck="false" required value="${escH(TI.code)}">
      <input type="hidden" id="tiFCode" name="entry.1999309314" value="">
      <input type="hidden" id="tiFScore" name="entry.1276394101" value="">
      <input type="hidden" id="tiFDrill" name="entry.582215829" value="">
      <button type="submit" class="ti-btn primary" id="tiSubmit">${more?'Send updated results':'Submit results'}</button>
    </form>
    <p class="ti-feedback" id="tiFeedback">${TI.note||(more?'You turned in before. Send again to update your results.':'')}</p>
    <div><button type="button" class="ti-btn" id="tiBack">Back to the questions</button></div>
  </section>`;
  m.querySelectorAll('.ti-grid .ti-q').forEach(b=>b.onclick=()=>{closeTurnIn();open(+b.dataset.i)});
  $('tiCode').addEventListener('input',e=>{const el=e.target,v=el.value.replace(/\s+/g,'');if(v!==el.value)el.value=v;TI.code=v;saveCode()});
  $('ti_frame').addEventListener('load',()=>{
    if(!TI.sending)return;
    TI.sending=false;TI.sent=TI.pending;
    TI.note='<span class="ok">Submitted. Your teacher has your results.</span>';
    renderTurnIn();
  });
  $('tiForm').addEventListener('submit',()=>{
    const code=$('tiCode').value.trim().toUpperCase();
    $('tiFCode').value=code;$('tiFScore').value=String(nDone());$('tiFDrill').value=DRILL_NAME;
    TI.code=code;saveCode();TI.pending=DRILL_NAME+': '+nDone();TI.sending=true;
    $('tiFeedback').textContent='Sending…';
  });
  $('tiBack').onclick=closeTurnIn;
  m.onclick=e=>{if(e.target===m)closeTurnIn()};
  if(showForm)setTimeout(()=>{const el=TI.code?$('tiSubmit'):$('tiCode');if(el)el.focus()},50);
}
$('turnBtn').addEventListener('click',()=>{if(TI.open)closeTurnIn();else openTurnIn()});
document.addEventListener('keydown',e=>{if(TI.open&&e.key==='Escape')closeTurnIn()});

showIntro();
</script>
</body>
</html>
