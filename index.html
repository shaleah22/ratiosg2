ounds of apples at the supermarket. How many kilograms of apples did she buy?', val: '5.5', route: 'lb>kg' },\n  '30': { story: '20 centimeters = _______ inches. Round your answer to the nearest hundredth.', val: '20', route: 'cm>in', places: 2 },\n  '31': { story: 'Latisha’s water bottle can hold 4.5 pints. How many cups can it hold?', val: '4.5', route: 'pt>c', bigG: true }\n};\n\n/* a conversion factor given in the problem itself */\nfunction edgeFor(a, b, custom){\n  var r = custom && custom[a + '>' + b];\n  if (!r) return findEdge(a, b);\n  if (!r._prep){ r.grp = MEASURE[r.au] || MEASURE[r.bu]; r.custom = 1; r._prep = 1; }\n  return r.au === b\n    ? { from: a, to: b, numVal: r.a, numUnit: r.au, denVal: r.b, denUnit: r.bu, sys: r.sys, ap: !!r.ap, rel: r }\n    : { from: a, to: b, numVal: r.b, numUnit: r.bu, denVal: r.a, denUnit: r.au, sys: r.sys, ap: !!r.ap, rel: r };\n}\n/* chart for a factor given in the problem: it, plus a few rows from the same chart */\nfunction customChart(rel){\n  var pair = [rel.au, rel.bu].sort().join('|');\n  var same = (GROUPS[rel.grp] || []).filter(function(r){\n    return r.sys === rel.sys && !RARE[r.au] && !RARE[r.bu] && [r.au, r.bu].sort().join('|') !== pair;\n  });\n  return shuffle([rel].concat(shuffle(same).slice(0, 3)));\n}\n\nfunction buildOne(sp){\n  var units = sp.route.split('>');\n  if (sp.bigG){\n    var bp = buildBigG({ path: [{ from: units[0], to: units[units.length - 1] }], val: sp.val });\n    bp.story = sp.story; bp.storyMarked = null; bp.emoji = '';\n    if (sp.plain){\n      /* the Big G is the help: one box, no steps */\n      bp.plain = true;\n      bp.steps = [{ kind: 'text', stage: 'plain', result: 'none', answers: bp.steps[1].answers, prompt: '',\n                    hint: 'How many ' + BIGG_WORD[bp.small][1] + ' are in 1 ' + BIGG_WORD[bp.big][0] + '? ' + bp.steps[0].hint + ' Then ' + (bp.down ? 'multiply' : 'divide') + ' ' + bigGNum(sp.val) + ' by that number.' }];\n    }\n    return bp;\n  }\n  var path = [];\n  for (var i = 0; i < units.length - 1; i++) path.push(edgeFor(units[i], units[i + 1], sp.custom));\n  if (sp.rate) return makeRateProblem({ si: 0, story: sp.story, val: sp.val, path: path, rate: sp.rate, emoji: sp.emoji || '', photo: sp.photo || null });\n  var D = '1', N = sp.val;\n  path.forEach(function(e){ D = decMul(D, e.denVal); N = decMul(N, e.numVal); });\n  var places = sp.places == null ? 1 : sp.places;\n  var div = null, answer, rounded = false;\n  if (D !== '1'){ div = buildQuotient(N, D, places, sp.roundMr); answer = div.answer; rounded = div.rounded; }\n  else answer = clean(N);\n  var p = assemble(sp.val, path, N, D, div, answer, rounded, path.length);\n  p.places = places;\n  p.story = sp.story;\n  p.storyMarked = sp.mark || markUnits(sp.story, p.startUnit, p.targetUnit);\n  p.emoji = sp.emoji || ''; p.photo = sp.photo || null;\n  if (sp.startNote) p.steps.forEach(function(st){\n    if (st.kind === 'info' && st.gate && /^Start with what you are given/.test(st.prompt)) st.prompt = sp.startNote + ' ' + st.prompt;\n  });\n  p.convAnswer = answer;\n  if (sp.pre) p.steps = sp.pre.map(function(x){\n    return { kind: 'text', noExpr: true, result: 'none', prompt: x.prompt, answers: x.answers, hint: x.hint };\n  }).concat(p.steps);\n  if (sp.after) sp.after.forEach(function(x){\n    p.steps.push({ kind: 'text', afterAns: true, result: 'none', prompt: x.prompt, answers: x.answers, hint: x.hint });\n  });\n  if (sp.letter){\n    /* set up the conversion factor, then match it to an answer choice\n       (keep: work the whole problem first, then pick the answer choice) */\n    if (!sp.letter.keep){\n      var cut = -1;\n      p.steps.forEach(function(st, j){ if (st.kind === 'cancel') cut = j; });\n      p.steps = p.steps.slice(0, cut + 1);\n      p.div = null;\n    }\n    p.steps.push({ kind: sp.letter.multi ? 'letters' : 'letter', shown: p.factors.length, result: 'none', afterAns: !!sp.letter.keep,\n                   options: sp.letter.options, correct: sp.letter.correct, prompt: sp.letter.prompt, hint: sp.letter.hint });\n    p.letter = sp.letter;\n    p.answer = sp.letter.multi ? sp.letter.correct.map(function(i){ return sp.letter.options[i].k; }).join(' and ')\n                               : sp.letter.options[sp.letter.correct].k;\n  }\n  return p;\n}\n\nfunction makeSpecProblem(){\n  var sp = BANK[String((window.SPEC || {}).qn)] || BANK['1'];\n  if (!sp.chain) return buildOne(sp);\n  var parts = sp.chain.map(function(c){ return buildOne(Object.assign({}, c, { story: sp.story })); });\n  var chain = { parts: sp.chain.map(function(c){ return { label: c.label }; }) };\n  parts.forEach(function(x, i){\n    x.story = sp.story; x.storyMarked = null; x.chain = chain; x.partIdx = i;\n    if (i < parts.length - 1) x.next = parts[i + 1];\n    x.steps[0].prompt = '<b>Part ' + (i + 1) + ': ' + sp.chain[i].ask + '<\/b><br>' + x.steps[0].prompt;\n  });\n  return parts[0];\n}\n\n/* ---- talking to the study-guide page around this drill ---- */\nfunction answerText(){\n  if (problem.chain) return problem.chain.parts.map(function(pt){ return pt.label + ': ' + pt.result; }).join('; ');\n  if (problem.letter) return problem.answer;\n  if (problem.rate) return (problem.approx ? '\\u2248 ' : '') + commafy(problem.answer) + ' ' + (RATE_NAMES[problem.targetUnit] || problem.targetUnit)\n                         + ' per ' + (RATE_SING[problem.targetDenUnit] || problem.targetDenUnit);\n  return (problem.approx ? '≈ ' : '') + commafy(problem.answer) + ' ' + (UNIT_NAME[problem.targetUnit] || problem.targetUnit);\n}\nvar reported = false;\nfunction reportDone(){\n  if (reported) return;\n  reported = true;\n  try { parent.postMessage({ drill: 'sg1', type: 'done', qn: String(window.SPEC.qn), answer: answerText(), clean: !missedThis }, '*'); } catch (e) {}\n}\nfunction goNextQ(){\n  try { parent.postMessage({ drill: 'sg1', type: 'next', qn: String(window.SPEC.qn) }, '*'); } catch (e) {}\n}\n\n\n/* Is this multiplication too messy to do in your head?\n   - Multiplying by 10, 100, 1,000 ... is just a decimal-point hop (MR DL), so those never count.\n   - Times-table facts (both whole numbers up to 12) are head math.\n   - Small-digit work like 1.5 \\u00d7 8 = 12 or 0.5 \\u00d7 16 \\u00d7 3 = 24 is head math.\n   - Otherwise it's messy if a decimal is involved, two numbers aren't round\n     (like 12 \\u00d7 16), or the answer has 4+ meaningful digits (like 3 \\u00d7 5,280). */\nfunction sigDigits(v){ return clean(v).replace('.', '').replace(/^0+/, '').replace(/0+$/, ''); }\nfunction isGross(vals, product){\n  var used = vals.map(clean).filter(function(v){ return !/^10*$/.test(v); });\n  if (used.length < 2) return false;\n\n  var timesTable = used.length === 2 && used.every(function(v){ return /^\\d+$/.test(v) && +v <= 12; });\n  if (timesTable) return false;\n  var smallWork = used.every(function(v){ return sigDigits(v).length <= 2; }) && sigDigits(product).length <= 2;\n  if (smallWork) return false;\n\n  var dec = used.filter(function(v){ return v.indexOf('.') >= 0; });\n  if (dec.length){\n    var easy = dec.length === 1 && decCount(dec[0]) === 1 && clean(product).indexOf('.') < 0 && Number(product) <= 200;\n    if (!easy) return true;\n  }\n  var hard = used.filter(function(v){ return !/^[1-9]0*$/.test(v); }).length;\n  if (hard >= 2) return true;\n  return sigDigits(product).length >= 4;\n}\n\nfunction assemble(startVal, path, N, D, div, answer, rounded, nFactors){\n  var startUnit = path[0].from;\n  var targetUnit = path[path.length - 1].to;\n\n  var factors = path.map(function(e){\n    var tiles = shuffle([\n      { val: e.numVal, unit: e.numUnit, side: 'num' },\n      { val: e.denVal, unit: e.denUnit, side: 'den' }\n    ]);\n    return { numVal: e.numVal, numUnit: e.numUnit, denVal: e.denVal, denUnit: e.denUnit, tiles: tiles, edge: e };\n  });\n\n  var approx = path.some(function(e){ return e.ap; }) || rounded;\n\n  /* ---------- the guided steps ---------- */\n  /* plan first: the route of units, one arrow per conversion factor */\n  var steps = path.length > 1 ? planSteps(path.map(function(e){ return { from: e.from, to: e.to }; }), true) : [];   /* one factor: no plan */\n  steps.push({ kind: 'info', shown: 0, result: 'none', gate: true,\n    prompt: 'Start with what you are given, written as a fraction over 1.' });\n\n  for (var i = 0; i < factors.length; i++){\n    var cancelUnit = (i === 0) ? startUnit : factors[i - 1].numUnit;\n    var f = factors[i];\n    var chartRels = f.edge.rel.custom ? customChart(f.edge.rel) : chartChoices(f.edge.rel);\n    steps.push({ kind: 'chart', fi: i, shown: i + 1, result: 'none', grp: f.edge.rel.grp,\n      rels: chartRels, orient: randomOrient(chartRels), title: chartTitle(f.edge.rel),\n      prompt: 'Which equivalency links <b>' + cancelUnit + '<\/b> and <b>' + f.numUnit + '<\/b>? Click it on the chart.',\n      hint: 'Look for the one row that has both ' + cancelUnit + ' and ' + f.numUnit + ' in it.' });\n    steps.push({ kind: 'flip', fi: i, shown: i + 1, result: 'none', cancelUnit: cancelUnit,\n      prompt: 'Flip it, or keep it?',\n      hint: cancelUnit + ' is on top of the first fraction, so it has to be on the BOTTOM of this one to cancel.' });\n    steps.push({ kind: 'cancel', fi: i, shown: i + 1, result: 'none', cancelUnit: cancelUnit,\n      uids: [ i === 0 ? 's' : 'n' + (i - 1), 'd' + i ],\n      prompt: 'Click <b>' + cancelUnit + '<\/b> to cancel it out.',\n      hint: cancelUnit + ' is on top in one fraction and on the bottom in the other, so the two cancel.' });\n  }\n\n  var numVals = [startVal].concat(factors.map(function(f){ return f.numVal; }));\n  var denVals = ['1'].concat(factors.map(function(f){ return f.denVal; }));\n  var numChain = [startVal].concat(factors.map(function(f){ return f.numVal; })).map(commafy).join(' \\u00d7 ');\n  var denChain = ['1'].concat(factors.map(function(f){ return f.denVal; })).map(commafy).join(' \\u00d7 ');\n\n  steps.push({ kind: 'exprInput', target: 'num', shown: factors.length, result: 'numInput', hl: 'num', calc: isGross(numVals, N),\n    answers: variants(N),\n    prompt: 'Multiply straight across the <b>top<\/b>: ' + numChain + '. Type the product in the numerator.',\n    hint: 'Multiply all the numbers on the top together: ' + numChain + '.' });\n  /* a bottom of 1 is filled in for them: no need to type it */\n  if (D !== '1') steps.push({ kind: 'exprInput', target: 'den', shown: factors.length, result: 'denInput', hl: 'den', calc: isGross(denVals, D),\n    answers: variants(D),\n    prompt: 'Now multiply straight across the <b>bottom<\/b>: ' + denChain + '. Type the product in the denominator.',\n    hint: 'Multiply all the numbers on the bottom together: ' + denChain + '.' });\n\n  if (D === '1'){\n    steps.push({ kind: 'info', shown: factors.length, result: 'done', duration: 1000,\n      prompt: 'The bottom is ' + denChain + ' = 1, and dividing by 1 changes nothing \\u2014 so ' + commafy(N) + ' ' + targetUnit + ' is the answer.' });\n  } else {\n    div.steps.forEach(function(s){ steps.push(s); });\n  }\n\n  return {\n    startVal: startVal, startUnit: startUnit, targetUnit: targetUnit,\n    factors: factors, N: N, D: D, answer: answer, approx: approx, rounded: rounded,\n    div: div, nFactors: nFactors, steps: steps,\n    miniContext: commafy(N) + ' \\u00f7 ' + D,\n    title: 'Convert ' + commafy(startVal) + ' ' + startUnit + ' \\u2192 ' + targetUnit,\n    given: path.map(function(e){ return relText(e.rel); })\n  };\n}\n\n/* ============================================================\n   5.  UI\n   ============================================================ */\nvar TABS = [['one', 'One factor']];   /* one-factor-only version: no two-factor problems */\nvar CATS = [['all', 'All units'], ['within', 'Within a system'], ['between', 'Between systems']];\n\nvar tab = 'one', cat = 'all';\nvar problem = null, stepIdx = 0, wrongCount = 0, solved = 0, streak = 0;\nvar missedThis = false, finished = false, awaitingStart = false, awaitingContinue = false, successTimer = null;\nvar placements = [], cancels = {}, selectedTile = null;\n\nfunction el(id){ return document.getElementById(id); }\n\nfunction renderTabs(){\n  el('tabs').innerHTML = TABS.map(function(t){\n    return '<button class=\"' + (t[0] === tab ? 'active' : '') + '\" onclick=\"setTab(\\'' + t[0] + '\\')\">' + t[1] + '<\/button>';\n  }).join('');\n}\nfunction showStory(marked){\n  document.body.classList.toggle('long-story', String(problem.story || '').replace(/<[^>]+>/g, '').length > 280);\n  var storyHtml = '<div class=\"story\">' + (marked ? problem.storyMarked : problem.story) + '<\/div>';\n  el('problemIndicator').innerHTML = (problem.photo\n      ? '<div class=\"story-row\"><img class=\"story-photo\" src=\"' + problem.photo.src + '\" alt=\"' + problem.photo.alt + '\">' + storyHtml + '<\/div>'\n      : (problem.emoji && !problem.bigG ? '<div class=\"story-pic\" aria-hidden=\"true\">' + problem.emoji + '<\/div>' : '') + storyHtml)\n    + (problem.chain ? '<ol class=\"parts\">' + problem.chain.parts.map(function(pt, i){\n        var cls = pt.result ? 'done' : (i === problem.partIdx ? 'now' : '');\n        return '<li class=\"' + cls + '\">' + pt.label + (pt.result ? ': <b>' + pt.result + '<\/b>' : '') + '<\/li>';\n      }).join('') + '<\/ol>' : '');\n}\n\n/* the words a story uses for each unit */\nvar UNIT_WORDS = {\n  'in': 'inch(?:es)?', 'ft': 'f(?:oo|ee)t', 'yd': 'yards?', 'mi': 'miles?',\n  'oz': 'ounces?', 'lb': 'pounds?', 'T': 'tons?',\n  'tsp': 'teaspoons?', 'tbsp': 'tablespoons?', 'fl oz': 'fluid ounces?', 'c': 'cups?',\n  'pt': 'pints?', 'qt': 'quarts?', 'gal': 'gallons?',\n  'mm': 'millimeters?', 'cm': 'centimeters?', 'm': 'meters?', 'km': 'kilometers?',\n  'mg': 'milligrams?', 'g': 'grams?', 'kg': 'kilograms?',\n  'mL': 'millilit(?:er|re)s?', 'L': 'lit(?:er|re)s?', 'kL': 'kilolit(?:er|re)s?',\n  's': 'seconds?', 'min': 'minutes?', 'hr': 'hours?', 'day': 'days?'\n};\n/* highlight the given unit (its first mention) and the unit asked for (its last mention) */\nfunction markUnits(story, fromU, toU){\n  function spans(u){\n    var out = [], re = new RegExp('\\\\b(' + (UNIT_WORDS[u] || '\\\\$^') + ')\\\\b', 'gi'), m;\n    while ((m = re.exec(story))) out.push([m.index, m.index + m[0].length]);\n    return out;\n  }\n  /* the given unit is the one right after the amount (\"30 liters\", not \"by the liter\") */\n  var as = spans(fromU), a = as.filter(function(r){ return /[0-9][\\s-]$/.test(story.slice(0, r[0])); })[0] || as[0];\n  var bs = spans(toU), b = bs[bs.length - 1];\n  if (!a || !b || (a[0] < b[1] && b[0] < a[1])) return null;\n  var parts = [a, b].sort(function(x, y){ return y[0] - x[0]; }), html = story;\n  parts.forEach(function(r){\n    html = html.slice(0, r[0]) + '<mark>' + html.slice(r[0], r[1]) + '<\/mark>' + html.slice(r[1]);\n  });\n  return html;\n}\n\nfunction setProgress(i, n){ el('progressFill').style.width = Math.round(100 * i / n) + '%'; }\nfunction updateStats(){\n  el('statsLine').innerText = '';\n}\nfunction setTab(t){ tab = t; renderTabs(); newProblem(); }\nfunction setCat(c){ cat = c; renderTabs(); newProblem(); }\n\n/* ---------- long division on/off ---------- */\nvar longDiv = false;\nfunction setLongDiv(on){ longDiv = on; newProblem(); }\n\n/* swap a problem's long-division steps for one \"divide on the calculator\" step */\nfunction divToCalc(p){\n  if (!p || p.calcMode || !p.div) return;\n  var at = -1;\n  p.steps = p.steps.filter(function(st, i){ if (st.div){ if (at < 0) at = i; return false; } return true; });\n  var ans = p.div.answer, exact = String(calcRound(Number(p.N) / Number(p.D)));\n  p.steps.splice(at < 0 ? p.steps.length : at, 0, { kind: 'text', calc: true, shown: p.factors.length, result: 'done',\n    prompt: (NO_CALC ? 'Divide ' : 'Use the calculator: divide ') + commafy(p.N) + ' \\u00f7 ' + commafy(p.D)\n          + (p.div.rounded ? ', then round to the ' + PLACE_NAME[p.places == null ? 1 : p.places] + '.' : '.'),\n    answers ) max = Math.max(max, +k);\n  var html = '<table class=\"ld-table\">';\n  for (r = 0; r < rows.length; r++){\n    html += '<tr' + (rows[r].line ? ' class=\"ld-line-row\"' : '') + '>';\n    var c = 0;\n    while (c <= max){\n      var cell = rows[r].cells[c];\n      if (!cell){ html += '<td' + (c === 0 ? ' class=\"ld-divisor\"' : '') + '><\/td>'; c++; continue; }\n      if (cell.line){ html += '<td><div class=\"ld-line\"><\/div><\/td>'; c++; continue; }\n      if (cell.input){\n        var span = cell.span || 1, w = span * CELL - 6;\n        html += '<td colspan=\"' + span + '\"><input type=\"text\" id=\"gridInput\" class=\"grid-input\" autocomplete=\"off\" '\n             +  'inputmode=\"decimal\" maxlength=\"' + cell.maxlen + '\" style=\"width:' + w + 'px\"><\/td>';\n        c += span; continue;\n      }\n      html += '<td class=\"' + (cell.cls || '') + '\">' + cell.t + '<\/td>';\n      c++;\n    }\n    html += '<\/tr>';\n  }\n  return html + '<\/table>';\n}\n\n/* Grow (or shrink) the expression and the work area so the problem fills the screen.\n   Width: never wider than the page. Height: share whatever vertical room is left. */\nfunction fitAll(probeOnly){\n  var areas = [el('exprArea'), el('workArea')];\n  var box = document.querySelector('.container');\n  areas.forEach(function(a){ a.style.height = ''; });      /* transforms don't affect layout, so no reset needed */\n  el('tray').style.height = '';\n  var dock = el('calcDock');\n  dock.style.transform = ''; dock.style.height = '';\n\n  var prevMin = box.style.minHeight;\n  box.style.minHeight = '0';\n  var bs = getComputedStyle(document.body);\n  var used = box.getBoundingClientRect().height + parseFloat(bs.paddingTop) + parseFloat(bs.paddingBottom);\n  /* a calculator docked beside the problem shouldn't eat the problem's room */\n  var stage = document.querySelector('.stage'), drill = document.querySelector('.drill-layout');\n  if (stage && drill && getComputedStyle(stage).flexDirection === 'row'){\n    use * ---------- expression rendering ---------- */\nfunction unitSpan(uid, txt, clickable){\n  return '<span class=\"unit' + (cancels[uid] ? ' canceled' : '') + (clickable ? ' clickable' : '')\n       + '\" data-uid=\"' + uid + '\">' + txt + '<\/span>';\n}\nfunction fracHtml(numH, denH, hl){\n  return '<div class=\"frac\"><div class=\"fr-num' + (hl === 'num' ? ' hl' : '') + '\">' + numH + '<\/div>'\n       + '<div class=\"fr-bar\"><\/div>'\n       + '<div class=\"fr-den' + (hl === 'den' ? ' hl' : '') + '\">' + denH + '<\/div><\/div>';\n}\nfunction cellHtml(i, side, step){\n  var idx = placements[i][side];\n  if (idx === null || idx === undefined){\n    var active = (step.kind === 'place' && step.fi === i);\n    /* rate problems: the empty box shows which unit belongs in it */\n    var ghost = '?';\n    if (active && problem.rate){\n      var want = problem.factors[i].tiles.filter(function(t){ return t.side === side; })[0];\n      if (want) ghost = want.unit;\n    }\n    return '<span class=\"slot' + (active ? ' active' : '') + '\" data-slot=\"' + i + '-' + side + '\">' + ghost + '<\/span>';\n  }\n  var t = problem.factors[i].tiles[idx];\n  return qty('<span class=\"val\">' + commafy(t.val) + '<\/span>',\n             unitSpan((side === 'num' ? 'n' : 'd') + i, t.unit, step.kind === 'cancel'), t.unit);\n}\n\nfunction renderExpr(step){\n  var p = problem;\n  var shown = (step.shown === undefined) ? p.factors.length : step.shown;\n  var hl = step.hl || null;\n  var h = '<div class=\"expr\">';\n\n  h += fracHtml(qty('<span class=\"val\">' + commafy(p.startVal) + '<\/span>', unitSpan('s', p.startUnit, step.kind === 'cancel'), p.startUnit),\n                '<span class=\"val\">1<\/span>' + (p.startDenUnit ? unitSpan('sd', p.startDenUnit, step.kind === 'cancel') : ''), hl);\n\n  for (var i = 0; i < shown; i++){\n    h += '<div class=\"op\">&times;<\/div>';\n    h += fracHtml(cellHtml(i, 'num', step), cellHtml(i, 'den', step), hl);\n  }\n\n  var res = step.result || 'none';\n  if (res !== 'none'){\n    h += '<div class=\"op\">=<\/div>';\n    var inputH = '<input type=\"text\" id=\"exprInput\" class=\"grid-input\" inputmode=\"decimal\" autocomplete=\"off\">';\n    var numFilled = qty('<span class=\"val\">' + commafy(p.N) + '<\/span>', ' <span class=\"unit\">' + p.targetUnit + '<\/span>', p.targetUnit);\n    var perUnit = p.targetDenUnit ? '<span class=\"unit\">' + p.targetDenUnit + '<\/span>' : '';\n    var numH, denH;\n    if (res === 'numInput'){ numH = inputH; denH = '<span class=\"slot\">?<\/span>'; }\n    else if (res === 'denInput'){ numH = numFilled; denH = inputH + perUnit; }\n    else { numH = numFilled; denH = '<span class=\"val\">' + commafy(p.D) + '<\/span>' + perUnit; }\n    h += fracHtml(numH, denH, null);\n  }\n  return h + '<\/div>';\n}\n\nfunction renderChart(step, pickedIdx){\n  var groups = step.groups || [{ title: step.title, rels: step.rels || [] }], base = 0, cards = '';\n  groups.forEach(function(g){\n    var html = '';\n    g.rels.forEach(function(r, j){\n      var i = base + j, cls = 'chart-row';\n      if (pickedIdx !== undefined && pickedIdx !== null) cls += (i === pickedIdx ? ' picked' : ' dim');\n      html += '<div class=\"' + cls + ' fcard\" data-r=\"' + i + '\">' + factFracHtml(r, step.orient ? step.orient[i] : false) + '<\/div>';\n    });\n    base += g.rels.length;\n    var cols = step.groups ? '' : (g.rels.length === 3 || g.rels.length > 4 ? ' three' : '');\n    cards += '<div class=\"chart-card\"><div class=\"chart-head\">' + g.title\n           + '<\/div><div class=\"chart-grid' + cols + '\">' + html + '<\/div><\/div>';\n  });\n  el('tray').innerHTML = '<div class=\"tray-label\">tap the one you need<\/div>'\n                       + (step.groups ? '<div class=\"chart-pair\">' + cards + '<\/div>' : cards);\n}\n\nfunction renderTray(step, fresh){\n  if (step.kind === 'chart'){ renderChart(step); return; }\n  if (step.kind !== 'place'){ el('tray').innerHTML = ''; return; }\n  var f = problem.factors[step. d === 'plan' || st.kind === 'flip' ? '<div class=\"choice-row\"><button class=\"choice-btn\">Kilometers<\/button><\/div>' : '')\n            + (st.kind === 'text' && !problem.bigG ? '<input class=\"general-input\">' : '')\n            + '<div class=\"feedback\"><\/div><div class=\"link-row\"><button class=\"linkbtn\">Hint<\/button><\/div>';\n      measure(problem.bigG ? bigGHtml(st.stage || 'done') : (st.kind === 'plan' ? planHtml(st) : renderExpr(st)), st, calcOn);\n    });\n    el('inputPanel').innerHTML = '<button class=\"next-btn\">Next problem<\/button><div class=\"tiny\">or press Enter<\/div>';\n    showStory(false);\n    el('promptText').innerHTML = problem.chain ? '<b>Part 1 done.<\/b> On to part 2.' : '';\n    el('promptText').style.display = '';\n    measure(doneHtml(), null, false);\n  }\n  onePass();                                              /* pass 1: tallest instruction line */\n  el('promptText').style.minHeight = maxPromptH + 'px';\n  min = Infinity; maxW = 0;\n  onePass();                                              /* pass 2: sizes with that line held */\n  el('calcDock').innerHTML = '';\n  el('tray').innerHTML = '';\n  problem.lockE = saveLock;\n  problem.exprMinW = maxW;\n  problem.promptMinH = maxPromptH;\n  return min === Infinity ? null : min;\n}\n\n/* hold the layout still for the whole problem: the fraction keeps its spot (left edge fixed,\n   room saved for pieces still to come), the instruction line keeps its height, and the\n   calculator's column stays reserved even when the calculator isn't showing */\nfunction applyLayoutLock(step){\n  var onFraction = !(step && step.div);\n  el('exprArea').style.minWidth = (onFraction && problem.exprMinW) ? problem.exprMinW + 'px' : '';\n  el('exprArea').style.textAlign = (onFraction && problem.exprMinW) ? 'left' : '';\n  el('promptText').style.minHeight = problem.promptMinH ? problem.promptMinH + 'px' : '';\n  document.querySelector('.stage').classList.toggle('calc-reserve', !NO_CALC && !!problem.usesCalc);\n}\n\nfunction renderStep(){\n  el('calcDock').innerHTML = '';\n  queueMicrotask(fitAll);      /* one last fit once this step's buttons and boxes are in place, before it's drawn */\n  if (problem.lockE === undefined){\n    problem.lockE = probeScale();\n    if (problem.alt){                                        /* either-order twin keeps the same size and spot */\n      ['lockE', 'exprMinW', 'promptMinH', 'usesCalc'].forEach(function(k){ problem.alt[k] = problem[k]; });\n    }\n  }\n  applyLayoutLock(problem.steps[stepIdx]);\n  var step = problem.steps[stepIdx];\n  wrongCount = 0;\n  /* one-factor chart step: no instructions, just the question with its two units highlighted */\n  var cueOnly = step.kind === 'chart' && problem.nFactors === 1 && problem.storyMarked;\n  showStory(cueOnly || (step.kind === 'plan' && !!problem.storyMarked));\n  el('promptText').innerHTML = cueOnly ? '' : step.prompt;\n  el('promptText').style.display = '';\n  setProgress(stepIdx, problem.steps.length);\n\n  if (step.div){\n    el('exprArea').innerHTML = '<div class=\"mini-context\">' + problem.miniContext + '<\/div>';\n    el('workArea').innerHTML = step.html ? step.html : renderGrid(step.grid);\n  } else {\n    el('exprArea').innerHTML = problem.bigG ? bigGHtml(step.stage)\n      : step.noExpr || step.kind === 'letters' ? '' : step.afterAns ? afterHtml()\n      : (step.kind === 'plan' ? planHtml(step) : renderExpr(step));\n    el('workArea').innerHTML = '';\n  }\n  renderTray(step, step.kind === 'place');\n  fitAll();\n\n  var panel = el('inputPanel');\n\n  if (step.kind === 'info'){\n    if (step.gate){\n      awaitingContinue = true;\n      panel.innerHTML = '<button class=\"next-btn\" onclick=\"continueStep()\">Next<\/button>'\n                      + '<div class=\"tiny\">or press Enter<\/div>';\n      return;\n    }\n    panel.innerHTML = '<div class=\"feedback\" id=\"feedback\"><\/div>';\n    successTimer = setTimeout(advance, step.duration || 1400);\n    return;\n  }\n  if (step.kind === 'anim'){\n    panel.innerHTML = '<button class=\"linkbtn\" onclick=\"replayAnim()\">Replay<\/button><div class=\"feedback\" id=\"feedback\"><\/div>';\n    successTimer = setTimeout(advance, step.duration);\n    return;\n  }\n  if (step.kind === 'plan'){\n    panel.innerHTML = '<div class=\"choice-row\">' + step.options.map(function(o, i){\n        return '<button class=\"choice-btn\" id=\"planOpt' + i + '\" onclick=\"choosePlan(' + i + ')\">' + (UNIT_NAME[o.u] || o.u) + '<\/button>';\n      }).join('') + '<\/div>'\n      + '<button class=\"linkbtn\" onclick=\"showHint()\">Hint<\/button><div class=\"feedback\" id=\"feedback\"><\/div>';\n    return;\n  }\n  if (step.kind === 'flip'){\n    panel.innerHTML = '<div class=\"choice-row\">'\n      + '<button class=\"choice-btn\" onclick=\"flipChoice(true)\">Flip ↕<\/button>'\n      + '<button class=\"choice-btn\" onclick=\"flipChoice(false)\">Keep<\/button><\/div>'\n      + '<button class=\"linkbtn\" onclick=\"showHint()\">Hint<\/button><div class=\"feedback\" id=\"feedback\"><\/div>';\n    return;\n  }\n  if (step.kind === 'letter' || step.kind === 'letters'){\n    var multi = step.kind === 'letters';\n    if (multi) step.sel = [];\n    panel.innerHTML = '<div class=\"choice-row letter-row' + (multi || step.options.some(function(o){ return o.h; }) ? ' letter-col' : '') + '\">'\n      + step.options.map(function(o, i){\n        return '<button class=\"choice-btn letter-btn\" id=\"letOpt' + i + '\" onclick=\"' + (multi ? 'toggleLetter' : 'chooseLetter') + '(' + i + ')\"'\n             + (multi ? ' aria-pressed=\"false\"' : '') + '>' + (multi ? '<span class=\"lbox\"><\/span>' : '') + '<b>' + o.k + '.<\/b>' + optHtml(o) + '<\/button>';\n      }).join('') + '<\/div>'\n      + (multi ? '<button class=\"next-btn\" onclick=\"checkLetters()\">Check<\/button>' : '')\n      + '<button class=\"linkbtn\" onclick=\"showHint()\">Hint<\/button><div class=\"feedback\" id=\"feedback\"><\/div>';\n    return;\n  }\n  if (step.kind === 'choice'){\n    panel.innerHTML = '<div class=\"choice-row\">' + step.options.map(function(o, i){\n        return '<button class=\"choice-btn\" onclick=\"chooseOpt(' + i + ')\">' + o + '<\/button>';\n      }).join('') + '<\/div>'\n      + '<button class=\"linkbtn\" onclick=\"showHint()\">Hint<\/button><div class=\"feedback\" id=\"feedback\"><\/div>';\n    return;\n  }\n  if (step.kind === 'place' || step.kind === 'cancel' || step.kind === 'chart'){\n    panel.innerHTML = '<button class=\"linkbtn\" onclick=\"showHint()\">Hint<\/button><div class=\"feedback\" id=\"feedback\"><\/div>';\n    wireInteractive(step);\n    return;\n  }\n  if (step.kind === 'text'){\n    panel.innerHTML = (problem.bigG ? '' : '<input type=\"text\" id=\"generalInput\" class=\"general-input\" autocomplete=\"off\" inputmode=\"decimal\" placeholder=\"Answer\">')\n                    + (step.calc\n                        ? '<div class=\"link-row\"><button class=\"linkbtn\" onclick=\"showHint()\">Hint<\/button>'\n                          + '<button class=\"linkbtn\" id=\"calcToggle\" onclick=\"toggleCalc()\"><\/button><\/div>'\n                        : '<button class=\"linkbtn\" onclick=\"showHint()\">Hint<\/button>')\n                    + '<div class=\"feedback\" id=\"feedback\"><\/div>';\n    if (step.calc){\n      el('calcDock').innerHTML = calcHtml(false);\n      calcReset();\n      syncCalcToggle();\n      fitAll();\n    }\n    fitAll();                                       /* re-fit now that the answer box takes up room */\n    wire(el('generalInput'));\n    if (step.calc) setTimeout(focusCalc, 80);      /* cursor starts in the calculator */\n    return;\n  }\n  /* grid + exprInput */\n  if (step.kind === 'exprInput'){\n    panel.innerHTML = '<div class=\"feedback\" id=\"feedback\"><\/div>'\n                    + '<div class=\"link-row\"><button class=\"linkbtn\" onclick=\"showHint()\">Hint<\/button>'\n                    + '<button class=\"linkbtn\" id=\"calcToggle\" onclick=\"toggleCalc()\"><\/button><\/div>';\n    el('calcDock').innerHTML = calcHtml(!step.calc);\n    calcReset();\n    syncCalcToggle();\n    fitAll();                               /* re-fit now that the calculator takes up room */\n    wire(el('exprInput'));\n    if (step.calc) setTimeout(focusCalc, 80);      /* cursor starts in the calculator */\n    return;\n  }\n  panel.innerHTML = '<button class=\"linkbtn\" onclick=\"showHint()\">Hint<\/button><div class=\"feedback\" id=\"feedback\"><\/div>';\n  wire(el(step.kind === 'exprInput' ? 'exprInput' : 'gridInput'));\n}\n\nfunction replayAnim(){\n  clearTimeout(successTimer);\n  var step = problem.steps[stepIdx], area = el('workArea');\n  area.innerHTML = '';\n  void area.offsetWidth;\n  area.innerHTML = step.html;\n  fitAll();\n  successTimer = setTimeout(advance, step.duration);\n}\n\n/* ---------- drag / click wiring ---------- */\nfunction wireTiles(step){\n  Array.prototype.forEach.call(document.querySelectorAll('#tray .tile'), function(t){\n    var idx = +t.getAttribute('data-t');\n    if (t.getAttribute('data-used')) return;\n    t.addEventListener('click', function(){ selectedTile = idx; renderTray(step); wireTiles(step); });\n    t.addEventListener('dragstart', function(e){\n      selectedTile = idx;\n      try { e.dataTransfer.setData('text/plain', String(idx)); } catch (err) {}\n      if (e.dataTransfer) e.dataTransfer.effectAllowed = 'move';\n    });\n  });\n}\n\nfunction wireInteractive(step){\n  if (step.kind === 'chart'){\n    Array.prototype.forEach.call(document.querySelectorAll('#tray .chart-row'), function(row){\n      row.addEventListener('click', function(){ pickRel(+row.getAttribute('data-r')); });\n    });\n  }\n  if (step.kind === 'place'){\n    wireTiles(step);\n    Array.prototype.forEach.call(document.querySelectorAll('#exprArea .slot'), function(s){\n      var id = s.getAttribute('data-slot');\n      if (!id) return;\n      s.addEventListener('click', function(){ dropOn(id, selectedTile); });\n      s.addEventListener('dragover', function(e){ e.preventDefault(); s.classList.add('over'); });\n      s.addEventListener('dragleave', function(){ s.classList.remove('over'); });\n      s.addEventListener('drop', function(e){\n        e.preventDefault(); s.classList.remove('over');\n        var d = '';\n        try { d = e.dataTransfer.getData('text/plain'); } catch (err) {}\n        dropOn(id, d === '' ? selectedTile : +d);\n      });\n    });\n  }\n  if (step.kind === 'cancel'){\n    Array.prototype.forEach.call(document.querySelectorAll('#exprArea .unit.clickable'), function(u){\n      u.addEventListener('click', function(){ tryCancel(u.getAttribute('data-uid')); });\n    });\n  }\n}\n\nfunction pickRel(idx){\n  var step = problem.steps[stepIdx], fb = el('feedback');\n  var rels = step.rels || [], got = rels[idx];\n  var want = problem.factors[step.fi].edge.rel;\n\n  if (got !== want && problem.alt && step.fi === 0 && got === problem.alt.factors[0].edge.rel){\n    problem = problem.alt;                       /* same problem, other order */\n    step = problem.steps[stepIdx];\n    want = got;\n  }\n\n  if (got === want){\n    renderChart(step, idx);\n    /* it goes in exactly as it sat on the chart; the next step decides whether to flip it */\n    var topU = (step.orient && step.orient[idx]) ? got.bu : got.au;\n    var tiles = problem.factors[step.fi].tiles, ti = tiles[0].unit === topU ? 0 : 1;\n    placements[step.fi] = { num: ti, den: 1 - ti };\n    fb.className = 'feedback success';\n    fb.innerText = 'Correct!';\n    clearTimeout(successTimer);\n    successTimer = setTimeout(advance, 750);\n    return;\n  }\n\n  /* the between-systems chart lists some pairs twice (1 mi \\u2248 1.61 km and 1 km \\u2248 0.62 mi).\n     Clicking the twin is good thinking, so redirect instead of marking it wrong. */\n  var twin = (got.au === want.au && got.bu === want.bu) || (got.au === want.bu && got.bu === want.au);\n  if (twin){\n    fb.className = 'hint-line';\n    fb.innerHTML = 'Good eye \\u2014 that row links the same two units. This problem is built on the other one: <b>'\n                 + relRowText(want) + '<\/b>.';\n    return;\n  }\n\n  missedThis = true;\n  wrongCount++;\n  fb.className = wrongCount >= 2 ? 'hint-line' : 'feedback error';\n  fb.innerHTML = wrongCount >= 2 ? step.hint\n    : 'That row does not have both of the units you need. Look again.';\n}\n\n/* plan first: pick the next unit on the route */\nfunction choosePlan(i){\n  var step = problem.steps[stepIdx], fb = el('feedback'), o = step.options[i];\n  if (!o || successTimer && fb.className.indexOf('success') >= 0) return;\n  if (o.ok){\n    el('exprArea').innerHTML = planHtml({ hops: step.hops, chain: step.chain, hop: step.hop + 1 });\n    fb.className = 'feedback success';\n    fb.innerText = 'Correct!';\n    clearTimeout(successTimer);\n    successTimer = setTimeout(advance, 500);\n    return;\n  }\n  missedThis = true;\n  wrongCount++;\n  var b = el('planOpt' + i); if (b) b.classList.add('no');\n  fb.className = wrongCount >= 2 ? 'hint-line' : 'feedback error';\n  fb.innerHTML = wrongCount >= 2 ? step.hint : PLAN_WHY[o.why];\n}\n\n/* flip the conversion factor, or keep it, so its unit cancels */\nfunction flipChoice(doFlip){\n  var step = problem.steps[stepIdx], fb = el('feedback'), pl = placements[step.fi];\n  if (step.kind !== 'flip' || (successTimer && fb.className.indexOf('success') >= 0)) return;\n  if (doFlip){ var t = pl.num; pl.num = pl.den; pl.den = t; }\n  el('exprArea').innerHTML = renderExpr(step);\n  fitAll();\n  if (problem.factors[step.fi].tiles[pl.num].side === 'num'){\n    fb.className = 'feedback success';\n    fb.innerText = 'Correct!';\n    clearTimeout(successTimer);\n    successTimer = setTimeout(advance, 600);\n    return;\n  }\n  missedThis = true;\n  wrongCount++;\n  Array.prototype.forEach.call(document.querySelectorAll('#exprArea .unit'), function(u){\n    if (u.textContent === step.cancelUnit) u.classList.add('clash');\n  });\n  fb.className = wrongCount >= 2 ? 'hint-line' : 'feedback error';\n  fb.innerHTML = wrongCount >= 2 ? step.hint : 'Nothing cancels.';\n}\n\nfunction optHtml(o){\n  return o.h ? '<span class=\"opt-h\">' + o.h + '<\/span>'\n             : '<span class=\"mini-frac\"><span>' + o.t + '<\/span><span class=\"mf-bar\"><\/span><span>' + o.b + '<\/span><\/span>';\n}\n/* select all that apply */\nfunction toggleLetter(i){\n  var step = problem.steps[stepIdx]; if (!step.sel || finished) return;\n  var k = step.sel.indexOf(i);\n  if (k >= 0) step.sel.splice(k, 1); else step.sel.push(i);\n  var b = el('letOpt' + i);\n  if (b){ b.classList.toggle('on', k < 0); b.classList.remove('no'); b.setAttribute('aria-pressed', k < 0 ? 'true' : 'false'); }\n}\nfunction checkLetters(){\n  var step = problem.steps[stepIdx], fb = el('feedback');\n  if (successTimer && fb.className.indexOf('success') >= 0) return;\n  if (!step.sel.length){ fb.className = 'feedback'; fb.innerText = 'Tap every choice that works, then Check.'; return; }\n  var wrong = step.sel.filter(function(i){ return step.correct.indexOf(i) < 0; });\n  var miss = step.correct.filter(function(i){ return step.sel.indexOf(i) < 0; });\n  if (!wrong.length && !miss.length){\n    fb.className = 'feedback success';\n    fb.innerText = 'Correct! ' + step.correct.map(function(i){ return step.options[i].k; }).join(' and ') + ' both turn inches into yards.';\n    clearTimeout(successTimer); successTimer = setTimeout(advance, 1100); return;\n  }\n  missedThis = true; wrongCount++;\n  wrong.forEach(function(i){ var b = el('letOpt' + i); if (b) b.classList.add('no'); });\n  fb.className = 'feedback error';\n  fb.innerHTML = wrong.length ? step.options[wrong[0]].fb : (step.options[miss[0]].fb || 'There is one more that works.');\n}\n\n/* Q2: match the factor that was built to an answer choice */\nfunction chooseLetter(i){\n  var step = problem.steps[stepIdx], fb = el('feedback'), o = step.options[i];\n  if (!o || (successTimer && fb.className.indexOf('success') >= 0)) return;\n  if (i === step.correct){\n    fb.className = 'feedback success';\n    fb.innerText = o.ok || ('Correct! ' + o.k + ' puts feet on the bottom, so feet cancels and miles is left.');\n    clearTimeout(successTimer);\n    successTimer = setTimeout(advance, 900);\n    return;\n  }\n  missedThis = true;\n  wrongCount++;\n  var b = el('letOpt' + i); if (b) b.classList.add('no');\n  fb.className = wrongCount >= 2 ? 'hint-line' : 'feedback error';\n  fb.innerHTML = wrongCount >= 2 ? (o.fb || '') + ' ' + step.hint : (o.fb || 'Not that one.');\n}\n\nfunction chooseOpt(i){\n  var step = problem.steps[stepIdx], fb = el('feedback');\n  if (i === step.correct){\n    fb.className = 'feedback success';\n    fb.innerText = 'Correct \\u2014 divide, so move left.';\n    el('workArea').innerHTML = mrdlCardHtml('D');\n    clearTimeout(successTimer);\n    successTimer = setTimeout(advance, 700);\n    return;\n  }\n  missedThis = true;\n  wrongCount++;\n  fb.className = wrongCount >= 2 ? 'hint-line' : 'feedback error';\n  fb.innerHTML = wrongCount >= 2 ? step.hint : 'Not quite \\u2014 that is the direction for multiplying.';\n}\n\nfunction dropOn(slotId, tileIdx){\n  var step = problem.steps[stepIdx], fb = el('feedback');\n  if (step.kind !== 'place') return;\n  var parts = slotId.split('-'), fi = +parts[0], side = parts[1];\n\n  if (tileIdx === null || tileIdx === undefined || isNaN(tileIdx)){\n    fb.className = 'feedback error';\n    fb.innerText = 'Tap a piece first, then tap a box.';\n    return;\n  }\n  if (fi !== step.fi){\n    fb.className = 'feedback error';\n    fb.innerText = 'Finish this conversion factor first.';\n    return;\n  }\n  var filled = placements[fi][side];\n  if (filled !== null && filled !== undefined){\n    fb.className = 'feedback error';\n    fb.innerText = 'That box is already filled \\u2014 use the other one.';\n    return;\n  }\n\n  var tile = problem.factors[fi].tiles[tileIdx];\n  if (tile.side !== side){\n    missedThis = true;\n    wrongCount++;\n    fb.className = wrongCount >= 2 ? 'hint-line' : 'feedback error';\n    fb.innerHTML = wrongCount >= 2 ? step.hint\n      : 'Not that box \\u2014 ' + step.cancelUnit + ' has to sit on ' + (step.cancelTop ? 'top' : 'the bottom') + ' so it can cancel.';\n    return;\n  }\n\n  placements[fi][side] = tileIdx;\n  selectedTile = null;\n  var pl = placements[fi];\n  var done = pl.num !== null && pl.num !== undefined && pl.den !== null && pl.den !== undefined;\n\n  el('exprArea').innerHTML = renderExpr(step);\n  fb.className = 'feedback success';\n\n  if (done){\n    fb.innerText = 'Correct!';\n    el('tray').innerHTML = '';\n    fitAll();\n    clearTimeout(successTimer);\n    successTimer = setTimeout(advance, 450);\n  } else {\n    fb.innerText = 'Good \\u2014 now place the other piece.';\n    renderTray(step);\n    wireInteractive(step);\n    fitAll();\n  }\n}\n\nfunction tryCancel(uid){\n  var step = problem.steps[stepIdx], fb = el('feedback');\n  if (step.uids.indexOf(uid) < 0){\n    missedThis = true;\n    wrongCount++;\n    fb.className = wrongCount >= 2 ? 'hint-line' : 'feedback error';\n    var node = document.querySelector('#exprArea [data-uid=\"' + uid + '\"]');\n    var u = node ? node.textContent : '';\n    var later = problem.steps.slice(stepIdx + 1).some(function(s){ return s.kind === 'cancel' && s.uids.indexOf(uid) >= 0; });\n    var keeps = !later && (u === problem.targetUnit || u === problem.targetDenUnit);\n    var first = later\n      ? '<b>' + u + '<\/b> will cancel later, after its conversion factor is added. Right now, cancel <b>' + step.cancelUnit + '<\/b>.'\n      : keeps\n        ? '<b>' + u + '<\/b> stays. It\\u2019s part of the answer' + (problem.rate ? ' (' + problem.targetUnit + ' per ' + problem.targetDenUnit + ')' : '') + '. Cancel <b>' + step.cancelUnit + '<\/b> instead.'\n        : 'That one does not cancel \\u2014 find the same unit on top of one fraction and the bottom of another.';\n    fb.innerHTML = wron gle Form */\n.ti-modal{position:fixed;inset:0;z-index:150;background:rgba(15,23,42,.45);display:grid;place-items:center;padding:16px}\n.ti-card{background:#fff;border:2px solid var(--good);border-radius:16px;padding:22px 26px;width:100%;max-width:560px;max-height:94vh;overflow:auto;display:flex;flex-direction:column;gap:12px}\n.ti-card h2{margin:0;font-family:var(--sans);font-size:32px;color:var(--good)}\n.ti-sub{margin:0;font-size:18px}\n.ti-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}\n.ti-q{display:inline-flex;align-items:center;justify-content:center;height:32px;border-radius:8px;border:1.5px solid #cbd5e1;background:#fff;color:#94a3b8;font-weight:bold;font-size:14px}\n.ti-q.done{background:#E3F5EC;border-color:var(--good);color:var(--good)}\n.ti-legend{display:flex;flex-wrap:wrap;gap:16px;font-size:14px;color:var(--muted)}\n.ti-legend>span{display:inline-flex;align-items:center;gap:6px}\n.ti-legend .ti-q{width:22px;height:22px;font-size:11px}\n#tiForm{display:flex;flex-direction:column;gap:8px}\n#tiForm label{font-weight:bold}\n.ti-warn{background:#E3F5EC;border-radius:10px;padding:8px 12px;font-size:15px}\n#tiCode{font:18px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.2em;text-transform:uppercase;max-width:260px;padding:9px 12px;border:1.5px solid #cbd5e1;border-radius:10px}\n#tiCode:focus{outline:2px solid var(--good);outline-offset:1px}\n.ti-card .btn{height:50px;font-size:18px;padding:0 20px;align-self:flex-start}\n.ti-feedback{margin:0;font-size:17px}\n.ti-feedback:empty{display:none}\n.ti-feedback .ok{color:var(--good);font-size:22px;font-weight:800}\n\n@media (max-width:1050px){\n  .stage{grid-template-columns:minmax(0,1fr)}\n  .app{padding:12px 14px 20px}\n  .prompt{font-size:24px}\n}\n@media (max-width:520px){\n  .brand{font-size:24px}\n  .qcard{font-size:20px}\n  .ti-grid{grid-template-columns:repeat(5,1fr)}\n  .btn{height:56px;font-size:19px;padding:0 22px}\n}\n@media (prefers-reduced-motion:no-preference){\n  .hop.draw{stroke-dasharray:300;stroke-dashoffset:300;animation:draw .5s ease-out forwards}\n  @keyframes draw{to{stroke-dashoffset:0}}\n}\n<\/style>\n<\/head>\n<body>\n<div class=\"app\">\n  <div class=\"bar\" hidden>\n    <div class=\"brand\">Metric Conversions<\/div>\n    <div class=\"count\" id=\"count\"><\/div>\n    <button class=\"btn go\" id=\"turnBtn\" type=\"button\">Turn in<\/button>\n  <\/div>\n  <div class=\"stage\">\n    <section class=\"visual\" aria-label=\"Problem\">\n      <p class=\"qcard\" id=\"q\"><\/p>\n      <svg class=\"stairs\" id=\"stairs\" viewBox=\"0 0 760 530\" role=\"group\" aria-label=\"King Henry Died By Drinking Chocolate Milk staircase\"><\/svg>\n      <p class=\"rule\">Down the stairs (to the right): move the decimal point right.<br>Up the stairs (to the left): move it left.<\/p>\n      <div id=\"sgFactSlot\"><\/div>\n    <\/section>\n    <section class=\"work\" aria-live=\"polite\">\n      <div class=\"mode\" id=\"mode\"><\/div>\n      <p class=\"prompt\" id=\"prompt\"><\/p>\n      <div class=\"area\" id=\"area\"><\/div>\n      <p class=\"feedback\" id=\"feedback\"><\/p>\n    <\/section>\n  <\/div>\n<\/div>\n<script>window.SPEC=__SPEC__;<\/script>\n<style>\n/* fun fact: inside the question box, at the bottom, just for fun */\n.sgfact{margin-top:auto;display:block;text-align:left;padding:8px 14px;border-radius:10px;background:#F4F0FF;border:1.5px dashed #B9A7EE;font:15px/1.4 'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif;color:#1D2939;font-weight:400;letter-spacing:0}\n.sgfact .sgf-l{font-weight:800;color:#5B3FC4;margin-right:6px;white-space:nowrap}\n.sgfact .sgf-n{display:block;font-size:12px;color:#667085;font-style:italic;margin-top:2px}\n.container.hasfact{display:flex;flex-direction:column}\n.container.hasfact>.sgfact{margin:auto auto 0;width:100%;max-width:720px}\n.visual>.sgfact{flex:none}\n<\/style>\n<script>\nwindow.SG_FACT=(window.SPEC&&window.SPEC.fact)||'';\nwindow.sgFactHTML=function(){return window.SG_FACT?'<div class=\"sgfact\" role=\"note\" aria-label=\"Fun fact\"><span class=\"sgf-l\">💡 Fun fact<\/span>'+window.SG_FACT+'<\/div>':'';};\n(function(){var sl=document.getElementById('sgFactSlot');if(!sl)return;\n  if(!window.SG_FACT){sl.remove();return}\n  sl.parentElement.classList.add('hasfact');sl.outerHTML=window.sgFactHTML();})();\n<\/script>\n\n<script>\nconst $=id=>document.getElementById(id);\nconst rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1));\nconst one=a=>a[rand(0,a.length-1)];\nconst shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};\nconst cap=s=>s.charAt(0).toUpperCase()+s.slice(1);\n\n/* ---------- King Henry Died By Drinking Chocolate Milk ---------- */\nconst PRE=[\n  {w:'King',p:'kilo',a:'k'},{w:'Henry',p:'hecto',a:'h'},{w:'Died',p:'deka',a:'da'},\n  {w:'By',p:'',a:'',base:true},\n  {w:'Drinking',p:'deci',a:'d'},{w:'Chocolate',p:'centi',a:'c'},{w:'Milk',p:'milli',a:'m'}];\nconst BASE={m:'meter',g:'gram',L:'liter'};\nconst ab=(t,i)=>PRE[i].a+t;                                   /* km, dag, mL */\nconst name=(t,i,pl=true)=>PRE[i].p+BASE[t]+(pl?'s':'');       /* kilometers */\nconst K=0,H=1,DA=2,B=3,D=4,C=5,M=6;\nconst full=(t,i,pl=true)=>`${name(t,i,pl)} (${ab(t,i)})`;                 /* kilometers (km) */\nconst amt=(v,t,i)=>`<b>${v} ${full(t,i,v!=='1')}<\/b>`;                     /* 3.5 kilometers (km) */\n\n/* ---------- moving the decimal point, done with digit strings (no rounding errors) ---------- */\nfunction parts(v){const [i,f='']=v.split('.');return {dg:i+f,p:i.length}}\nfunction fmt(dg,p){\n  let s=dg;\n  if(p>s.length) s+='0'.repeat(p-s.length);\n  if(p<0){s='0'.repeat(-p)+s;p=0}\n  const i=s.slice(0,p).replace(/^0+/,'')||'0', f=s.slice(p).replace(/0+$/,'');\n  return f?i+'.'+f:i;\n}\nconst shift=(v,n)=>{const {dg,p}=parts(v);return fmt(dg,p+n)};\nfunction norm(s){\n  s=String(s).replace(/[,\\s]/g,'');\n  if(!/^\\d*\\.?\\d*$/.test(s)||!/\\d/.test(s)) return null;\n  if(s[0]==='.') s='0'+s;\n  const {dg,p}=parts(s); return fmt(dg,p);\n}\nconst show=v=>{const [i,f]=v.split('.');return i.replace(/\\B(?=(\\d{3})+(?!\\d))/g,',')+(f?'.'+f:'')};\n\n/* ---------- problems ---------- */\nconst KID=[['Maya','she'],['Jordan','he'],['Luis','he'],['Aisha','she'],['Ethan','he'],['Sofia','she'],['Malik','he'],['Chloe','she'],['Andre','he'],['Priya','she']];\nconst d1=(lo,hi)=>`${rand(lo,hi)}.${rand(1,9)}`;              /* 4.7 */\nconst d2=(lo,hi)=>`${rand(lo,hi)}.${rand(0,9)}${rand(1,9)}`;  /* 1.45 */\nconst n=(lo,hi)=>String(rand(lo,hi));\nconst STORIES=[\n  ['m',K,B,()=>one([n(2,9),d1(1,9)]),v=>{const [k,pr]=one(KID);return `${k} ran ${amt(v,'m',0)} in a race. How many meters (${ab('m',3)}) did ${pr} run?`}],\n  ['m',C,M,()=>one([n(9,19),d1(9,18)]),v=>`A pencil is ${amt(v,'m',5)} long. How long is it in millimeters (${ab('m',6)})?`],\n  ['m',B,C,()=>d2(1,1),v=>{const [k,pr]=one(KID);return `${k} is ${amt(v,'m',3)} tall. How tall is ${pr} in centimeters (${ab('m',5)})?`}],\n  ['m',M,C,()=>n(3,9),v=>`A ladybug is ${amt(v,'m',6)} long. How long is it in centimeters (${ab('m',5)})?`],\n  ['m',B,K,()=>n(350,4800),v=>`The walk from school to the park is ${amt(v,'m',3)}. How many kilometers (${ab('m',0)}) is that?`],\n  ['m',C,B,()=>n(45,250),v=>`A desk is ${amt(v,'m',5)} wide. How many meters (${ab('m',3)}) wide is it?`],\n  ['m',DA,B,()=>d1(1,1),v=>`A school bus is about ${amt(v,'m',2)} long. How many meters (${ab('m',3)}) long is it?`],\n  ['m',H,B,()=>one([n(2,9),d1(1,4)]),v=>`A soccer field is about ${amt(v,'m',1)} long. How many meters (${ab('m',3)}) is that?`],\n  ['m',D,C,()=>one([n(2,9),d1(1,3)]),v=>`A shoe box is ${amt(v,'m',4)} long. How long is it in centimeters (${ab('m',5)})?`],\n  ['g',K,B,()=>one([n(2,9),d1(1,9)]),v=>`A bag of apples has a mass of ${amt(v,'g',0)}. What is its mass in grams (${ab('g',3)})?`],\n  ['g',B,K,()=>n(250,3500),v=>`A bag of dog food has a mass of ${amt(v,'g',3)}. What is its mass in kilograms (${ab('g',0)})?`],\n  ['g',B,M,()=>one(['1','2','1.5','0.5','3']),v=>`A paper clip has a mass of ${amt(v,'g',3)}. What is its mass in milligrams (${ab('g',6)})?`],\n  ['g',M,B,()=>n(200,900),v=>`A vitamin has ${amt(v,'g',6)} of vitamin C. How many grams (${ab('g',3)}) is that?`],\n  ['g',C,B,()=>n(40,95),v=>`A grape has a mass of ${amt(v,'g',5)}. How many grams (${ab('g',3)}) is that?`],\n  ['L',M,B,()=>n(250,1500),v=>`A water bottle holds ${amt(v,'L',6)}. How many liters (${ab('L',3)}) is that?`],\n  ['L',B,M,()=>one([n(2,4),d1(1,4)]),v=>`A jug of juice holds ${amt(v,'L',3)}. How many milliliters (${ab('L',6)}) is that?`],\n  ['L',K,B,()=>d1(1,9),v=>`A small pool holds ${amt(v,'L',0)} of water. How many liters (${ab('L',3)}) is that?`],\n  ['L',D,M,()=>one([n(2,5),d1(1,4)]),v=>`A cup holds ${amt(v,'L',4)}. How many milliliters (${ab('L',6)}) is that?`],\n  ['L',H,B,()=>one([n(2,5),d1(1,3)]),v=>`A rain barrel holds ${amt(v,'L',1)}. How many liters (${ab('L',3)}) is that?`],\n  ['L',B,C,()=>d1(1,6),v=>`A soup pot holds ${amt(v,'L',3)}. How many centiliters (${ab('L',5)}) is that?`]\n];\nfunction randVal(){\n  return one([n(1,9),n(10,99),n(100,950),d1(1,9),d1(10,99),d2(1,9),`0.${rand(1,9)}`,`0.${rand(1,9)}${rand(1,9)}`,`0.0${rand(1,9)}`]);\n}\nfunction okAns(a){const [i,f='']=a.split('.');return f.length<=5&&i.length<=7}\nfunction plainProb(){\n  const t=one(['m','g','L']);\n  for(;;){\n    const a=rand(0,6), b=rand(0,6); if(a===b) continue;\n    const v=randVal(), ans=shift(v,b-a); if(!okAns(ans)) continue;\n    return {t,a,b,v,ans,q:`Convert ${amt(v,t,a)} to ${full(t,b)}.`};\n  }\n}\nlet storyBag=[];\nfunction storyProb(){\n  if(!storyBag.length) storyBag=shuffle(STORIES);\n  const [t,a,b,val,txt]=storyBag.pop(), v=val();\n  return {t,a,b,v,ans:shift(v,b-a),q:txt(v)};\n}\n/* deka (dam, dag, daL) comes up in at most one problem per session */\nlet dekaUsed=false;\nfunction gen(){\n  for(;;){\n    const p=Math.random()<.5?storyProb():plainProb();\n    const deka=p.a===DA||p.b===DA;\n    if(deka&&dekaUsed) continue;\n    if(deka) dekaUsed=true;\n    return p;\n  }\n}\n\n/* ---------- the study guide problems (picked by window.SPEC.qn) ---------- */\nconst SG_BANK={\n 'b9': {t:'L',a:B,b:M,v:'0.3', q:v=>`A water bottle holds ${amt(v,'L',3)}. How many milliliters (${ab('L',6)}) can it hold?`},\n 'b11':{t:'m',a:C,b:B,v:'53',  q:v=>`Allen cut a piece of string that is ${amt(v,'m',5)} long. What is the length of the string in meters (${ab('m',3)})?`},\n 'b16':{t:'m',a:K,b:B,v:'1.5', q:v=>`Paige rode her bike ${amt(v,'m',0)}. How many meters (${ab('m',3)}) did she ride her bike?`},\n 'k1':{t:'g',a:K,b:B,v:'4.2', q:v=>`A watermelon weighs ${amt(v,'g',0)}. What is the weight of the watermelon in grams (${ab('g',3)})?`},\n 'e2':{t:'L',a:B,b:M,v:'0.2', q:v=>`Max’s juice box holds ${amt(v,'L',3)}. How many milliliters (${ab('L',6)}) does it hold?`},\n 'e5':{t:'m',a:C,b:B,v:'19',  q:v=>`Austin’s pencil is ${amt(v,'m',5)} long. What is the length of the pencil in meters (${ab('m',3)})?`},\n 'e6':{t:'m',a:K,b:B,v:'3.2', q:v=>`Gwen ran ${amt(v,'m',0)} in a race. How many meters (${ab('m',3)}) did she run?`},\n 'c11':{t:'m',a:K,b:B,v:'0.45',q:v=>`The distance from the post office to the supermarket is ${amt(v,'m',0)}. What is the distance in meters (${ab('m',3)})?`},\n 'c12':{t:'g',a:K,b:B,v:'12.5',q:v=>`Fiona’s laptop computer weighs ${amt(v,'g',0)}. What is the weight of the computer in grams (${ab('g',3)})?`},\n 'c15':{t:'m',a:C,b:B,v:'43',  q:v=>`Renee cut a piece of string that is ${amt(v,'m',5)} long. What is the length of the piece of string in meters (${ab('m',3)})? Do not round.`}\n};\nfunction sgProblem(){const S=SG_BANK[String((window.SPEC||{}).qn)]||SG_BANK.b9;return {t:S.t,a:S.a,b:S.b,v:S.v,ans:shift(S.v,S.b-S.a),q:S.q(S.v)};}\nfunction goNextQ(){try{parent.postMessage({drill:'sg1',type:'next',qn:String(window.SPEC.qn)},'*')}catch(e){}}\n\n/* ---------- state ---------- */\nconst st={guided:false,p:null,step:1,tap:0,dir:0,dp:0,p0:0,wrong:false,done:false,solved:0};\nconst STEP_PROMPT={\n  2:p=>`How many jumps from <b>${ab(p.t,p.a)}<\/b> to <b>${ab(p.t,p.b)}<\/b>, and which way?`,\n  3:p=>{const k=Math.abs(p.b-p.a);return `Move the decimal point <b>${k} ${k===1?'place':'places'} ${p.b>p.a?'right':'left'}<\/b>.`},\n  4:p=>`Write the answer.`\n};\n\n/* ---------- staircase drawing ---------- */\nconst SX=20, SW=103, TOP=78, RISE=50, BOT=520;\nconst sx=i=>SX+i*SW, sy=i=>TOP+i*RISE, cx=i=>sx(i)+SW/2;\nfunction drawStairs(){\n  const p=st.p, s=$('stairs');\n  let h='';\n  for(let i=0;i<7;i++){\n    let cls='stair'+(PRE[i].base?' base':'');\n    const reveal=st.guided||st.done;            /* on-your-own problems: no hints on the stairs until solved */\n    if(reveal&&(st.step>1||st.tap>0)&&i===p.a) cls+=' start';\n    if(reveal&&st.step>1&&i===p.b) cls+=' end';\n    if(st.miss===i) cls+=' miss';\n    const y=sy(i);\n    h+=`<g class=\"${cls}\" data-i=\"${i}\" ${st.step===1&&!st.done?'tabindex=\"0\" role=\"button\"':''} aria-label=\"${PRE[i].w}: ${PRE[i].base?BASE[p.t]+'s, the base unit':name(p.t,i)} (${ab(p.t,i)})\">\n      <rect class=\"step\" x=\"${sx(i)}\" y=\"${y}\" width=\"${SW}\" height=\"${BOT-y}\" rx=\"6\"/>\n      <text class=\"w\" x=\"${cx(i)}\" y=\"${y+30}\" text-anchor=\"middle\">${PRE[i].w}<\/text>\n      <text class=\"p\" x=\"${cx(i)}\" y=\"${y+52}\" text-anchor=\"middle\">${PRE[i].base?'base':PRE[i].p}<\/text>\n      <text class=\"u\" x=\"${cx(i)}\" y=\"${y+92}\" text-anchor=\"middle\">${ab(p.t,i)}<\/text><\/g>`;\n  }\n  /* jumps from the start stair to the end stair, drawn once the count is right */\n  if(st.step>2&&(st.guided||st.done)){\n    const dir=Math.sign(p.b-p.a), k=Math.abs(p.b-p.a);\n    for(let j=0;j<k;j++){\n      const i0=p.a+j*dir, i1=i0+dir, x0=cx(i0), x1=cx(i1), y0=sy(i0)-8, y1=sy(i1)-8, top=Math.min(y0,y1)-38;\n      h+=`<path class=\"hop${st.anim?' draw':''}\" style=\"animation-delay:${j*.18}s\" d=\"M${x0} ${y0} Q${(x0+x1)/2} ${top} ${x1} ${y1}\"/>`;\n      h+=`<path class=\"hop${st.anim?' draw':''}\" style=\"animation-delay:${j*.18}s\" d=\"M${x1-9*dir} ${y1-10} L${x1} ${y1} L${x1+3*dir} ${y1-14}\"/>`;\n      h+=`<text class=\"hopn\" x=\"${(x0+x1)/2}\" y=\"${top+2}\" text-anchor=\"middle\">${j+1}<\/text>`;\n    }\n    h+=`<text class=\"hopcap\" x=\"380\" y=\"26\" text-anchor=\"middle\">${k} ${k===1?'jump':'jumps'} ${dir>0?'right':'left'}<\/text>`;\n  }\n  s.innerHTML=h;\n  s.classList.toggle('pick',st.step===1&&!st.done);\n  st.anim=false;\n}\n$('stairs').addEventListener('click',e=>{const g=e.target.closest('.stair');if(g)tapStair(+g.dataset.i)});\n$('stairs').addEventListener('keydown',e=>{\n  if(e.key!=='Enter'&&e.key!==' ') return;\n  const g=e.target.closest&&e.target.closest('.stair'); if(!g) return;\n  e.preventDefault(); e.stopPropagation(); tapStair(+g.dataset.i);\n});\n\n/* ---------- step 1: tap the starting unit, then the ending unit ---------- */\nfunction tapStair(i){\n  const p=st.p; if(st.step!==1||st.done) return;\n  const want=st.tap===0?p.a:p.b, u=ab(p.t,want);\n  if(i===want){\n    st.miss=null;\n    if(st.tap===0){st.tap=1; drawStairs(); say('good',`✓ ${u} is ${PRE[i].w} (${PRE[i].base?'the base unit':PRE[i].p}).`); setPrompt(`Now find <b>${ab(p.t,p.b)}<\/b>. Tap it.`); focusStair(p.b)}\n    else{say('good',`✓ ${u} is ${PRE[i].w} (${PRE[i].base?'the base unit':PRE[i].p}).`); goStep(2)}\n    return;\n  }\n  miss(); st.miss=i; drawStairs(); focusStair(i);\n  const pre=PRE[want];\n  say('bad',`That’s ${ab(p.t,i)}. ${pre.base?`${u} has no prefix: it’s the base unit, By.`:`${u} starts with ${pre.a}, which is ${pre.p}.`}`);\n}\nfunction focusStair(i){const g=document.querySelector(`#stairs .stair[data-i=\"${i}\"]`);if(g&&g.getAttribute('tabindex')!==null&&document.activeElement&&document.activeElement.closest&&document.activeElement.closest('#stairs'))g.focus()}\n\n/* ---------- work area ---------- */\nfunction setPrompt(h){$('prompt').innerHTML=h}\nfunction say(c,m){const f=$('feedback');f.className='feedback '+c;f.textContent=m}\nfunction miss(){st.wrong=true}\nfunction goStep(k){\n  st.step=k; st.anim=k===3;\n  drawStairs();\n  if(k===2) buildJumps();\n  if(k===3) buildMover();\n  if(k===4) buildAnswer();\n  setPrompt(STEP_PROMPT[k](st.p));\n}\n\n/* step 2 */\nfunction buildJumps(){\n  $('area').innerHTML=`<div class=\"jumps\"><input class=\"num\" id=\"jn\" inputmode=\"numeric\" maxlength=\"1\" autocomplete=\"off\" aria-label=\"Number of jumps\"> <span>jumps<\/span><\/div>\n    <div class=\"dirs\" role=\"group\" aria-label=\"Which way\">\n      <button class=\"dir\" type=\"button\" data-d=\"-1\" aria-pressed=\"false\" aria-keyshortcuts=\"L\">← Left <kbd>L<\/kbd><small>up the stairs<\/small><\/button>\n      <button class=\"dir\" type=\"button\" data-d=\"1\" aria-pressed=\"false\" aria-keyshortcuts=\"R\">Right → <kbd>R<\/kbd><small>down the stairs<\/small><\/button><\/div>`;\n  st.dir=0;\n  document.querySelectorAll('.dir').forEach(b=>b.addEventListener('click',()=>pickDir(+b.dataset.d)));\n  /* the number checks itself as soon as it's typed: no Enter needed */\n  $('jn').addEventListener('input',e=>{\n    const el=e.target; el.value=el.value.replace(/\\D/g,''); el.classList.remove('no','ok');\n    if(!el.value){say('','');return}\n    const p=st.p, k=Math.abs(p.b-p.a);\n    if(st.dir){checkJumps();return}\n    if(+el.value===k){el.classList.add('ok');say('good',`✓ ${k} ${k===1?'jump':'jumps'}. Now which way? Press L or R.`)}\n    else{miss();el.classList.add('no');say('bad',`Count each stair you step onto from ${ab(p.t,p.a)} to ${ab(p.t,p.b)}.`);el.select()}\n  });\n  setTimeout(()=>{const x=$('jn');if(x)x.focus()},30);\n}\nfunction pickDir(d){\n  if(st.step!==2||st.done) return;\n  st.dir=d; document.querySelectorAll('.dir').forEach(x=>x.setAttribute('aria-pressed',+x.dataset.d===d));\n  if($('jn').value) checkJumps(); else{say('info','Now type how many jumps.');$('jn').focus()}\n}\nfunction checkJumps(){\n  const p=st.p, k=Math.abs(p.b-p.a), dir=Math.sign(p.b-p.a), v=$('jn').value, from=ab(p.t,p.a), to=ab(p.t,p.b);\n  if(!v){say('info','Type how many jumps.');$('jn').focus();return}\n  if(!st.dir){say('info','Now pick a direction: press L for left or R for right.');return}\n  const okN=+v===k, okD=st.dir===dir;\n  if(okN&&okD){\n    $('jn').classList.add('ok');$('jn').disabled=true;\n    document.querySelectorAll('.dir').forEach(b=>{b.disabled=true;if(+b.dataset.d===dir)b.classList.add('ok')});\n    say('good',`✓ ${k} ${k===1?'jump':'jumps'} ${dir>0?'right, down the stairs':'left, up the stairs'}.`);\n    goStep(3); return;\n  }\n  miss();\n  $('jn').classList.toggle('no',!okN); $('jn').classList.toggle('ok',okN);\n  say('bad',okN?`Right number. Which way is ${to} from ${from} on the stairs?`:okD?`Right way. Count each stair you step onto from ${from} to ${to}.`:`Start on ${from} and step to ${to}. Count the stairs and watch which way you go.`);\n  if(!okN){$('jn').focus();$('jn').select()}\n}\n\n/* step 3: move the decimal point */\nfunction buildMover(){\n  const {p:p0}=parts(st.p.v); st.p0=p0; st.dp=p0;\n  $('area').innerHTML=`<div class=\"mover\" id=\"mover\"><\/div>\n    <div class=\"arrows\"><button class=\"arrow\" id=\"mvL\" type=\"button\" aria-label=\"Move the decimal point left\">◀<\/button>\n    <span class=\"moved\" id=\"moved\"><\/span>\n    <button class=\"arrow\" id=\"mvR\" type=\"button\" aria-label=\"Move the decimal point right\">▶<\/button><\/div>`;\n  $('mvL').onclick=()=>moveDot(-1); $('mvR').onclick=()=>moveDot(1);\n  drawMover(); setTimeout(()=>{const x=$('mvR');if(x)x.focus()},30);\n}\nfunction moveDot(d){\n  if(st.step!==3||st.done) return;\n  const nd=st.dp+d; if(Math.abs(nd-st.p0)>7) return;\n  st.dp=nd; drawMover();\n  const p=st.p, want=p.b-p.a, moved=st.dp-st.p0;\n  if(moved===want){checkMover();return}\n  if(moved&&Math.sign(moved)!==Math.sign(want)){miss();say('bad',`The jumps on the stairs go ${want>0?'right':'left'}. Move the decimal point that way.`)}\n  else say('','');\n}\nfunction drawMover(final){\n  const {dg}=parts(st.p.v), p0=st.p0, dp=st.dp, L=dg.length;\n  const lo=Math.min(0,dp,p0), hi=Math.max(L,dp,p0), CW=60, GAP=24, PADX=20, Y=70, H=80;\n  const W=PADX*2+(hi-lo)*CW+(hi-lo-1)*GAP, xb=k=>PADX+(k-lo)*(CW+GAP)-GAP/2;   /* x of the boundary before cell k */\n  const firstNZ=[...dg].findIndex(c=>c!=='0');\n  let h='';\n  for(let i=lo;i<hi;i++){\n    const x=PADX+(i-lo)*(CW+GAP), real=i>=0&&i<L;\n    if(real){\n      const fade=dg[i]==='0'&&(firstNZ<0||i<firstNZ)&&i<dp-1;\n      h+=`<rect class=\"cell\" x=\"${x}\" y=\"${Y}\" width=\"${CW}\" height=\"${H}\" rx=\"10\"/><text class=\"dig${fade?' fade':''}\" x=\"${x+CW/2}\" y=\"${Y+H/2+16}\" text-anchor=\"middle\">${dg[i]}<\/text>`;\n    }else{\n      const want=st.step>=4;\n      h+=`<rect class=\"cell gap${want&&!final?' want':''}\" x=\"${x}\" y=\"${Y}\" width=\"${CW}\" height=\"${H}\" rx=\"10\"/>`;\n      if(final) h+=`<text class=\"dig zero\" x=\"${x+CW/2}\" y=\"${Y+H/2+16}\" text-anchor=\"middle\">0<\/text>`;\n    }\n  }\n  /* where the decimal point started, the jumps it made, and where it is now */\n  if(dp!==p0) h+=`<circle class=\"dot0\" cx=\"${xb(p0)}\" cy=\"${Y+H-8}\" r=\"7\"/>`;\n  const dir=Math.sign(dp-p0);\n  for(let j=0;j<Math.abs(dp-p0);j++){\n    const a=xb(p0+j*dir), b=xb(p0+(j+1)*dir);\n    h+=`<path class=\"hop\" d=\"M${a} ${Y-6} Q${(a+b)/2} ${Y-46} ${b} ${Y-6}\"/><path class=\"hop\" d=\"M${b-9*dir} ${Y-16} L${b} ${Y-6} L${b+2*dir} ${Y-19}\"/>`;\n    h+=`<text class=\"hopn\" x=\"${(a+b)/2}\" y=\"${Y-38}\" text-anchor=\"middle\">${j+1}<\/text>`;\n  }\n  h+=`<circle class=\"dot\" cx=\"${xb(dp)}\" cy=\"${Y+H-8}\" r=\"8\"/>`;\n  $('mover').innerHTML=`<svg width=\"${W}\" height=\"${Y+H+14}\" viewBox=\"0 0 ${W} ${Y+H+14}\" role=\"img\" aria-label=\"Decimal point moved ${Math.abs(dp-p0)} ${dir>0?'right':'left'}\">${h}<\/svg>`;\n  const m=$('moved'); if(m) m.textContent=dp===p0?'':`${Math.abs(dp-p0)} ${dir>0?'right':'left'}`;\n}\nfunction checkMover(){\n  const p=st.p, k=Math.abs(p.b-p.a), dir=Math.sign(p.b-p.a), moved=st.dp-st.p0;\n  if(moved===k*dir){\n    $('mvL').disabled=$('mvR').disabled=true;\n    say('good',`✓ The decimal point moved ${k} ${k===1?'place':'places'} ${dir>0?'right':'left'}.`);\n    goStep(4); return;\n  }\n  miss();\n  if(!moved) say('bad','Use the arrows to move the decimal point.');\n  else if(Math.sign(moved)!==dir) say('bad',`You moved it ${dir>0?'left':'right'}. The jumps on the stairs go ${dir>0?'right':'left'}.`);\n  else say('bad',`You moved it ${Math.abs(moved)}. It needs to move ${k}, one for each jump.`);\n}\n\n/* step 4: write the answer */\nfunction buildAnswer(){\n  const p=st.p, mv=st.guided?$('mover').outerHTML:'';\n  const gaps=st.dp>parts(p.v).dg.length||st.dp<0;\n  $('area').innerHTML=`${mv}${st.guided?`<p class=\"tip\">${gaps?'Put a 0 in each empty box.':'Read the number with the decimal point where it is now.'}<\/p>`:''}\n    <div class=\"eq\"><span>${show(p.v)} ${ab(p.t,p.a)} =<\/span><input class=\"num wide\" id=\"ans\" inputmode=\"decimal\" autocomplete=\"off\" aria-label=\"Answer in ${name(p.t,p.b)}\"><span>${ab(p.t,p.b)}<\/span><\/div>`;\n  if(st.guided) drawMover();\n  $('ans').addEventListener('input',e=>{\n    const el=e.target; el.classList.remove('no'); clearTimeout(st.idleT);\n    if(norm(el.value)===norm(st.p.ans)){checkAnswer();return}\n    if(el.value.trim()) st.idleT=setTimeout(()=>{if(!st.done&&st.step===4&&!TI.open)checkAnswer(true)},2200);\n    else say('','');\n  });\n  setTimeout(()=>{const x=$('ans');if(x)x.focus()},30);\n}\nfunction checkAnswer(idle){\n  clearTimeout(st.idleT);\n  const p=st.p, el=$('ans'), got=norm(el.value), want=norm(p.ans);\n  if(!el.value.trim()){if(!idle){say('info','Type your answer.');el.focus()}return}\n  if(got===want){el.classList.add('ok');el.disabled=true;if(st.guided)drawMover(true);else st.anim=true;solved();return}\n  miss(); el.classList.add('no');\n  const strip=s=>(s||'').replace(/[0.]/g,'');\n  if(got===null) say('bad','Use only digits and one decimal point.');\n  else if(got===norm(p.v)) say('bad','That’s the number you started with. Read it where the decimal point is now.');\n  else if(got===norm(shift(p.v,p.a-p.b))) say('bad','That moves the decimal point the wrong way.');\n  else if(strip(got)===strip(want)) say('bad',st.guided?'Check the zeros: every empty box needs a 0.':'Check the zeros. Each place the decimal point jumps past an empty spot needs a 0.');\n  else say('bad',st.guided?'Read the digits in the boxes, with the decimal point where you moved it.':`Count the jumps from ${ab(p.t,p.a)} to ${ab(p.t,p.b)} on the stairs, then move the decimal point that many places.`);\n  if(!idle){el.focus(); el.select();}\n}\n\n/* ---------- check / show answer / next ---------- */\nfunction check(){\n  if(st.done||TI.open) return;\n  if(st.step===2) checkJumps(); else if(st.step===3) checkMover(); else if(st.step===4) checkAnswer();\n}\nfunction solved(){\n  st.solved++; updateCount();\n  say('good',`✓ ${show(st.p.v)} ${ab(st.p.t,st.p.a)} = ${show(st.p.ans)} ${ab(st.p.t,st.p.b)}`);\n  finish();\n}\nfunction finish(){\n  st.done=true; drawStairs();\n  $('area').insertAdjacentHTML('beforeend','<div class=\"sg-next\"><button class=\"btn primary\" id=\"nextQ\" type=\"button\">Next question<\/button><\/div>');\n  $('nextQ').onclick=()=>next(); setTimeout(()=>{const b=$('nextQ');if(b)b.focus()},30);\n  if(!st.reported){st.reported=true;\n    try{parent.postMessage({drill:'sg1',type:'done',qn:String(window.SPEC.qn),answer:show(st.p.ans)+' '+name(st.p.t,st.p.b,st.p.ans!=='1'),clean:!st.wrong},'*')}catch(e){}}\n}\n/* problems alternate: one guided step by step, the next on your own (type the answer) */\nfunction next(){\n  if(st.p){goNextQ();return}\n  st.guided=true;\n  st.p=sgProblem(); st.tap=0; st.miss=null; st.dir=0; st.wrong=false; st.done=false;\n  $('q').innerHTML=st.p.q;\n  $('area').innerHTML='';\n  say('','');\n  clearTimeout(st.nextT); clearTimeout(st.idleT);\n  /* make it obvious which kind of problem this is */\n  const md=$('mode');\n  md.className='mode'+(st.guided?'':' own');\n  md.innerHTML=st.guided\n    ?'<span class=\"ic\" aria-hidden=\"true\">We<\/span><div><h2>Let’s do this one together<\/h2><p>Follow the steps one at a time.<\/p><\/div>'\n    :'<span class=\"ic\" aria-hidden=\"true\">You<\/span><div><h2>Your turn: on your own<\/h2><p>No steps this time. Use the stairs to help you.<\/p><\/div>';\n  void md.offsetWidth; md.classList.add('pop');\n  document.querySelector('.stage').classList.toggle('together',st.guided);\n  document.querySelector('.stage').classList.toggle('own',!st.guided);\n  if(st.guided){\n    st.step=1;\n    setPrompt(`Find <b>${ab(st.p.t,st.p.a)}<\/b> on the stairs. Tap it.`);\n  }else{\n    st.step=4;\n    setPrompt('Find the answer and type it in.');\n    buildAnswer();\n  }\n  drawStairs(); updateCount();\n  if(document.activeElement&&document.activeElement!==document.body) document.activeElement.blur();   /* no stair looks picked before the student taps */\n}\ndocument.addEventListener('keydown',e=>{\n  if(TI.open){if(e.key==='Escape')closeTurnIn();return}\n  if(st.step===2&&!st.done&&/^[lr]$/i.test(e.key)&&!e.ctrlKey&&!e.metaKey&&!e.altKey){e.preventDefault();pickDir(e.key.toLowerCase()==='l'?-1:1);return}\n  if(st.step===3&&!st.done&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){e.preventDefault();moveDot(e.key==='ArrowLeft'?-1:1);return}\n  if(e.key!=='Enter') return;\n  const t=e.target;\n  if(t.tagName==='BUTTON'&&!t.classList.contains('arrow')) return;\n  e.preventDefault();\n  if(st.done){next();return}\n  check();\n});\n\n/* ---------- turning it in (Google Form) ----------\n   The same Google Form as the other drills: student code, number solved, drill name.\n   Students can turn in early, any time, as many times as they want; each time sends what's solved so far. */\nconst GOAL=20;\nconst FORM_URL='https://docs.google.com/forms/d/e/1FAIpQLScLjdoG75r1XORoNx4v6u-1TEzXcuQoJqQIvbbEmD_QlFFzmA/formResponse';\nconst DRILL_NAME='Metric Conversions';\nconst CODE_KEY='metric-student-code';\nconst TI={code:'',sent:null,pending:null,sending:false,note:'',open:false,auto:false};\ntry{TI.code=localStorage.getItem(CODE_KEY)||''}catch(e){}\nfunction saveCode(){try{localStorage.setItem(CODE_KEY,TI.code)}catch(e){}}\nconst escH=v=>String(v).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'})[c]);\nfunction updateCount(){}\nfunction openTurnIn(){if(TI.open)return;TI.open=true;TI.note='';$('turnBtn').textContent='Back to the problems';renderTurnIn()}\nfunction closeTurnIn(){TI.open=false;const m=$('tiModal');if(m)m.remove();$('turnBtn').textContent='Turn in';if(st.done){clearTimeout(st.nextT);st.nextT=setTimeout(next,800)}}\nfunction renderTurnIn(){\n  let m=$('tiModal');\n  if(!m){m=document.createElement('div');m.id='tiModal';m.className='ti-modal';document.body.appendChild(m)}\n  const n=st.solved, text=DRILL_NAME+': '+n, more=TI.sent!==null&&TI.sent!==text, showForm=TI.sent===null||more;\n  const chips=Array.from({length:GOAL},(_,i)=>`<span class=\"ti-q${i<n?' done':''}\">${i+1}<\/span>`).join('');\n  m.innerHTML=`<section class=\"ti-card\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"ti-title\">\n    <h2 id=\"ti-title\">Turn in<\/h2>\n    <p class=\"ti-sub\">You’ve solved <b>${n}<\/b> of ${GOAL} problems.${n>GOAL?' Nice work going past '+GOAL+'!':''}<\/p>\n    <div class=\"ti-grid\">${chips}<\/div>\n    <div class=\"ti-legend\"><span><span class=\"ti-q done\">&#10003;<\/span>solved<\/span><span><span class=\"ti-q\"><\/span>not yet<\/span><\/div>\n    <iframe name=\"ti_frame\" id=\"ti_frame\" title=\"Sending\" style=\"display:none\"><\/iframe>\n    <form id=\"tiForm\" action=\"${FORM_URL}\" method=\"POST\" target=\"ti_frame\"${showForm?'':' hidden'}>\n      <div class=\"ti-warn\">Type your <b>student code<\/b> carefully. Double-check it before you submit.<\/div>\n      <label for=\"tiCode\">Student code<\/label>\n      <input type=\"text\" id=\"tiCode\" placeholder=\"Your code\" autocomplete=\" \"Delia can buy 3 sweatshirts for a total of $72. How much would it cost if she were to buy 10 sweatshirts at the same price?\",\n  cells:[3,72,10,null],units:[\"sweatshirts\",\"$\"],\n  setup:SU([[3,\"sweatshirts\"],[72,\"$\"],[10,\"sweatshirts\"],[X,\"$\"]],\n    [[[3,\"sweatshirts\"],[72,\"$\"],[X,\"$\"],[10,\"sweatshirts\"]],\"Sweatshirts on top both sides.\"],\n    [[[72,\"sweatshirts\"],[3,\"$\"],[10,\"sweatshirts\"],[X,\"$\"]],\"It's 3 sweatshirts for $72.\"])},\n \"9\":{text:\"Phil can swim 5 miles in 70 minutes. How many miles can Phil swim if he swims for 42 minutes?\",\n  cells:[5,70,null,42],units:[\"miles\",\"min\"],xu:\"min\",\n  setup:SU([[5,\"miles\"],[70,\"min\"],[X,\"miles\"],[42,\"min\"]],\n    [[[5,\"miles\"],[70,\"min\"],[42,\"miles\"],[X,\"min\"]],\"42 is minutes, not miles.\"],\n    [[[70,\"miles\"],[5,\"min\"],[X,\"miles\"],[42,\"min\"]],\"It's 5 miles in 70 minutes.\"])},\n /* ---------- Ratios Study Guide 2 ---------- */\n \"b1.1\":{mc:true,q:{text:\"Four friends made pitchers of lemonade. Each ratio compares <b>scoops of lemonade mix<\/b> to <b>cups of water<\/b>. Three of the pitchers will taste exactly the same. Whose ratio is <b>not<\/b> equivalent to the other three?<br>A. Sebastian: \"+fr(6,10)+\"<br>B. Mila: \"+fr(10,35)+\"<br>C. Leo: 2 to 7<br>D. Shay: 12 to 42\",\n   simp:[{name:\"A\",r:[6,10],say:\"Simplify Sebastian’s ratio: \"+fr(6,10)},{name:\"B\",r:[10,35],say:\"Simplify Mila’s ratio: \"+fr(10,35)},{name:\"C\",r:[2,7],say:\"Simplify Leo’s ratio: 2 to 7.\"},{name:\"D\",r:[12,42],say:\"Simplify Shay’s ratio: 12 to 42.\"}],\n   simpOrder:\"Keep the same order: scoops first, then cups of water.\",\n   prompt:\"Now compare. Whose lemonade is <b>not<\/b> equivalent to the other three?\",\n   choices:[\"A. Sebastian \"+fr(6,10),\"B. Mila \"+fr(10,35),\"C. Leo 2 to 7\",\"D. Shay 12 to 42\"],correct:[0],\n   fbs:[\"\",\"Mila’s \"+fr(10,35)+\" simplifies to \"+fr(2,7)+\", the same as Leo’s and Shay’s.\",\"Leo’s 2 to 7 is the same as Mila’s and Shay’s.\",\"Shay’s 12 to 42 simplifies to 2 to 7, the same as Mila’s and Leo’s.\"],\n   hint:\"Simplify each one. Three of them come out the same.\",\n   why:\"Sebastian’s \"+fr(6,10)+\" = \"+fr(3,5)+\", but Mila’s, Leo’s and Shay’s all simplify to \"+fr(2,7)+\". Sebastian’s lemonade is much stronger\",a:\"A\"}},\n \"b1.3\":{text:\"Christian bought an 8 ounce jar of honey for $5.20. What is the unit price <mark class=one>per ounce<\/mark>?\",\n  cells:[5.2,8,null,1],units:[\"$\",\"oz\"],xu:\"oz\",one:true,note:\"Unit price means the price of 1 ounce\",\n  setup:SU([[5.2,\"$\"],[8,\"oz\"],[X,\"$\"],[1,\"oz\"]],\n    [[[8,\"$\"],[5.2,\"oz\"],[X,\"$\"],[1,\"oz\"]],\"It's $5.20 for 8 ounces.\"],\n    [[[5.2,\"$\"],[8,\"oz\"],[X,\"$\"],[1,\"$\"]],\"We want the price of 1 ounce, not 1 dollar.\"])},\n \"b1.4\":{text:\"Leo can run 5,600 meters in 14 minutes. If Leo keeps the same pace, how many meters can he run in 20 minutes?\",\n  cells:[5600,14,null,20],units:[\"m\",\"min\"],xu:\"min\",\n  setup:SU([[5600,\"m\"],[14,\"min\"],[X,\"m\"],[20,\"min\"]],\n    [[[14,\"m\"],[5600,\"min\"],[X,\"m\"],[20,\"min\"]],\"5,600 is meters, 14 is minutes.\"],\n    [[[5600,\"m\"],[14,\"min\"],[20,\"m\"],[X,\"min\"]],\"20 is minutes, not meters.\"])},\n \"b1.5\":{text:\"Hailey bought six books for $26.10. What is the unit price <mark class=one>per book<\/mark>?\",\n  cells:[26.1,6,null,1],units:[\"$\",\"books\"],xu:\"books\",one:true,note:\"Unit price means the price of 1 book\",\n  setup:SU([[26.1,\"$\"],[6,\"books\"],[X,\"$\"],[1,\"books\"]],\n    [[[6,\"$\"],[26.1,\"books\"],[X,\"$\"],[1,\"books\"]],\"It's $26.10 for 6 books.\"],\n    [[[26.1,\"$\"],[6,\"books\"],[X,\"$\"],[1,\"$\"]],\"We want the price of 1 book, not 1 dollar.\"])},\n \"b1.8\":{text:\"Cassie bought a 16-ounce pumpkin spice latte that contains 440 total calories. How many calories does the latte contain per ounce?\",\n  cells:[16,440,1,null],units:[\"oz\",\"calories\"],note:\"Per ounce means in 1 ounce\",\n  set
