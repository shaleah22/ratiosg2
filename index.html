<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ratios Study Guide 2</title>
<style>
:root{
  --ink:#1D2939; --muted:#667085; --line:#D0D5DD; --soft:#F2F4F7;
  --blue:#2F6FDE; --good:#1F8A5B; --goodBg:#E3F5EC; --extra:#8A5A00; --extraBg:#FFF6E0; --yellow:#F2B400;
  --sans:'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{font-family:var(--sans);color:var(--ink);background:#fff;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:6px 18px;border-bottom:1.5px solid var(--line)}
.brand{font-weight:800;font-size:20px;letter-spacing:-.01em;white-space:nowrap}
.brand small{display:block;font-weight:600;font-size:13px;color:var(--muted);letter-spacing:0}
.count{margin-left:auto;font-size:16px;color:var(--muted);white-space:nowrap}
.count b{font-size:24px;color:var(--ink);margin-left:6px}
.go{font:700 16px var(--sans);height:38px;padding:0 20px;border-radius:10px;border:2px solid var(--good);background:#fff;color:var(--good);cursor:pointer}
.go:hover{background:var(--goodBg)}
.nav{display:flex;align-items:center;justify-content:center;gap:3px;flex-wrap:wrap;padding:5px 18px 6px;border-top:1.5px solid var(--line)}
.nav .lab{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:0 2px 0 8px}
.chip{font:700 11px var(--sans);min-width:26px;height:26px;padding:0 3px;border-radius:7px;border:1.5px solid var(--line);background:#fff;color:var(--muted);cursor:pointer}
.chip.x{border-style:dashed}
.chip.done{background:var(--goodBg);border-color:var(--good);color:var(--good);border-style:solid}
.chip.cur{background:var(--ink);border-color:var(--ink);color:#fff}
/* questions that look like the quiz: a gold bar under the number */
.chip.qz{box-shadow:inset 0 -4px 0 #F2B400}
.chip.solo{border-style:dashed;border-color:#667085;color:#344054}
.chip.solo.done{border-style:dashed;border-color:var(--good);color:var(--good)}
.chip.solo.cur{border-style:solid;border-color:var(--ink);color:#fff}
.chip.qz.cur{box-shadow:inset 0 -4px 0 #F2B400}
.qzkey{display:inline-flex;align-items:center;gap:5px;margin-left:10px;font-size:12px;color:var(--muted);white-space:nowrap}
.qzdot{display:inline-block;width:18px;height:12px;border:1.5px solid var(--line);border-radius:4px;box-shadow:inset 0 -4px 0 #F2B400;background:#fff}
.qztag{font-size:13px;font-weight:800;padding:3px 10px;border-radius:999px;background:#FFF4CC;color:#7A5700;white-space:nowrap}
.chip:focus-visible,.go:focus-visible,.arr:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.qbar{display:flex;align-items:center;gap:10px;flex:1;min-width:0;padding-left:10px;border-left:1.5px solid var(--line)}
.qbar .qn{font-weight:800;font-size:16px;white-space:nowrap}
.qbar .tag{font-size:13px;font-weight:700;padding:3px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;border-radius:999px;background:var(--soft);color:var(--muted)}
.qbar .tag.x{background:var(--extraBg);color:var(--extra)}
.qbar .ok{font-size:13px;font-weight:700;color:var(--good)}
.qbar .sp{flex:1}
.arr{white-space:nowrap;flex:none;font:700 14px var(--sans);height:32px;padding:0 12px;border-radius:8px;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.arr:disabled{opacity:.35;cursor:default}
.framebox{flex:1;min-height:0;padding:4px 8px 8px}
iframe.drill{width:100%;height:100%;border:0;display:block}
.chip.dirs{padding:0 10px}

/* the title slide before question 1 */
.intro{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:24px}
.slide{width:100%;max-width:920px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:26px;
  border:2px solid var(--line);border-radius:22px;padding:clamp(28px,6vh,64px) clamp(20px,5vw,60px)}
.slide h1{margin:0;font-size:clamp(30px,4.6vw,54px);font-weight:800;letter-spacing:-.02em;line-height:1.1}
.slide h1 .nw{white-space:nowrap}
.slide .dlab{margin:0;font-size:15px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.slide .dbox{display:flex;align-items:center;gap:18px;text-align:left;background:#DCE7FB;border:3px solid var(--blue);border-radius:18px;padding:18px 26px}
.slide .dbox .ic{flex:none;font-size:44px;line-height:1}
.slide .dbox p{margin:0;font-size:clamp(22px,2.8vw,32px);font-weight:700;line-height:1.3}
.slide .meta{margin:0;font-size:17px;color:var(--muted)}
.slide .start{font:700 22px var(--sans);height:60px;padding:0 40px;border-radius:12px;border:2px solid var(--blue);background:var(--blue);color:#fff;cursor:pointer}
.slide .start:focus-visible{outline:4px solid var(--yellow);outline-offset:3px}
.slide .tiny{font-size:13px;color:var(--muted);margin-top:-14px}

/* turn in: the student code goes to the Google Form (same form as the other drills) */
.ti-modal{position:fixed;inset:0;z-index:150;background:rgba(15,23,42,.45);display:grid;place-items:center;padding:16px}
.ti-card{background:#fff;border:2px solid var(--good);border-radius:16px;padding:22px 26px;width:100%;max-width:600px;max-height:94vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.ti-card h2{margin:0;font-size:30px;color:var(--good)}
.ti-sub{margin:0;font-size:17px}
.ti-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.ti-q{display:inline-flex;align-items:center;justify-content:center;height:32px;border-radius:8px;border:1.5px solid #cbd5e1;background:#fff;color:#94a3b8;font-weight:bold;font-size:14px;cursor:pointer;font-family:var(--sans)}
.ti-q.done{background:var(--goodBg);border-color:var(--good);color:var(--good)}
.ti-legend{display:flex;flex-wrap:wrap;gap:16px;font-size:14px;color:var(--muted)}
.ti-legend>span{display:inline-flex;align-items:center;gap:6px}
.ti-legend .ti-q{width:22px;height:22px;font-size:11px;cursor:default}
#tiForm{display:flex;flex-direction:column;gap:8px}
#tiForm label{font-weight:bold}
.ti-warn{background:var(--goodBg);border-radius:10px;padding:8px 12px;font-size:15px}
#tiCode{font:18px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.2em;text-transform:uppercase;max-width:260px;padding:9px 12px;border:1.5px solid #cbd5e1;border-radius:10px}
#tiCode:focus{outline:2px solid var(--good);outline-offset:1px}
.ti-btn{font:700 17px var(--sans);height:48px;padding:0 20px;border-radius:10px;border:2px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer;align-self:flex-start}
.ti-btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.ti-feedback{margin:0;font-size:17px}
.ti-feedback:empty{display:none}
.ti-feedback .ok{color:var(--good);font-size:22px;font-weight:800}
@media (max-width:640px){
  .brand{font-size:18px}
  .ti-grid{grid-template-columns:repeat(6,1fr)}
  .nav .lab{flex-basis:100%;margin:4px 0 0}
}
</style>
</head>
<body>
<div class="top">
  <div class="brand">Ratios Study Guide 2</div>
  <div class="qbar" id="qbar">
    <span class="qn" id="qn"></span><span class="tag" id="tag"></span><span class="qztag" id="quizmark" hidden></span><span class="ok" id="okmark"></span>
    <span class="sp"></span>
    <button class="arr" id="prev" type="button" aria-label="Previous question">&larr; Back</button>
    <button class="arr" id="skip" type="button" aria-label="Next question">Skip &rarr;</button>
  </div>
  <div class="count" id="count"></div>
  <button class="go" id="turnBtn" type="button">Turn in</button>
</div>
<section class="intro" id="intro" aria-label="Directions" hidden>
  <div class="slide">
    <h1><span class="nw">Ratios Study Guide 2</span></h1>
    <p class="dlab">Directions</p>
    <div class="dbox"><span class="ic" aria-hidden="true">✏️</span><p>Show your work on paper for all problems.</p></div>
    
    <p class="meta" id="introMeta"></p>
    <button class="start" id="startBtn" type="button">Start</button>
    <div class="tiny">or press Enter</div>
  </div>
</section>

<div class="framebox" id="framebox"><iframe class="drill" id="frame" title="Question"></iframe></div>
<nav class="nav" id="nav" aria-label="Questions"></nav>

<script>

const QS=[
 {n:"b1.10",e:'pc',tag:"Proportion",fact:"Reese’s Pieces got famous when the alien in the movie <i>E.T.</i> ate them. The script first called for M&amp;M’s, but the company that makes them said no."},
 {n:"n1",e:'nh',tag:"On your own"},
 {n:"b9",e:'kh',tag:"King Henry",fact:"Kangaroo rats can go their whole lives without drinking water. They get it from the seeds they eat."},
 {n:"n2",e:'nh',tag:"On your own"},
 {n:"b14a",e:'cf',tag:"Big G",fact:"There’s an old saying, “A pint’s a pound the world around,” because a pint of water weighs about 1 pound. It isn’t quite true around the world, though: a British pint is bigger and weighs about 1¼ pounds."},

const ENG={"cf": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Conversion Factor / Dimensional Analysis Drill<\/title>\n<style>\n  * { box-sizing: border-box; }\n  html { font-size: clamp(16px, 0.55vw + 9.5px, 21px); }\n  :root {\n    --ink: #1f2937;\n    --soft: #6b7280;\n    --muted: #a8a29e;\n    --line: #e7e5e4;\n    --accent: #2563eb;\n    --hl: #fef3c7;\n  }\n  body {\n    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;\n    background: #f7f7f6; color: var(--ink);\n    display: flex; justify-content: center; align-items: flex-start;\n    min-height: 100vh; margin: 0; padding: 10px 10px 14px;\n  }\n  .container {\n    background: #fff; width: 100%; max-width: 1600px;\n    min-height: calc(100vh - 32px);\n    border: 1px solid var(--line); border-radius: 16px;\n    padding: 18px clamp(16px, 3vw, 48px) 22px; text-align: center;\n  }\n\n  /* ---- header ---- */\n  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 16px; }\n  .seg { display: inline-flex; background: #f3f4f6; border-radius: 999px; padding: 3px; }\n  .seg button {\n    border: none; background: none; color: var(--soft); cursor: pointer;\n    font-family: inherit; font-size: 0.82rem; font-weight: 600;\n    padding: 7px 14px; border-radius: 999px;\n  }\n  .seg button.active { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.10); }\n  .right-tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }\n  .sel, .linkbtn {\n    border: none; background: none; color: var(--muted); cursor: pointer;\n    font-family: inherit; font-size: 0.8rem; font-weight: 600; padding: 4px 2px;\n  }\n  .linkbtn:hover, .sel:hover { color: var(--accent); }\n\n  .progress { height: 3px; background: #f0efee; border-radius: 2px; overflow: hidden; margin-bottom: 22px; }\n  .progress-fill { height: 100%; width: 0; background: var(--accent); transition: width .25s ease; }\n\n  .problem-indicator { margin-bottom: clamp(12px, 2.5vh, 28px); }\n  .story { font-size: 1.45rem; font-weight: 600; line-height: 1.35; max-width: 34em; margin: 0 auto; color: var(--ink); }\n  .long-story .story { font-size: 1.15rem; max-width: 46em; }\n  .story-pic { font-size: 3.2rem; line-height: 1; margin-bottom: 8px; }\n  .story-row { display: flex; align-items: center; justify-content: center; gap: 24px; text-align: left; }\n  .story-row .story { margin: 0; max-width: 30em; }\n  .story-photo { height: clamp(180px, 30vh, 380px); width: auto; aspect-ratio: 4 / 3; max-width: 45%; object-fit: cover; border-radius: 12px; flex: none; }\n  @media (max-width: 700px){\n    .story-row { flex-direction: column; text-align: center; gap: 10px; }\n    .story-photo { width: 100%; max-width: 420px; height: 22vh; aspect-ratio: auto; }\n  }\n  @media (min-width: 701px) and (max-height: 780px){\n    .stage .calc-dock { padding-top: 0; }\n    .calc .ck { padding: 0.3em 0; }\n  }\n  .parts { list-style: none; padding: 0; margin: 12px 0 0; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }\n  .parts li { font-size: 0.9rem; font-weight: 600; padding: 0.35em 0.9em; border-radius: 999px; border: 1px solid var(--line); color: var(--soft); }\n  .parts li.now { border-color: var(--accent); color: var(--accent); background: #f5f9ff; }\n  .parts li.done { border-color: #bbf7d0; color: #15803d; background: #f0fdf4; }\n  .goal { margin-top: 6px; font-size: 1rem; font-weight: 600; color: var(--soft); }\n  .story mark { background: var(--hl); color: inherit; border-radius: 4px; padding: 0; box-shadow: inset 0 -0.14em 0 #f59e0b, 0 0 0 0.12em var(--hl); }\n  .goal.done { color: #15803d; font-size: 1.15rem; }\n\n  .drill-layout { display: flex; flex-direction: column; align-items: center; gap: clamp(14px, 2.4vh, 30px); }\n  .prompt-text {\n    font-size: 1.15rem; font-weight: 500; color: #374151; line ce-row.letter-col .letter-btn { justify-content: flex-start; text-align: left; padding: 4px 16px; }\n  .letter-btn .opt-h { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }\n  .letter-btn .lbox { width: 22px; height: 22px; border: 2px solid currentColor; border-radius: 5px; flex: none; display: inline-grid; place-items: center; font-size: 15px; }\n  .letter-btn.on { border-color: var(--accent, #2F6FDE); background: #EAF0FB; }\n  .letter-btn.on .lbox::after { content: '\\2713'; }\n  .letter-btn.no { border-color: #C2372F; background: #FCE8E6; }\n  .story .tank { float: right; margin: 0 0 6px 14px; }\n  .letter-extra { font-size: 1rem; color: var(--soft); margin-top: 10px; }\n  .unit.clash { color: #dc2626; text-decoration: wavy underline #dc2626; text-underline-offset: 5px; }\n<\/style>\n<\/head>\n<body>\n\n<div class=\"container\">\n  <div class=\"topbar\" style=\"display:none\">  <!-- the study guides don't show the long division switch -->\n    <div class=\"seg\" id=\"tabs\" style=\"display:none\"><\/div>\n    <div class=\"right-tools\">\n      <label class=\"sel ld-toggle\"><input type=\"checkbox\" id=\"ldBox\" onchange=\"setLongDiv(this.checked)\"> Long division<\/label>\n    <\/div>\n  <\/div>\n  <div class=\"progress\"><div class=\"progress-fill\" id=\"progressFill\"><\/div><\/div>\n\n  <div class=\"problem-indicator\" id=\"problemIndicator\"><\/div>\n\n  <div class=\"stage\">\n  <div class=\"drill-layout\">\n    <div class=\"prompt-text\" id=\"promptText\"><\/div>\n    <div class=\"work-wrap\"><div class=\"work-area\" id=\"exprArea\"><\/div><\/div>\n    <div class=\"work-wrap\"><div class=\"work-area\" id=\"workArea\"><\/div><\/div>\n    <div class=\"tray\" id=\"tray\"><\/div>\n    <div class=\"input-panel\" id=\"inputPanel\"><div class=\"feedback\" id=\"feedback\"><\/div><\/div>\n  <\/div>\n  <aside class=\"calc-dock\" id=\"calcDock\"><\/aside>\n  <\/div>\n\n  <div class=\"footer\" id=\"statsLine\"><\/div>\n  <div id=\"sgFactSlot\"><\/div>\n<\/div>\n\n<script>window.SPEC=__SPEC__;<\/script>\n<style>\n/* fun fact: inside the question box, at the bottom, just for fun */\n.sgfact{margin-top:auto;display:block;text-align:left;padding:8px 14px;border-radius:10px;background:#F4F0FF;border:1.5px dashed #B9A7EE;font:15px/1.4 'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif;color:#1D2939;font-weight:400;letter-spacing:0}\n.sgfact .sgf-l{font-weight:800;color:#5B3FC4;margin-right:6px;white-space:nowrap}\n.sgfact .sgf-n{display:block;font-size:12px;color:#667085;font-style:italic;margin-top:2px}\n.container.hasfact{display:flex;flex-direction:column}\n.container.hasfact>.sgfact{margin:auto auto 0;width:100%;max-width:720px}\n.visual>.sgfact{flex:none}\n<\/style>\n<script>\nwindow.SG_FACT=(window.SPEC&&window.SPEC.fact)||'';\nwindow.sgFactHTML=function(){return window.SG_FACT?'<div class=\"sgfact\" role=\"note\" aria-label=\"Fun fact\"><span class=\"sgf-l\">💡 Fun fact<\/span>'+window.SG_FACT+'<\/div>':'';};\n(function(){var sl=document.getElementById('sgFactSlot');if(!sl)return;\n  if(!window.SG_FACT){sl.remove();return}\n  sl.parentElement.classList.add('hasfact');sl.outerHTML=window.sgFactHTML();})();\n<\/script>\n\n<script>\n/* ============================================================\n   1.  DECIMAL STRING HELPERS\n   ============================================================ */\nfunction decCount(s){ var i = String(s).indexOf('.'); return i < 0 ? 0 : String(s).length - i - 1; }\n\nfunction clean(s){\n  s = String(s);\n  if (s.indexOf('.') >= 0){\n    s = s.replace(/0+$/, '');\n    if (s.charAt(s.length - 1) === '.') s = s.slice(0, -1);\n  }\n  s = s.replace(/^0+(?=\\d)/, '');\n  if (s === '' || s === '.') s = '0';\n  if (s.charAt(0) === '.') s = '0' + s;\n  return s;\n}\n\nfunction shiftRight(s, k){                 /* multiply a decimal string by 10^k */\n  var p = String(s).split('.'), ip = p[0], fp = p[1] || '';\n  while (fp.length < k) fp += '0';\n  ip = ip + fp.slice(0, k);\n  fp = fp.slice(k);\n  return clean(fp.length ? ip + '.' + fp : ip);\n}\n\nfunction insertDecimal(n, k){              /* integer n read with k decimal places */\n  var s = String(n);\n  while (s.length <= k) s = '0' + s;\n  return clean(k === 0 ? s : s.slice(0, s.length - k) + '.' + s.slice(s.length - k));\n}\n\nfunction toIE(s){                          /* -> {i: integer, e: decimal places} */\n  s = clean(s);\n  var e = decCount(s);\n  return { i: Math.round(Number(s) * Math.pow(10, e)), e: e };\n}\nfunction decMul(a, b){\n  var A = toIE(a), B = toIE(b);\n  return insertDecimal(A.i * B.i, A.e + B.e);\n}\n\nfunction variants(s){                      /* accepted alternate spellings */\n  var out = {};\n  out[s] = 1;\n  if (s.indexOf('.') < 0){ out[s + '.0'] = 1; out[s + '.'] = 1; }\n  else out[s + '0'] = 1;\n  if (s.charAt(0) === '0' && s.charAt(1) === '.') out[s.slice(1)] = 1;\n  return Object.keys(out);\n}\n\nfunction commafy(s){\n  var p = String(s).split('.'), ip = p[0];\n  ip = ip.replace(/\\B(?=(\\d{3})+(?!\\d))/g, ',');\n  return ip + (p[1] !== undefined ? '.' + p[1] : '');\n}\n\n/* ============================================================\n   2.  LONG DIVISION BUILDER\n   ============================================================ */\nvar CELLW = 34;\n\nfunction charGrid(numStr, k){\n  var chars = numStr.split('');\n  if (chars.indexOf('.') < 0) chars.push('.');\n  var dotIdx = chars.indexOf('.');\n  var after = chars.length - dotIdx - 1, added = 0;\n  while (after < k){ chars.push('0'); after++; added++; }\n\n  var firstAdded = chars.length - added;\n  var cells = chars.map(function(ch, i){\n    return '<div class=\"char-cell' + (added && i >= firstAdded ? ' added' : '') + '\">' + ch + '<\/div>';\n  }).join('');\n\n  var total = CELLW * chars.length;\n  var sx = CELLW * (dotIdx + 0.5), paths = '';\n  for (var i = 0; i < k; i++){\n    var ex = CELLW * (dotIdx + 2 + i), mid = (sx + ex) / 2;\n    var d1 = (i * 0.45).toFixed(2), d2 = (i * 0.45 + 0.34).toFixed(2);\n    paths += '<path class=\"arc-path\" style=\"animation-delay:' + d1 + 's\" d=\"M ' + sx + ',2 Q ' + sx + ',28 ' + mid + ',28 Q ' + ex + ',28 ' + ex + ',2\" />'\n           + '<polygon class=\"arc-arrow\" style=\"animation-delay:' + d2 + 's\" points=\"' + (ex - 5.5) + ',9 ' + ex + ',0 ' + (ex + 5.5) + ',9\" />';\n    sx = ex;\n  }\n  return {\n    html: '<div class=\"char-grid\">' + cells\n        + '<svg class=\"arc-svg\" viewBox=\"0 0 ' + total + ' 34\" style=\"width:' + total + 'px\">' + paths + '<\/svg><\/div>',\n    added: added\n  };\n}\n\nfunction loopAnimHtml(dividendStr, divisorStr, k){\n  var a = charGrid(divisorStr, k), b = charGrid(dividendStr, k);\n  return {\n    html: '<div class=\"anim-wrap\"><table class=\"ld-table\"><tr>'\n        + '<td class=\"ld-divisor\">' + a.html + '<\/td>'\n        + '<td class=\"ld-house-top ld-house-left\">' + b.html + '<\/td>'\n        + '<\/tr><\/table><\/div>',\n    duration: Math.round(k * 450 + 350 + 900),\n    added: a.added + b.added\n  };\n}\n\nfunction newRow(line){ return { line: !!line, cells: {} }; }\nfunction cloneRows(rows){\n  return rows.map(function(r){\n    var c = {};\n    for (var k in r.cells) c[k] = Object.assign({}, r.cells[k]);\n    return { line: r.line, cells: c };\n  });\n}\n\nvar PLACE_NAME = { 0: 'nearest whole number', 1: 'nearest tenth', 2: 'nearest hundredth' };\nvar PLACE_DIGIT = { 0: 'tenths', 1: 'hundredths', 2: 'thousandths' };\n/* returns {steps, finalGrid, answer, rounded, tooLong, maxCol} for N / D (both positive) */\nfunction buildDivision(dividendStr, divisorStr, places){\n  places = places == null ? 1 : places;\n  var ds = decCount(divisorStr);\n  var D = parseInt(shiftRight(divisorStr, ds), 10);\n  var N = shiftRight(dividendStr, ds);\n  var steps = [];\n\n  function setupGrid(divTxt, dvdTxt){\n    var rows = [newRow(), newRow()];\n    rows[1].cells[0] = { t: divTxt, cls: 'ld-divisor' };\n    dvdTxt.split('').forEach(function(ch, i){\n      rows[1].cells[i + 1] = { t: ch, cls: 'ld-house-top' + (i === 0 ? ' ld-house-left' : '') };\n    });\n    return rows;\n  }\n\n  if (ds === 0){\n    steps.push({ div: true, kind: 'info', duration: 1700,\n      prompt: 'The fraction bar means divide. Set up ' + commafy(dividendStr) + ' \\u00f7 ' + divisorStr + '.',\n      grid: setupGrid(divisorStr, dividendStr) });\n  } else {\n    /* show it, then just do the decimal move for them: no question here */\n    var power = Math.pow(10, ds);\n    steps.push({ div: true, kind: 'info', duration: 2600,\n      prompt: 'The fraction bar means divide: ' + commafy(dividendStr) + ' \\u00f7 ' + divisorStr + '.',\n      grid: setupGrid(divisorStr, dividendStr) });\n\n    var anim = loopAnimHtml(dividendStr, divisorStr, ds);\n    steps.push({ div: true, kind: 'anim',\n      prompt: 'To make ' + divisorStr + ' a whole number, multiply both numbers by ' + commafy(String(power))\n            + '. The decimal point moves ' + ds + ' place' + (ds > 1 ? 's' : '') + ' to the right in both'\n            + (anim.added ? ', with a zero added where we run out of digits.' : '.'),\n      html: anim.html, duration: anim.duration + 700 });\n\n    steps.push({ div: true, kind: 'info', duration: 1500,\n      prompt: 'Now divide ' + commafy(N) + ' by ' + D + '.',\n      grid: setupGrid(String(D), N) });\n  }\n\n  /* ---- the long division itself ---- */\n  var rows = [newRow(), newRow()];\n  rows[1].cells[0] = { t: String(D), cls: 'ld-divisor' };\n  var chars = N.split('');\n  chars.forEach(function(ch, i){\n    rows[1].cells[i + 1] = { t: ch, cls: 'ld-house-top' + (i === 0 ? ' ld-house-left' : '') };\n  });\n\n  var dotCols = {};\n  chars.forEach(function(ch, i){ if (ch === '.') dotCols[i + 1] = 1; });\n\n  function ensureRow(r){ while (rows.length <= r) rows.push(newRow()); return rows[r]; }\n  function put(r, c, t, cls){ ensureRow(r).cells[c] = { t: t, cls: cls || '' }; }\n  function colsFor(endCol, n){\n    var out = [], c = endCol;\n    while (out.length < n && c >= 1){ if (!dotCols[c]) out.push(c); c--; }\n    return out.reverse();\n  }\n  function snap(input, hl){\n    var g = cloneRows(rows);\n    if (hl) hl.forEach(function(rc){\n      if (g[rc[0]] && g[rc[0]].cells[rc[1]]) g[rc[0]].cells[rc[1]].cls = (g[rc[0]].cells[rc[1]].cls || '') + ' hl';\n    });\n    if (input){\n      while (g.length <= input.r) g.push(newRow());\n      g[input.r].cells[input.c] = { input: true, span: input.span || 1, maxlen: input.maxlen };\n    }\n    return g;\n  }\n\n  var cur = 0, curRow = 1, hasSub = false;\n  var qDigits = '', qDec = 0, dotInQuotient = false;\n  var dotInDividend = N.indexOf('.') >= 0;\n  var colCursor = chars.length, workCols = [];\n  var rounded = false, tooLong = false;\n\n  var queue = chars.map(function(ch, i){ return { col: i + 1, ch: ch }; });\n  var qi = 0, guard = 0;\n\n  while (guard++ < 90){\n    if (qi >= queue.length){\n      if (cur === 0) break;\n      if (qDec >= places + 1){ tooLong = true; break; }   /* handled below; only tiny quotients land here */\n      if (qDec >= 8){ tooLong = true; break; }\n      if (!dotInDividend){\n        colCursor++;\n        put(1, colCursor, '.', 'ld-house-top');\n        dotCols[colCursor] = 1;\n        dotInDividend = true;\n        queue.push({ col: colCursor, ch: '.' });\n      }\n      colCursor++;\n      put(1, colCursor, '0', 'ld-house-top');\n      queue.push({ col: colCursor, ch: '0', appended: true });\n    }\n    var item = queue[qi++];\n\n    if (item.ch === '.'){\n      steps.push({ div: true, kind: 'grid',\n        prompt: 'Bring the decimal point straight up into the answer \\u2014 type a period ( . )',\n        answers: ['.'],\n        hint: 'The decimal point in the answer sits directly above the one in the dividend.',\n        grid: snap({ r: 0, c: item.col, maxlen: 1 }, [[1, item.col]]) });\n      put(0, item.col, '.');\n      qDigits += '.';\n      dotInQuotient = true;\n      continue;\n    }\n\n    var d = +item.ch;\n\n    if (hasSub){\n      steps.push({ div: true, kind: 'grid',\n        prompt: item.appended ? 'No digits left \\u2014 bring down a 0 from the dividend.' : 'Bring down the ' + d + '.',\n        answers: [String(d)],\n        hint: 'Copy the ' + d + ' down next to the ' + cur + '.',\n        grid: snap({ r: curRow, c: item.col, maxlen: 1 },\n                   [[1, item.col]].concat(workCols.map(function(c){ return [curRow, c]; }))) });\n      put(curRow, item.col, String(d));\n      workCols = workCols.concat([item.col]);\n    } else {\n      workCols = workCols.concat([item.col]);\n    }\n\n    cur = cur * 10 + d;\n    var q = Math.floor(cur / D);\n\n    steps.push({ div: true, kind: 'grid',\n      prompt: 'How many times does ' + D + ' fit into ' + cur + '?',\n      answers: [String(q)],\n      hint: 'Multiply ' + D + ' by 1, 2, 3, \\u2026 Find the biggest number that keeps the product ' + cur + ' or less. If ' + D + ' is bigger than ' + cur + ', it doesn\\u2019t fit at all.',\n      grid: snap({ r: 0, c: item.col, maxlen: 1 },\n                 [[1, 0]].concat(workCols.map(function(c){ return [curRow, c]; }))) });\n    put(0, item.col, String(q));\n    qDigits += String(q);\n    if (dotInQuotient) qDec++;\n\n    /* one digit past the rounding place is as far as we go: if there is still a remainder,\n       stop here and round. */\n    if (qDec === places + 1 && cur - q * D !== 0){\n      if (parseFloat(clean(qDigits) || '0') >= Math.pow(10, -places)){ rounded = true; break; }\n      tooLong = true; break;\n    }\n\n    if (q > 0){\n      var prod = q * D, ps = String(prod);\n      var pcols = colsFor(item.col, ps.length);\n      var prow = curRow + 1, lrow = curRow + 2, drow = curRow + 3;\n      ensureRow(drow);\n      rows[lrow].line = true;\n\n      steps.push({ div: true, kind: 'grid',\n        prompt: 'What is ' + D + ' \\u00d7 ' + q + '? Write the product underneath.',\n        answers: [ps],\n        hint: 'Multiply the number outside, ' + D + ', by the digit you just wrote on top.',\n        grid: snap({ r: prow, c: pcols[0], span: item.col - pcols[0] + 1, maxlen: ps.length },\n                   workCols.map(function(c){ return [curRow, c]; })) });\n      if (pcols[0] - 1 >= 0) put(prow, pcols[0] - 1, '\\u2212');\n      ps.split('').forEach(function(ch, i){ put(prow, pcols[i], ch); });\n      for (var c2 = pcols[0]; c2 <= item.col; c2++) ensureRow(lrow).cells[c2] = { line: true };\n\n      var diff = cur - prod, dstr = String(diff);\n      var dcols = colsFor(item.col, dstr.length);\n      steps.push({ div: true, kind: 'grid',\n        prompt: 'Subtract: ' + cur + ' \\u2212 ' + prod,\n        answers: [dstr],\n        hint: 'Subtract the bottom number from the number above it. Line up the digits.',\n        grid: snap({ r: drow, c: dcols[0], span: item.col - dcols[0] + 1, maxlen: dstr.length },\n                   workCols.map(function(c){ return [curRow, c]; }).concat(pcols.map(function(c){ return [prow, c]; }))) });\n      dstr.split('').forEach(function(ch, i){ put(drow, dcols[i], ch); });\n\n      cur = diff; curRow = drow; hasSub = true; workCols = dcols;\n    }\n  }\n\n  var exact = clean(qDigits);\n  var exactRaw = qDigits.replace(/^0+(?=\\d)/, '');\n  if (exactRaw.charAt(0) === '.') exactRaw = '0' + exactRaw;\n  if (exactRaw === '') exactRaw = '0';\n\n  var answer = exact;\n  if (rounded){\n    var pr = exactRaw.split('.'), ip = pr[0], fp = pr[1] || '';\n    while (fp.length < places + 1) fp += '0';\n    var scaled = parseInt(ip + fp.slice(0, places + 1), 10);\n    var r = Math.floor((scaled + 5) / 10), p10 = Math.pow(10, places);\n    var whole = Math.floor(r / p10), rem = String(r % p10);\n    while (rem.length < places) rem = '0' + rem;\n    var padded = places ? whole + '.' + rem : String(whole);\n    answer = clean(padded);\n    var hd = fp.charAt(places);\n    steps.push({ div: true, kind: 'text',\n      prompt: 'There is still a remainder, so this decimal keeps going. Round ' + exactRaw + ' to the ' + PLACE_NAME[places] + '.',\n      answers: variants(answer).concat([padded]),\n      hint: 'Look at the ' + PLACE_DIGIT[places] + ' digit (' + hd + '). ' + (+hd >= 5 ? 'It is 5 or more, so round up.' : 'It is less than 5, so the digit before it stays.'),\n      grid: cloneRows(rows) });\n  }\n\n  var maxCol = 0;\n  rows.forEach(function(r){ for (var k in r.cells) maxCol = Math.max(maxCol, +k); });\n\n  return { steps: steps, finalGrid: cloneRows(rows), answer: answer,\n           rounded: rounded, tooLong: tooLong || guard >= 90, maxCol: maxCol };\n}\n\n/* ============================================================\n   2b.  MR DL  —  Multiply Right / Divide Left\n        Used instead of long division whenever the divisor is\n        10, 100, 1,000 ... (e.g. 1,060 / 1,000).\n   ============================================================ */\nfunction pow10Zeros(s){ return /^10+$/.test(String(s)) ? String(s).length - 1 : 0; }\n\nfunction shiftLeft(s, k){                  /* divide a decimal string by 10^k */\n  var p = clean(s).split('.'), ip = p[0], fp = p[1] || '';\n  while (ip.length <= k) ip = '0' + ip;\n  fp = ip.slice(ip.length - k) + fp;\n  ip = ip.slice(0, ip.length - k);\n  return clean(ip + '.' + fp);\n}\n\n/* the digits of numStr with the decimal point hopping k places to the LEFT */\nfunction charGridLeft(numStr, k){\n  var chars = String(numStr).split('');\n  if (chars.indexOf('.') < 0) chars.push('.');\n  var dotIdx = chars.indexOf('.'), added = 0;\n  while (dotIdx <= k){ chars.unshift('0'); dotIdx++; added++; }\n\n  var cells = chars.map(function(ch, i){\n    return '<div class=\"char-cell' + (i < added ? ' added' : '') + '\">' + ch + '<\/div>';\n  }).join('');\n\n  var total = CELLW * chars.length;\n  var sx = CELLW * (dotIdx + 0.5), paths = '';\n  for (var i = 0; i < k; i++){\n    var ex = CELLW * (dotIdx - 1 - i), mid = (sx + ex) / 2;\n    var d1 = (i * 0.45).toFixed(2), d2 = (i * 0.45 + 0.34).toFixed(2);\n    paths += '<path class=\"arc-path\" style=\"animation-delay:' + d1 + 's\" d=\"M ' + sx + ',2 Q ' + sx + ',28 ' + mid + ',28 Q ' + ex + ',28 ' + ex + ',2\" />'\n           + '<polygon class=\"arc-arrow\" style=\"animation-delay:' + d2 + 's\" points=\"' + (ex - 5.5) + ',9 ' + ex + ',0 ' + (ex + 5.5) + ',9\" />';\n    sx = ex;\n  }\n  return {\n    html: '<div class=\"anim-wrap\"><div class=\"char-grid\">' + cells\n        + '<svg class=\"arc-svg\" viewBox=\"0 0 ' + total + ' 34\" style=\"width:' + total + 'px\">' + paths + '<\/svg><\/div><\/div>',\n    added: added,\n    duration: Math.round(k * 450 + 350 + 900)\n  };\n}\n\nfunction mrdlCardHtml(active){\n  return '<div class=\"mrdl-card\"><div class=\"mrdl-head\">MR &nbsp; DL<\/div>'\n       + '<div class=\"mrdl-row' + (active === 'M' ? ' on' : '') + '\"><span class=\"big\">M<\/span>ultiply <span class=\"arw\">\\u2192<\/span> <span class=\"big\">R<\/span>ight<\/div>'\n       + '<div class=\"mrdl-row' + (active === 'D' ? ' on' : '') + '\"><span class=\"big\">D<\/span>ivide <span class=\"arw\">\\u2190<\/span> <span class=\"big\">L<\/span>eft<\/div>'\n       + '<\/div>';\n}\n\n/* what the digits literally read after the hop, e.g. 2,500 with k=2 -> \"25.00\" */\nfunction shiftLeftRaw(numStr, k){\n  var chars = String(numStr).split('');\n  if (chars.indexOf('.') < 0) chars.push('.');\n  var d = chars.indexOf('.');\n  while (d <= k){ chars.unshift('0'); d++; }\n  chars.splice(d, 1);\n  chars.splice(d - k, 0, '.');\n  return chars.join('');\n}\n\nfunction buildMrDl(dividendStr, divisorStr){\n  var k = pow10Zeros(divisorStr);\n  var answer = shiftLeft(dividendStr, k);\n  var raw = shiftLeftRaw(dividendStr, k);\n  var anim = charGridLeft(dividendStr, k);\n  var Dc = commafy(divisorStr), Nc = commafy(dividendStr);\n  var steps = [];\n\n  steps.push({ div: true, kind: 'info', duration: 2600,\n    prompt: 'The fraction bar means divide: ' + Nc + ' \\u00f7 ' + Dc + '. Dividing by 10, 100 or 1,000 is just a decimal-point move \\u2014 use <b>MR DL<\/b>.',\n    html: mrdlCardHtml(null) });\n\n  steps.push({ div: true, kind: 'choice',\n    prompt: 'We are <b>dividing<\/b>. Which way does the decimal point move?',\n    options: ['\\u2190 Left', 'Right \\u2192'], correct: 0,\n    hint: 'MR DL \\u2014 <b>M<\/b>ultiply moves it <b>R<\/b>ight, <b>D<\/b>ivide moves it <b>L<\/b>eft. This is division.',\n    html: mrdlCardHtml(null) });\n\n  steps.push({ div: true, kind: 'text',\n    prompt: 'How many places does the decimal point move?',\n    answers: [String(k)],\n    hint: 'Count the zeros in ' + Dc + '. The point hops one place for each zero.',\n    html: mrdlCardHtml('D') });\n\n  steps.push({ div: true, kind: 'anim',\n    prompt: 'Hop the decimal point ' + k + ' place' + (k > 1 ? 's' : '') + ' to the left'\n          + (anim.added ? ' \\u2014 write a placeholder zero wherever you run out of digits\\u2026' : '\\u2026'),\n    html: anim.html, duration: anim.duration });\n\n  steps.push({ div: true, kind: 'text',\n    prompt: 'So ' + Nc + ' \\u00f7 ' + Dc + ' = ?  Type the quotient.',\n    answers: variants(answer).concat([raw, raw.replace(/^0(?=\\.)/, '')]),\n    hint: 'Read the digits with the decimal point where it landed. Add a 0 in front of the point if nothing is there.',\n    html: anim.html });\n\n  return { steps: steps, answer: answer, rounded: false, tooLong: false, maxCol: 0,\n           mrdl: true, finalHtml: anim.html + '<div class=\"mrdl-final\">' + Nc + ' \\u00f7 ' + Dc + ' = ' + commafy(answer) + '<\/div>' };\n}\n\nfunction buildQuotient(dividendStr, divisorStr, places, roundMr){\n  if (!pow10Zeros(divisorStr)) return buildDivision(dividendStr, divisorStr, places);\n  var r = buildMrDl(dividendStr, divisorStr), dec = (r.answer.split('.')[1] || '');\n  if (roundMr && places != null && dec.length > places){\n    var raw = r.answer, p10 = Math.pow(10, places);\n    var rd = (Math.round(Number(raw) * p10) / p10).toFixed(places), d = dec.charAt(places);\n    r.steps.push({ div: true, kind: 'text', prompt: 'Round ' + raw + ' to the ' + PLACE_NAME[places] + '.',\n      answers: variants(clean(rd)).concat([rd]),\n      hint: 'Look at the ' + PLACE_DIGIT[places] + ' digit (' + d + '). ' + (+d >= 5 ? 'It is 5 or more, so round up.' : 'It is less than 5, so the digit before it stays.'),\n      html: r.finalHtml });\n    r.answer = clean(rd); r.rounded = true;\n  }\n  return r;\n}\n\n/* ============================================================\n   3.  UNIT RELATIONSHIPS  (from the two reference charts)\n   ============================================================ */\nvar RELS = [\n  /* the reference chart from the study guide: customary */\n  { a:'1', au:'ft',   b:'12',    bu:'in',    sys:'cust' },\n  { a:'1', au:'yd',   b:'36',    bu:'in',    sys:'cust' },\n  { a:'1', au:'yd',   b:'3',     bu:'ft',    sys:'cust' },\n  { a:'1', au:'mi',   b:'5280',  bu:'ft',    sys:'cust' },\n  { a:'1', au:'mi',   b:'1760',  bu:'yd',    sys:'cust' },\n  { a:'1', au:'lb',   b:'16',    bu:'oz',    sys:'cust' },\n  { a:'1', au:'T',    b:'2000',  bu:'lb',    sys:'cust' },\n  { a:'1', au:'c',    b:'8',     bu:'fl oz', sys:'cust' },\n  { a:'1', au:'pt',   b:'2',     bu:'c',     sys:'cust' },\n  { a:'1', au:'qt',   b:'2',     bu:'pt',    sys:'cust' },\n  { a:'1', au:'qt',   b:'4',     bu:'c',     sys:'cust' },\n  { a:'1', au:'gal',  b:'4',     bu:'qt',    sys:'cust' },\n  /* metric */\n  { a:'1', au:'km',   b:'1000',  bu:'m',     sys:'met' },\n  { a:'1', au:'m',    b:'100',   bu:'cm',    sys:'met' },\n  { a:'1', au:'cm',   b:'10',    bu:'mm',    sys:'met' },\n  { a:'1', au:'kg',   b:'1000',  bu:'g',     sys:'met' },\n  { a:'1', au:'g',    b:'1000',  bu:'mg',    sys:'met' },\n  { a:'1', au:'kL',   b:'1000',  bu:'L',     sys:'met' },\n  { a:'1', au:'L',    b:'1000',  bu:'mL',    sys:'met' },\n  /* between systems (the study guide's chart) */\n  { a:'1', au:'in',   b:'2.54',  bu:'cm',    sys:'btw' },\n  { a:'1', au:'ft',   b:'0.305', bu:'m',     sys:'btw', ap:1 },\n  { a:'1', au:'yd',   b:'0.914', bu:'m',     sys:'btw', ap:1 },\n  { a:'1', au:'mi',   b:'1.61',  bu:'km',    sys:'btw', ap:1 },\n  { a:'1', au:'oz',   b:'28.4',  bu:'g',     sys:'btw', ap:1 },\n  { a:'1', au:'lb',   b:'0.454', bu:'kg',    sys:'btw', ap:1 },\n  { a:'1', au:'fl oz',b:'29.6',  bu:'mL',    sys:'btw', ap:1 },\n  { a:'1', au:'qt',   b:'0.946', bu:'L',     sys:'btw', ap:1 },\n  { a:'1', au:'gal',  b:'3.79',  bu:'L',     sys:'btw', ap:1 }\n];\n\n/* ---- group every relationship into the table it lives on in the reference chart ---- */\nvar MEASURE = {};\n'in ft yd mi mm cm dm m dam hm km'.split(' ').forEach(function(u){ MEASURE[u] = 'len'; });\n's min hr day'.split(' ').forEach(function(u){ MEASURE[u] = 'time'; });\n'oz lb T mg cg dg g dag hg kg'.split(' ').forEach(function(u){ MEASURE[u] = 'wt'; });\n['tsp','tbsp','fl oz','c','pt','qt','gal','mL','cL','dL','L','daL','hL','kL'].forEach(function(u){ MEASURE[u] = 'cap'; });\n\nvar GROUP_LABEL = { len: 'Length Equivalents', wt: 'Weight / Mass Equivalents', cap: 'Capacity Equivalents', time: 'Time' };\nvar SYS_LABEL   = { cust: 'Customary', met: 'Metric', btw: 'Between Systems' };\n\n/* a unit pair may appear only ONCE anywhere in the deck, so the chart never\n   offers two rows that both \"work\" for the same conversion */\n(function(){\n  var seen = {};\n  RELS = RELS.filter(function(r){\n    var key = [r.au, r.bu].sort().join('|');\n    if (seen[key]) return false;\n    seen[key] = 1;\n    return true;\n  });\n})();\n\n/* one chart per kind of measure; inside it, a section per system */\nvar GROUPS = {};\nRELS.forEach(function(r){\n  r.grp = MEASURE[r.au] || MEASURE[r.bu];\n  /* the metric chart lists the small units first: \"1,000 mm = 1 m\" */\n  (GROUPS[r.grp] = GROUPS[r.grp] || []).push(r);\n});\n\nfunction relRowText(r){\n  if (r.grp === 'money') return r.au + r.a + ' \\u2248 ' + r.bu + r.b;\n  var big = r.a + ' ' + r.au, small = commafy(r.b) + ' ' + r.bu, eq = r.ap ? ' \\u2248 ' : ' = ';\n  return r.flip ? small + eq + big : big + eq + small;\n}\n\n/* directed edges: from -> to, with the fraction that does the job */\nvar EDGES = [];\nRELS.forEach(function(r){\n  EDGES.push({ from: r.bu, to: r.au, numVal: r.a, numUnit: r.au, denVal: r.b, denUnit: r.bu, sys: r.sys, ap: !!r.ap, rel: r });\n  EDGES.push({ from: r.au, to: r.bu, numVal: r.b, numUnit: r.bu, denVal: r.a, denUnit: r.au, sys: r.sys, ap: !!r.ap, rel: r });\n});\n\n/* rarely-taught prefixes stay in the deck (they are on the chart) but come up far less */\nvar RARE = { dm:1, dam:1, hm:1, dg:1, dag:1, hg:1, cL:1, dL:1, daL:1, hL:1, kL:1 };\nfunction edgeWeight(e){ return (RARE[e.from] || RARE[e.to]) ? 1 : 5; }\n\nvar EDGE_POOL = [];\nEDGES.forEach(function(e){ for (var i = 0; i < edgeWeight(e); i++) EDGE_POOL.push(e); });\n\nvar EDGES_FROM = {};\nEDGES.forEach(function(e){\n  var arr = EDGES_FROM[e.from] = EDGES_FROM[e.from] || [];\n  for (var i = 0; i < edgeWeight(e); i++) arr.push(e);\n});\n\n/* A short chart for one step: only the system the answer lives in (customary,\n   metric, or between systems), rarely-taught prefixes left out, at most 6 rows. */\nvar CHART_MAX = 6;\nfunction chartChoices(want){\n  var pool = (GROUPS[want.grp] || []).filter(function(r){\n    return r === want || (r.sys === want.sys && !RARE[r.au] && !RARE[r.bu]);\n  });\n  /* never so short that the answer is a giveaway: top up from the same system */\n  var extra = shuffle((GROUPS[want.grp] || []).filter(function(r){ return r.sys === want.sys && pool.indexOf(r) < 0; }));\n  while (pool.length < 3 && extra.length) pool.push(extra.shift());\n  pool = (GROUPS[want.grp] || []).filter(function(r){ return pool.indexOf(r) >= 0; });\n  if (pool.length > CHART_MAX){\n    var keep = [want].concat(shuffle(pool.filter(function(r){ return r !== want; })).slice(0, CHART_MAX - 1));\n    pool = pool.filter(function(r){ return keep.indexOf(r) >= 0; });   /* keep the chart's own order */\n  }\n  return pool;\n}\nvar MEASURE_NAME = { len: 'length', wt: 'weight', cap: 'capacity' };\nfunction chartTitle(want){\n  if (want.grp === 'money') return 'Exchange rates (November 2026)';\n  if (want.grp === 'time') return 'Time';\n  var m = MEASURE_NAME[want.grp] || 'units';\n  if (want.sys === 'met' && want.grp === 'wt') m = 'mass';\n  if (want.sys === 'cust') return 'Customary ' + m;\n  if (want.sys === 'met') return 'Metric ' + m;\n  return 'Customary and metric ' + (want.grp === 'wt' ? 'weight / mass' : m);\n}\n\n/* ---------- plan first: names, kinds and sizes of units ---------- */\nvar UNIT_NAME = {\n  'in': 'inches', 'ft': 'feet', 'yd': 'yards', 'mi': 'miles',\n  'mm': 'millimeters', 'cm': 'centimeters', 'dm': 'decimeters', 'm': 'meters', 'dam': 'dekameters', 'hm': 'hectometers', 'km': 'kilometers',\n  'oz': 'ounces', 'lb': 'pounds', 'T': 'tons',\n  'mg': 'milligrams', 'cg': 'centigrams', 'dg': 'decigrams', 'g': 'grams', 'dag': 'dekagrams', 'hg': 'hectograms', 'kg': 'kilograms',\n  'tsp': 'teaspoons', 'tbsp': 'tablespoons', 'fl oz': 'fluid ounces', 'c': 'cups', 'pt': 'pints', 'qt': 'quarts', 'gal': 'gallons',\n  'mL': 'milliliters', 'cL': 'centiliters', 'dL': 'deciliters', 'L': 'liters', 'daL': 'dekaliters', 'hL': 'hectoliters', 'kL': 'kiloliters',\n  's': 'seconds', 'min': 'minutes', 'hr': 'hours', 'day': 'days',\n  '$': 'dollars', '€': 'euros', '£': 'British pounds'\n};\nfunction unitKind(u){ return MEASURE[u] || ({ '$': 1, '€': 1, '£': 1 }[u] ? 'money' : null); }\n/* how big each unit is, in some small unit of its kind, so the drill can tell bigger from smaller */\nvar SIZE = (function(){\n  var size = {}, roots = { len: 'in', wt: 'oz', cap: 'fl oz', time: 's' }, changed = true;\n  Object.keys(roots).forEach(function(k){ size[roots[k]] = 1; });\n  while (changed){\n    changed = false;\n    RELS.forEach(function(r){\n      var a = +r.a, b = +r.b;\n      if (size[r.bu] && !size[r.au]){ size[r.au] = b * size[r.bu] / a; changed = true; }\n      else if (size[r.au] && !size[r.bu]){ size[r.bu] = a * size[r.au] / b; changed = true; }\n    });\n  }\n  return size;\n})();\n/* units of another kind, for the \"wrong kind of unit\" choice */\nvar OTHER_KIND = { len: ['lb', 'gal', 'hr'], wt: ['ft', 'L', 'min'], cap: ['lb', 'mi', 'hr'], time: ['ft', 'lb', 'gal'], money: ['ft', 'lb', 'hr'] };\nvar PLAN_WHY = { jump: 'Too big a jump.', dir: 'Wrong direction.', back: 'That goes back.', kind: 'Wrong kind of unit.', cur: 'Wrong money.' };\n\n/* One choice step per arrow of the plan. hops: [{from, to}]. chain: the hops follow one\n   another (ft -> in -> cm); otherwise each hop stands alone (a rate's top and bottom). */\nfunction planSteps(hops, chain){\n  var steps = [], visited = [hops[0].from], goal = hops[hops.length - 1].to;\n  hops.forEach(function(h, i){\n    var a = h.from, b = h.to, g = chain ? goal : b, k = unitKind(a);\n    var opts = [{ u: b, ok: true }];\n    if (chain && b !== g && !findEdge(a, g)) opts.push({ u: g, why: 'jump' });\n    else if (k === 'money'){\n      var other = ['$', '€', '£'].filter(function(x){ return x !== a && x !== b; })[0];\n      opts.push({ u: other, why: 'cur' });\n    } else {\n      var down = SIZE[b] < SIZE[a];\n      var cands = Object.keys(SIZE).filter(function(u){\n        return unitKind(u) === k && !RARE[u] && UNIT_NAME[u] && u !== a && u !== b && u !== g && visited.indexOf(u) < 0 &&\n               (down ? SIZE[u] > SIZE[a] : SIZE[u] < SIZE[a]);\n      });\n      cands.sort(function(x, y){ return Math.abs(Math.log(SIZE[x] / SIZE[a])) - Math.abs(Math.log(SIZE[y] / SIZE[a])); });\n      if (cands.length) opts.push({ u: cands[0], why: 'dir' });\n      else if (chain && i > 0) opts.push({ u: hops[i - 1].from, why: 'back' });\n    }\n    opts.push({ u: pick((OTHER_KIND[k] || OTHER_KIND.len).filter(function(u){ return u !== a && u !== b; })), why: 'kind' });\n    steps.push({ kind: 'plan', hop: i, hops: hops, chain: chain, options: shuffle(opts), shown: 0, result: 'none',\n      prompt: '<b>' + (UNIT_NAME[a] || a) + '<\/b> → ?',\n      hint: (UNIT_NAME[a] || a) + ' → ' + (UNIT_NAME[b] || b) + '.' });\n    visited.push(b);\n  });\n  return steps;\n}\n/* the road map: the units picked so far, the next one as \"?\", and the goal */\nfunction planHtml(st){\n  var done = st.hop, hops = st.hops, h = '<div class=\"plan-road\">';\n  function chip(u, cls){ return '<span class=\"pchip' + (cls ? ' ' + cls : '') + '\">' + u + '<\/span>'; }\n  var arrow = '<span class=\"parrow\">→<\/span>';\n  if (st.chain){\n    var units = [hops[0].from].concat(hops.slice(0, done).map(function(x){ return x.to; }));\n    var goal = hops[hops.length - 1].to;\n    units.forEach(function(u, i){ h += (i ? arrow : '') + chip(u, i === units.length - 1 && done < hops.length ? 'now' : ''); });\n    if (done < hops.length) h += arrow + chip('?', 'unknown') + '<span class=\"pgap\">…<\/span>' + chip(goal, 'goal');\n  } else {\n    hops.forEach(function(x, j){\n      h += '<span class=\"plan-pair\">' + chip(x.from, j === done ? 'now' : '') + arrow\n         + (j < done ? chip(x.to) : chip('?', 'unknown')) + '<\/span>';\n    });\n  }\n  return h + '<\/div>';\n}\n/* a chart fact written as a fraction, either way up */\nfunction factFracHtml(r, flipIt){\n  var t = flipIt ? [r.b, r.bu] : [r.a, r.au], b = flipIt ? [r.a, r.au] : [r.b, r.bu];\n  function q(v){ return CURRENCY[v[1]] ? '<span class=\"mf-u\">' + v[1] + '<\/span>' + v[0] : commafy(v[0]) + ' <span class=\"mf-u\">' + v[1] + '<\/span>'; }\n  return '<span class=\"mini-frac\"><span>' + q(t) + '<\/span><span class=\"mf-bar\"><\/span><span>' + q(b) + '<\/span><\/span>';\n}\nfunction randomOrient(rels){ return rels.map(function(){ return Math.random() < 0.5; }); }\n\nfunction relText(r){\n  return r.a + ' ' + r.au + ' ' + (r.ap ? '\\u2248' : '=') + ' ' + commafy(r.b) + ' ' + r.bu;\n}\n\n/* ============================================================\n   4.  PROBLEM GENERATION\n   ============================================================ */\nfunction pick(a){ return a[Math.floor(Math.random() * a.length)]; }\nfunction shuffle(a){\n  a = a.slice();\n  for (var i = a.length - 1; i > 0; i--){\n    var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;\n  }\n  return a;\n}\n\nfunction catOk(cat, edges){\n  if (cat === 'all') return true;\n  if (cat === 'within') return edges.every(function(e){ return e.sys !== 'btw'; });\n  if (cat === 'between') return edges.some(function(e){ return e.sys === 'btw'; });\n  return true;\n}\n\n\nfunction makeRateProblem(c){\n  var rp = assembleRate(c, false), versions = [rp];\n  if (false){                                   /* plan first sets the order, so no either-order twin */\n    var alt = assembleRate(c, true);\n    rp.alt = alt; alt.alt = rp; versions.push(alt);\n    /* first chart: both conversions are on offer, students pick where to start */\n    var trim = function(rel){\n      var list = rel.grp === 'money' ? MONEY_RELS : chartChoices(rel);\n      if (list.length <= 3) return list;\n      var keep = [rel].concat(shuffle(list.filter(function(x){ return x !== rel; })).slice(0, 2));\n      return list.filter(function(x){ return keep.indexOf(x) >= 0; });\n    };\n    var r0 = c.path[0].rel, r1 = c.path[1].rel, g0 = trim(r0), g1 = trim(r1);\n    var groups = [{ title: chartTitle(r0), rels: g0 }, { title: chartTitle(r1), rels: g1 }];\n    var all = g0.concat(g1);\n    versions.forEach(function(v){\n      var st = v.steps[1];\n      st.groups = groups; st.rels = all;\n      var part = function(k){ return 'the ' + (c.rate.sides[k] === 'den' ? 'bottom' : 'top') + ' (<b>' + convName(c.path[k], c.rate.sides[k]) + '<\/b>)'; };\n      var order = c.rate.sides[0] === 'num' ? [0, 1] : [1, 0];\n      st.prompt = 'Two changes to make: ' + part(order[0]) + ' and ' + part(order[1]) + '. Pick either one to start. Click it on a chart.';\n      st.hint = 'Click ' + relRowText(r0) + ', or ' + relRowText(r1) + '.';\n    });\n  }\n  versions.forEach(function(v){\n    v.story = c.story;\n    v.storyMarked = c.path.length === 1\n      ? (c.rate.sides[0] === 'den' ? markUnits(c.story, c.path[0].numUnit, c.path[0].denUnit)\n                                   : markUnits(c.story, c.path[0].denUnit, c.path[0].numUnit))\n      : null;\n    v.emoji = c.emoji;\n    v.photo = c.photo || null;\n  });\n  return rp;\n}\n\n/* ------------------------------------------------------------\n   The Big G: gallons, quarts, pints, cups (and fluid ounces).\n   No conversion factors here: students count in the picture,\n   then multiply (big unit -> small) or divide (small -> big).\n   ------------------------------------------------------------ */\nvar BIGG_IMG = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAoAAAAJwCAMAAAAugSAIAAAAkFBMVEX///////7///z+///+//z9//3//v/+/v7+/vz+/f7+/fv9/f79/fv9/Pz8/fz7/fz8+/v4+vvt7fDb0te+x921p7O4enS0TSVuf7NIWqUrT9ArT8wqTdAqTcwqTM+zSiazSiKwRh2sQRlAQ5onRLQiRsohOIVCJ3MhKjogKjogKTsgKTogKTkgKDkeJzgWHy+gdSmVAAC6V0lEQVR42u1dCVvqPNPO0mZp0jQtoCCC55zn9RIQ9P//u3dmUnBDFsUNyfd+z9ksDc3d2ecexn754rz9BX+VTGqutfMxBr3up6u6bnB1aNFvm7p2z39Muxijy7Xm8IFr7nZap7VcWSaZYkwIofNQVVX0tv0XR2DrdLq9Xq/f7w/+u1muycNa/tUAfgJ+rouorKsl3HysYqxCLgHbUsES4vTET+upsJKwrC1hteBwgDqE3CBBbXF3/3Ld4bq/W/P3iMkBgrELUGyRKIwvvcnxTvL0xE/ria4sY/QiKcY6AQ9ht1jhbHE7m85mDyJvNnv8p8lk+uQPs9vFXQvLeYIiArFucQiavXSnh35aCXvauZigEZumi8ibTO5a2N0uIXW7aNd8Pp/Cmt/Cmt0+W3P8UfgJ/MElFklG4qcBEAGHvU4rD2NwTuvT8/+N/sbD70xoJVGNQm9wkxQtyLsk5aYTxBqtFcae/Xn5148WwnOeroPfrWTjEodJHLbSMARz8kd+EfREBgs0rVIO/Qy09ipQuAi9BI9FUqytrHu0HiHtds2aP/vpR9eRRLxdTG4TpAmHCYadBk1BE2JVOXKAJGxOnAB5xEtJULlKGe/LVu71B5N5qyFJ1X74IoE4e4RCkoWl90apk0o+dntPgeiLUeHv0dwjubc09G4/cU1uQdJOWxSiKMQd2RgtgPB0TMe7Yqwjad1uK/hI7qFTMb393AXWIdx0Gd0BUZhAyOs6+tM5Han4S0mNBrUunvotyKAJ2mevmHUfC0BaeO/JdEbbWUzANyFJ6MqTFDwWkw+XlFK7EA2Cr9P7j7TufDqZLR2Fxe0tuB6fDsFbvG8Lw1sK17SSEG1CHwPGqznnp6TdjxZ6Tkslwc1sHY4bBN/0k+29ne3CFH5Em7BJgUIjuJT5KWnycxcIEZ9EXxccDtJzIGtuv+2aJBDeTZIgFGV0p6zdTxaAPsZk9SH67ih/dgsK79uuxYISfLekjftkEcaTU/JznY7W50hChcLLdMjfGYDon1CoEPY8bzHo3Mkp+SlrabErV5Lm7Q1Q9C0wl3tLNv+3ByC55Jg4IbfkbpIMQu/N8huenJJvvIQQ6PnqEB/QlzyOdfnb77rIMU8m4S3YrUkO8tpZRfm6EwK/eeSlxBTvCn2T25+8JoTBO8Ag+iSRIHha39jsM+R21ODzUr -----------------------------------------------------\n   Gas prices: a price per liter turned into a price per gallon,\n   and (two factors) into U.S. dollars. Prices and exchange rates\n   are averages for mid-November 2026.\n   ------------------------------------------------------------ */\nvar MONEY_RELS = [\n  { a: '1', au: '\\u20AC', b: '1.10', bu: '$', ap: 1, sys: 'money', grp: 'money' },\n  { a: '1', au: '\\u00A3', b: '1.31', bu: '$', ap: 1, sys: 'money', grp: 'money' }\n];\nfunction moneyEdge(rel){\n  return { from: rel.au, to: rel.bu, numVal: rel.b, numUnit: rel.bu, denVal: rel.a, denUnit: rel.au,\n           sys: 'money', ap: true, rel: rel };\n}\n\nfunction buildQty(c){\n  var D = '1', N = c.val;\n  c.path.forEach(function(e){ D = decMul(D, e.denVal); N = decMul(N, e.numVal); });\n  var div = D === '1' ? null : buildQuotient(N, D);\n  return assemble(c.val, c.path, N, D, div, div ? div.answer : clean(N), div ? div.rounded : false, c.path.length);\n}\n\nfunction buildTotalPart(amt, unit, price){\n  var N = decMul(amt, price);\n  var word = { L: 'liters', gal: 'gallons' }[unit] || unit, one = { L: 'liter', gal: 'gallon' }[unit] || unit;\n  var steps = [\n    { kind: 'info', shown: 1, result: 'none', gate: true,\n      prompt: 'Total cost = ' + word + ' \\u00d7 price per ' + one + '. The price is per ' + one + ', so use the ' + word + ' you pumped: '\n            + amt + ' ' + unit + ' over 1, times $' + price + ' for every 1 ' + unit + '.' },\n    { kind: 'cancel', fi: 0, shown: 1, result: 'none', uids: ['s', 'd0'], cancelUnit: unit,\n      prompt: 'Click <b>' + unit + '<\/b> to cancel it out.',\n      hint: unit + ' is on top of the first fraction and on the bottom of the price, so the two cancel.' },\n    { kind: 'exprInput', target: 'num', shown: 1, result: 'numInput', hl: 'num', calc: isGross([amt, price], N),\n      answers: variants(N),\n      prompt: 'Multiply straight across the <b>top<\/b>: ' + amt + ' \\u00d7 ' + price + '. Type the product in the numerator.',\n      hint: 'Multiply the two numbers on top.' },\n    /* the bottom is 1 \\u00d7 1 = 1, so the drill fills it in */\n    { kind: 'info', shown: 1, result: 'done', duration: 1100,\n      prompt: 'The bottom is 1 \\u00d7 1 = 1, so the gas cost about $' + toCents(N) + '.' }\n  ];\n  return {\n    total: true, startVal: amt, startUnit: unit, targetUnit: '$',\n    factors: [{ numVal: price, numUnit: '$', denVal: '1', denUnit: unit, edge: null,\n                tiles: [{ val: price, unit: '$', side: 'num' }, { val: '1', unit: unit, side: 'den' }] }],\n    prefill: [{ num: 0, den: 1 }],\n    N: N, D: '1', answer: toCents(N), approx: true, rounded: false, div: null, nFactors: 1, steps: steps,\n    miniContext: '', title: '', given: []\n  };\n}\n\nfunction buildChain(c){\n  var p1 = buildQty(c);\n  var eur = MONEY_RELS.filter(function(m){ return m.au === '\\u20AC'; })[0];\n  var p2 = makeRateProblem({ si: 1999, story: c.story, val: '1.99', emoji: c.emoji, path: [moneyEdge(eur)],\n                             rate: { val: '1.99', num: '\\u20AC', den: 'L', sides: ['num'] } });\n  var p3 = buildTotalPart(c.val, 'L', p2.answer);\n  var chain = { parts: [{ label: '1. Gallons pumped' }, { label: '2. Price in dollars per liter' }, { label: '3. Total cost in dollars' }] };\n  [p1, p2, p3].forEach(function(p){ p.story = c.story; p.storyMarked = null; p.emoji = c.emoji; p.chain = chain; });\n  p1.partIdx = 0; p2.partIdx = 1; p3.partIdx = 2;\n  p1.next = p2; p2.next = p3;\n  p1.steps[0].prompt = '<b>Part 1: How many gallons did you pump?<\/b><br>' + p1.steps[0].prompt;\n  p2.steps[0].prompt = '<b>Part 2: Change the price from euros to dollars.<\/b><br>' + p2.steps[0].prompt;\n  p3.steps[0].prompt = '<b>Part 3: Find what the gas cost.<\/b><br>' + p3.steps[0].prompt;\n  return p1;\n}\n\nfunction nextPart(){\n  if (!finished || !problem.next) return;\n  clearTimeout(successTimer);\n  problem = problem.next;\n  placements = problem.prefill ? problem.prefill.map(function(x){ return { num: x.num, den: x.den }; })\n                               : problem.factors.map(function(){ return { num: null, den: null }; });\n  cancels = {}; selectedTile = null;\n  stepIdx = 0; wrongCount = 0; finished = false;\n  awaitingStart = false; awaitingContinue = false;\n  el('workArea').innerHTML = '';\n  renderStep();\n}\n\n\nvar CURRENCY = { '\\u20AC': 1, '$': 1, '\\u00A3': 1 };\nfunction qty(valHtml, unitHtml, unit){             /* $8.30, but 3.79 L */\n  return CURRENCY[unit] ? unitHtml + valHtml : valHtml + unitHtml;\n}\nfunction moneyText(unit, v){ return unit + v; }\nfunction qtyText(unit, v){ return CURRENCY[unit] ? unit + v : commafy(v) + ' ' + unit; }\nfunction toCents(v){ return (Math.round(parseFloat(v) * 100 + 1e-7) / 100).toFixed(2); }\n\nvar RATE_NAMES = { 'L': 'liters', 'gal': 'gallons', '\\u20AC': 'euros', '\\u00A3': 'pounds', '$': 'dollars',\n  'mi': 'miles', 'ft': 'feet', 'km': 'kilometers', 'm': 'meters', 'hr': 'hours', 'min': 'minutes', 's': 'seconds' };\nvar RATE_SING = { 'gal': 'gallon', 'L': 'liter', 's': 'second', 'hr': 'hour', 'min': 'minute', 'ft': 'foot', 'mi': 'mile', 'm': 'meter', 'km': 'kilometer' };\n/* \"miles \\u2192 feet\": the unit a factor gets rid of, then the unit it brings in */\nfunction convName(e, side){\n  return side === 'den' ? RATE_NAMES[e.numUnit] + ' \\u2192 ' + RATE_NAMES[e.denUnit]\n                        : RATE_NAMES[e.denUnit] + ' \\u2192 ' + RATE_NAMES[e.numUnit];\n}\n\nfunction assembleRate(c, moneyFirst){\n  var r = c.rate, factors = [], steps = [];\n  var numU = r.num, denU = r.den, numUid = 's', denUid = 'sd';\n  var path = c.path.slice(), sides = r.sides.slice();\n  if (moneyFirst && path.length > 1){ path.reverse(); sides.reverse(); }\n\n  var NAMES = RATE_NAMES, word = r.word || 'price';\n  /* where the units have to end up, e.g. ft on top and s on the bottom */\n  var goalNum = r.num, goalDen = r.den;\n  path.forEach(function(e, i){ if (sides[i] === 'den') goalDen = e.denUnit; else goalNum = e.numUnit; });\n  var goalText = 'Goal: <b>' + goalNum + '<\/b> on top and <b>' + goalDen + '<\/b> on the bottom ('\n               + RATE_NAMES[goalNum] + ' per ' + (RATE_SING[goalDen] || goalDen) + ').';\n  var two = path.length > 1;\n  var moneyOnly = !two && sides[0] === 'num';\n  var planText = two\n    ? 'You need two conversions, <b>' + convName(c.path[0], r.sides[0]) + '<\/b> and <b>' + convName(c.path[1], r.sides[1]) + '<\/b>. You can do them in either order.'\n    : moneyOnly\n      ? 'Change ' + NAMES[r.num] + ' to ' + NAMES[goalNum] + '. The ' + word + ' stays per ' + (RATE_SING[r.den] || r.den) + '.'\n      : 'Change ' + NAMES[r.den] + ' to gallons. The answer stays in ' + NAMES[r.num] + '.';\n  /* plan first: which unit changes into which */\n  var pnu = r.num, pdu = r.den, hops = [];\n  path.forEach(function(e, i){\n    if (sides[i] === 'den'){ hops.push({ from: pdu, to: e.denUnit }); pdu = e.denUnit; }\n    else { hops.push({ from: pnu, to: e.numUnit }); pnu = e.numUnit; }\n  });\n  if (path.length > 1) planSteps(hops, false).forEach(function(st){ steps.push(st); });   /* one factor: no plan */\n  steps.push({ kind: 'info', shown: 0, result: 'none', gate: true,\n    prompt: 'Start with the ' + word + ' as a fraction: ' + qtyText(r.num, r.val) + ' for every 1 ' + r.den + '.' });\n\n  path.forEach(function(e, i){\n    var side = sides[i], money = e.rel.grp === 'money';\n    var cancelUnit = side === 'den' ? denU : numU;\n    var newUnit = side === 'den' ? e.denUnit : e.numUnit;\n    factors.push({ numVal: e.numVal, numUnit: e.numUnit, denVal: e.denVal, denUnit: e.denUnit, edge: e,\n      tiles: shuffle([{ val: e.numVal, unit: e.numUnit, side: 'num' }, { val: e.denVal, unit: e.denUnit, side: 'den' }]) });\n\n    var chartRels = money ? MONEY_RELS : chartChoices(e.rel);\n    steps.push({ kind: 'chart', fi: i, shown: i + 1, result: 'none', grp: e.rel.grp,\n      rels: chartRels, orient: randomOrient(chartRels),\n      title: chartTitle(e.rel),\n      prompt: (two && i === 1\n                ? '<b>Now the other one: ' + NAMES[cancelUnit] + ' \\u2192 ' + NAMES[newUnit] + '.<\/b> '\n                : '')\n            + 'The ' + (side === 'den' ? 'bottom' : 'top') + ' is in <b>' + cancelUnit + '<\/b>, but we want <b>' + newUnit + '<\/b>. '\n            + 'Which ' + (money ? 'exchange rate' : 'equivalency') + ' links <b>' + cancelUnit + '<\/b> and <b>' + newUnit + '<\/b>? Click it on the chart.',\n      hint: 'Look for the one row that has both ' + cancelUnit + ' and ' + newUnit + ' in it.' });\n\n    if (side === 'den'){\n      steps.push({ kind: 'flip', fi: i, shown: i + 1, result: 'none', cancelUnit: cancelUnit, cancelTop: true,\n        prompt: 'Flip it, or keep it?',\n        hint: cancelUnit + ' is on the BOTTOM of the ' + word + ', so it has to be on TOP of this fraction to cancel.' });\n      steps.push({ kind: 'cancel', fi: i, shown: i + 1, result: 'none', cancelUnit: cancelUnit, uids: [denUid, 'n' + i],\n        prompt: '<b>' + cancelUnit + '<\/b> is on the bottom of the ' + word + ' and on top of this fraction. Click <b>' + cancelUnit + '<\/b> to cancel it out.',\n        hint: cancelUnit + ' is on the bottom of the ' + word + ' and on top of this fraction, so the two cancel.' });\n      denU = newUnit; denUid = 'd' + i;\n    } else {\n      steps.push({ kind: 'flip', fi: i, shown: i + 1, result: 'none', cancelUnit: cancelUnit,\n        prompt: 'Flip it, or keep it?',\n        hint: cancelUnit + ' is on TOP of the ' + word + ', so it has to be on the BOTTOM of this fraction to cancel.' });\n      steps.push({ kind: 'cancel', fi: i, shown: i + 1, result: 'none', cancelUnit: cancelUnit, uids: [numUid, 'd' + i],\n        prompt: '<b>' + cancelUnit + '<\/b> is on top of the ' + word + ' and on the bottom of this fraction. Click <b>' + cancelUnit + '<\/b> to cancel it out.',\n        hint: cancelUnit + ' is on top in one fraction and on the bottom in the other, so the two cancel.' });\n      numU = newUnit; numUid = 'n' + i;\n    }\n  });\n\n  /* pause to check the units before any arithmetic */\n  steps.push({ kind: 'info', shown: factors.length, result: 'none', gate: true,\n    prompt: '<b>Check the units.<\/b> Everything else canceled, so <b>' + numU + '<\/b> is on top and <b>' + denU + '<\/b> is on the bottom: '\n          + RATE_NAMES[numU] + ' per ' + (RATE_SING[denU] || denU) + ', just what we want. Now multiply.' });\n\n  var numVals = [r.val].concat(factors.map(function(f){ return f.numVal; }));\n  var denVals = ['1'].concat(factors.map(function(f){ return f.denVal; }));\n  var N = '1', D = '1';\n  numVals.forEach(function(v){ N = decMul(N, v); });\n  denVals.forEach(function(v){ D = decMul(D, v); });\n  var numChain = numVals.map(commafy).join(' \\u00d7 '), denChain = denVals.map(commafy).join(' \\u00d7 ');\n\n  steps.push({ kind: 'exprInput', target: 'num', shown: factors.length, result: 'numInput', hl: 'num', calc: isGross(numVals, N),\n    answers: variants(N),\n    prompt: 'Multiply straight across the <b>top<\/b>: ' + numChain + '. Type the product in the numerator.',\n    hint: 'Multiply all the numbers on the top together: ' + numChain + '.' });\n  /* a bottom of 1 is filled in for them: no need to type it */\n  if (D !== '1') steps.push({ kind: 'exprInput', target: 'den', shown: factors.length, result: 'denInput', hl: 'den', calc: false,\n    answers: variants(D),\n    prompt: 'Now multiply straight across the <b>bottom<\/b>: ' + denChain + '. Type the product in the denominator.',\n    hint: 'Multiply all the numbers on the bottom together: ' + denChain + '.' });\n  var answer, rounded = false, div = null;\n  if (D === '1'){\n    steps.push({ kind: 'info', shown: factors.length, result: 'done', duration: 1100,\n      prompt: 'The bottom is ' + denChain + ' = 1 ' + denU + ', so the top is the ' + word + ' for one ' + ({ gal: 'gallon', L: 'liter', s: 'second' }[denU] || denU) + ': ' + qtyText(numU, N) + '.' });\n    var cents = toCents(N), third = (String(N).split('.')[1] || '').charAt(2) || '0';\n    steps.push({ kind: 'text', shown: factors.length, result: 'done',\n      prompt: 'Money only goes to the cent (hundredths). Round ' + moneyText(numU, N) + ' to the nearest cent.',\n      answers: variants(cents).concat(variants(clean(cents))),\n      hint: 'Look at the thousandths digit (' + third + '). ' + (+third >= 5 ? 'It is 5 or more, so round the cents up.' : 'It is less than 5, so the cents stay the same.') });\n    answer = cents; rounded = true;\n  } else {\n    div = buildQuotient(N, D);\n    div.steps.forEach(function(st){ steps.push(st); });\n    answer = div.answer; rounded = div.rounded;\n  }\n\n  return {\n    rate: true, startVal: r.val, startUnit: r.num, startDenUnit: r.den, targetUnit: numU, targetDenUnit: denU,\n    factors: factors, N: N, D: D, answer: answer, rounded: rounded,\n    approx: rounded || path.some(function(e){ return e.ap; }),\n    div: div, nFactors: factors.length, steps: steps, miniContext: commafy(N) + ' \\u00f7 ' + commafy(D),\n    title: '', given: []\n  };\n}\n/* ============================================================\n   4b.  THE STUDY GUIDE QUESTIONS (picked by window.SPEC.qn)\n   ============================================================ */\n/* the teacher's own photos, for the two problems the conversion factor drill opens with */\nvar ICEFIELD_PHOTO = { src: '',\n  alt: 'A turquoise glacier lake surrounded by forest and mountains along the Icefields Parkway in Canada' };\nvar SECEDA_PHOTO = { src: '',\n  alt: 'The jagged Seceda ridge rising above green meadows and mountain huts in the Dolomites, Italy' };\n\nvar BANK = {\n  /* warm-ups from the conversion factor drill (its first two, then three more) */\n  'p1': { story: 'You\\u2019re driving the Icefields Parkway in Canada, where the speed limit is 90 kilometers per hour. How fast is that in miles per hour?',\n          val: '90', route: 'km>mi', photo: ICEFIELD_PHOTO,\n          rate: { val: '90', num: 'km', den: 'hr
